<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill splitter · Verse</title>
<style>
:root { --bg:#0f1115; --fg:#e8e8e8; --acc:#4ade80; --card:#1a1d24; --border:#2a2e37; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); line-height:1.4; }
header { padding:1rem; border-bottom:1px solid var(--border); }
h1 { margin:0; font-size:1.4rem; }
.container { max-width:720px; margin:0 auto; padding:1rem; }
section { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; margin-bottom:1rem; }
h2 { margin:0 0 0.5rem; font-size:1.1rem; }
label { display:block; margin:0.5rem 0 0.2rem; font-size:0.9rem; }
input, select, button { padding:0.5rem; border-radius:4px; border:1px solid var(--border); background:#111; color:var(--fg); font:inherit; }
button { background:var(--acc); color:#000; border:none; cursor:pointer; font-weight:600; }
button:hover { filter:brightness(1.1); }
.row { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-bottom:0.5rem; }
.people-list, .items-list { display:flex; flex-wrap:wrap; gap:0.4rem; margin:0.5rem 0; }
.chip { background:#222; padding:0.3rem 0.6rem; border-radius:999px; font-size:0.85rem; display:flex; align-items:center; gap:0.3rem; }
.chip button { background:transparent; color:var(--fg); padding:0 0.3rem; font-size:1rem; }
.item { border:1px solid var(--border); padding:0.5rem; border-radius:6px; margin-bottom:0.5rem; }
.shares { display:flex; flex-wrap:wrap; gap:0.4rem; }
.shares label { font-size:0.8rem; display:flex; align-items:center; gap:0.2rem; }
.totals { font-size:1.1rem; }
.bar-row { display:flex; align-items:center; gap:0.5rem; margin:0.3rem 0; }
.bar { height:1.2rem; background:var(--acc); border-radius:4px; min-width:2px; }
.person-name { min-width:6rem; }
footer { text-align:center; font-size:0.8rem; opacity:0.7; padding:1rem; }
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>Bill splitter</h1>
    <p>Add people and items, set tax & tip, see who owes what. Saved on this device.</p>
  </div>
</header>
<div class="container">
  <section>
    <h2>People</h2>
    <div class="row">
      <input id="personInput" placeholder="Add a name" />
      <button id="addPerson">Add</button>
    </div>
    <div id="peopleList" class="people-list"></div>
  </section>

  <section>
    <h2>Items</h2>
    <div class="row">
      <input id="itemName" placeholder="Item name" style="flex:1" />
      <input id="itemPrice" type="number" step="0.01" placeholder="Price" style="width:6rem" />
      <button id="addItem">Add item</button>
    </div>
    <div id="itemsList"></div>
  </section>

  <section>
    <h2>Tax & tip</h2>
    <div class="row">
      <label>Tax % <input id="taxPct" type="number" step="0.1" value="8.5" style="width:5rem" /></label>
      <label>Tip % <input id="tipPct" type="number" step="0.1" value="18" style="width:5rem" /></label>
    </div>
  </section>

  <section>
    <h2>Totals</h2>
    <div id="summary" class="totals"></div>
    <div id="bars"></div>
    <div class="row" style="margin-top:1rem">
      <button id="copyBtn">Copy summary</button>
      <button id="csvBtn">Download CSV</button>
      <button id="clearBtn">Clear all</button>
    </div>
  </section>
</div>
<footer>Everything stays on this device. Works offline.</footer>

<script>
const $ = id => document.getElementById(id);
let people = [];
let items = [];
let taxPct = 8.5;
let tipPct = 18;

function load() {
  try {
    const raw = localStorage.getItem('verse-bill-splitter');
    if (raw) {
      const data = JSON.parse(raw);
      people = data.people || [];
      items = data.items || [];
      taxPct = data.taxPct ?? 8.5;
      tipPct = data.tipPct ?? 18;
    }
  } catch (e) {}
  $('taxPct').value = taxPct;
  $('tipPct').value = tipPct;
  render();
}

function save() {
  try {
    localStorage.setItem('verse-bill-splitter', JSON.stringify({ people, items, taxPct, tipPct }));
  } catch (e) {}
}

function renderPeople() {
  const el = $('peopleList');
  el.innerHTML = people.map((p, i) =>
    `<span class="chip">${p} <button data-i="${i}" class="rm-person">×</button></span>`
  ).join('');
  el.querySelectorAll('.rm-person').forEach(btn => {
    btn.onclick = () => { 
      const removed = people[+btn.dataset.i];
      people.splice(+btn.dataset.i, 1); 
      items.forEach(it => it.shares = it.shares.filter(s => s !== removed)); 
      save(); render(); 
    };
  });
}

function renderItems() {
  const el = $('itemsList');
  el.innerHTML = items.map((it, idx) => `
    <div class="item">
      <div class="row">
        <strong>${it.name}</strong> $${it.price.toFixed(2)}
        <button data-i="${idx}" class="rm-item">Remove</button>
      </div>
      <div class="shares">
        ${people.map(p => `<label><input type="checkbox" data-item="${idx}" data-person="${p}" ${it.shares.includes(p) ? 'checked' : ''}> ${p}</label>`).join('')}
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.rm-item').forEach(btn => {
    btn.onclick = () => { items.splice(+btn.dataset.i, 1); save(); render(); };
  });
  el.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.onchange = () => {
      const item = items[+cb.dataset.item];
      const p = cb.dataset.person;
      if (cb.checked) {
        if (!item.shares.includes(p)) item.shares.push(p);
      } else {
        item.shares = item.shares.filter(s => s !== p);
      }
      save(); render();
    };
  });
}

function compute() {
  const subtotal = items.reduce((s, it) => s + it.price, 0);
  const tax = subtotal * (taxPct / 100);
  const tip = (subtotal + tax) * (tipPct / 100);
  const grand = subtotal + tax + tip;
  const shares = {};
  people.forEach(p => shares[p] = 0);
  items.forEach(it => {
    const n = it.shares.length || 1;
    const each = it.price / n;
    it.shares.forEach(p => { if (shares[p] !== undefined) shares[p] += each; });
  });
  const itemTotal = Object.values(shares).reduce((a, b) => a + b, 0);
  const scale = itemTotal > 0 ? subtotal / itemTotal : 1;
  Object.keys(shares).forEach(p => shares[p] *= scale);
  const taxShare = tax / Math.max(people.length, 1);
  const tipShare = tip / Math.max(people.length, 1);
  Object.keys(shares).forEach(p => shares[p] += taxShare + tipShare);
  return { subtotal, tax, tip, grand, shares };
}

function render() {
  renderPeople();
  renderItems();
  const { subtotal, tax, tip, grand, shares } = compute();
  $('summary').innerHTML = `
    Subtotal: $${subtotal.toFixed(2)} · Tax: $${tax.toFixed(2)} · Tip: $${tip.toFixed(2)} · <strong>Total: $${grand.toFixed(2)}</strong>
  `;
  const max = Math.max(...Object.values(shares), 1);
  $('bars').innerHTML = Object.entries(shares).map(([p, amt]) => `
    <div class="bar-row">
      <span class="person-name">${p}</span>
      <div class="bar" style="width:${(amt / max) * 70}%"></div>
      <span>$${amt.toFixed(2)}</span>
    </div>
  `).join('');
}

$('addPerson').onclick = () => {
  const name = $('personInput').value.trim();
  if (name && !people.includes(name)) {
    people.push(name);
    $('personInput').value = '';
    save(); render();
  }
};
$('personInput').onkeydown = e => { if (e.key === 'Enter') $('addPerson').click(); };

$('addItem').onclick = () => {
  const name = $('itemName').value.trim() || 'Item';
  const price = parseFloat($('itemPrice').value) || 0;
  if (price > 0) {
    items.push({ name, price, shares: [...people] });
    $('itemName').value = '';
    $('itemPrice').value = '';
    save(); render();
  }
};

$('taxPct').onchange = $('tipPct').onchange = () => {
  taxPct = parseFloat($('taxPct').value) || 0;
  tipPct = parseFloat($('tipPct').value) || 0;
  save(); render();
};

$('copyBtn').onclick = () => {
  const { shares, grand } = compute();
  const text = Object.entries(shares).map(([p, a]) => `${p}: $${a.toFixed(2)}`).join('\n') + `\nTotal: $${grand.toFixed(2)}`;
  navigator.clipboard.writeText(text).then(() => alert('Copied'));
};

$('csvBtn').onclick = () => {
  const { shares, subtotal, tax, tip, grand } = compute();
  let csv = 'Person,Amount\n';
  Object.entries(shares).forEach(([p, a]) => csv += `"${p}",${a.toFixed(2)}\n`);
  csv += `\nSubtotal,${subtotal.toFixed(2)}\nTax,${tax.toFixed(2)}\nTip,${tip.toFixed(2)}\nTotal,${grand.toFixed(2)}\n`;
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bill-split.csv';
  a.click();
};

$('clearBtn').onclick = () => {
  if (confirm('Clear everyone and everything?')) {
    people = []; items = [];
    localStorage.removeItem('verse-bill-splitter');
    render();
  }
};

load();
</script>
</body>
</html>
