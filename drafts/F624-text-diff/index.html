<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Text Diff — Verse</title>
<style>
:root { --bg:#0f1115; --fg:#e8e8e8; --muted:#888; --del:#ff6b6b; --ins:#51cf66; --chg:#ffd43b; --border:#333; --accent:#4dabf7; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, -apple-system, sans-serif; padding:12px; }
h1 { font-size:1.4rem; margin:0 0 8px; font-weight:600; }
p.lead { color:var(--muted); margin:0 0 16px; font-size:0.95rem; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
@media (max-width:700px) { .row { grid-template-columns:1fr; } }
label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:4px; }
textarea { width:100%; min-height:180px; background:#1a1d24; color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:10px; font:14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize:vertical; }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; align-items:center; }
button { background:var(--accent); color:#000; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; font-size:0.9rem; }
button.secondary { background:#333; color:var(--fg); }
button:active { transform:scale(0.98); }
#view { background:#1a1d24; border:1px solid var(--border); border-radius:8px; padding:10px; min-height:120px; overflow:auto; font:13px/1.4 ui-monospace, monospace; white-space:pre-wrap; word-break:break-word; }
.eq { color:#aaa; }
.del { background:rgba(255,107,107,0.25); color:#ffc9c9; text-decoration:line-through; }
.ins { background:rgba(81,207,102,0.25); color:#b2f2bb; }
.line-del { background:rgba(255,107,107,0.12); }
.line-ins { background:rgba(81,207,102,0.12); }
.line-chg { background:rgba(255,212,59,0.08); }
.status { font-size:0.8rem; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<h1>Text Diff</h1>
<p class="lead">Paste two versions. See every line and word that changed. Copy a patch or share a link.</p>

<div class="row">
  <div>
    <label for="a">Original</label>
    <textarea id="a" placeholder="Paste the original text…"></textarea>
  </div>
  <div>
    <label for="b">Revised</label>
    <textarea id="b" placeholder="Paste the revised text…"></textarea>
  </div>
</div>

<div class="controls">
  <button id="diffBtn">Show differences</button>
  <button id="copyPatch" class="secondary">Copy patch</button>
  <button id="download" class="secondary">Download .diff</button>
  <button id="share" class="secondary">Copy share link</button>
  <button id="clear" class="secondary">Clear</button>
</div>

<div id="view">Differences appear here.</div>
<div class="status" id="status">Ready. Both texts are kept only on this device.</div>

<script>
const a = document.getElementById('a');
const b = document.getElementById('b');
const view = document.getElementById('view');
const status = document.getElementById('status');
const KEY = 'verse-text-diff-v1';

function load() {
  try {
    const hash = location.hash.slice(1);
    if (hash) {
      const data = JSON.parse(decodeURIComponent(hash));
      if (data.a != null) a.value = data.a;
      if (data.b != null) b.value = data.b;
      status.textContent = 'Loaded from share link.';
      return;
    }
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const data = JSON.parse(saved);
      a.value = data.a || '';
      b.value = data.b || '';
      status.textContent = 'Restored last texts from this device.';
    }
  } catch (e) { /* ignore */ }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ a: a.value, b: b.value })); } catch (e) {}
}

// Simple LCS DP for arrays (lines or words). Returns list of {type, value}
function lcsDiff(arr1, arr2) {
  const n = arr1.length, m = arr2.length;
  if (n * m > 800000) return null; // safety
  const dp = Array.from({length: n+1}, () => new Uint16Array(m+1));
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      dp[i][j] = arr1[i-1] === arr2[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const ops = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && arr1[i-1] === arr2[j-1]) {
      ops.push({ type: 'eq', value: arr1[i-1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      ops.push({ type: 'ins', value: arr2[j-1] });
      j--;
    } else {
      ops.push({ type: 'del', value: arr1[i-1] });
      i--;
    }
  }
  return ops.reverse();
}

function wordDiff(s1, s2) {
  const w1 = s1.split(/(\s+)/);
  const w2 = s2.split(/(\s+)/);
  const d = lcsDiff(w1, w2);
  if (!d) return escapeHtml(s1) + ' → ' + escapeHtml(s2);
  return d.map(op => {
    const v = escapeHtml(op.value);
    if (op.type === 'eq') return v;
    if (op.type === 'del') return `<span class="del">${v}</span>`;
    return `<span class="ins">${v}</span>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function compute() {
  const ta = a.value, tb = b.value;
  if (!ta && !tb) { view.textContent = 'Paste texts above.'; return; }
  const la = ta.split('\n');
  const lb = tb.split('\n');
  const lineOps = lcsDiff(la, lb);
  if (!lineOps) {
    view.innerHTML = '<p>Texts too large for detailed alignment. Showing raw.</p><pre>' + escapeHtml(ta) + '\n\n---\n\n' + escapeHtml(tb) + '</pre>';
    return;
  }
  let html = '';
  let i = 0;
  while (i < lineOps.length) {
    const op = lineOps[i];
    if (op.type === 'eq') {
      html += `<div class="eq">${escapeHtml(op.value)}\n</div>`;
      i++;
    } else {
      // gather a hunk of dels then ins
      const dels = [], inss = [];
      while (i < lineOps.length && lineOps[i].type === 'del') { dels.push(lineOps[i].value); i++; }
      while (i < lineOps.length && lineOps[i].type === 'ins') { inss.push(lineOps[i].value); i++; }
      if (dels.length && inss.length) {
        // paired changed lines
        const max = Math.max(dels.length, inss.length);
        for (let k = 0; k < max; k++) {
          const d = dels[k] || '';
          const ins = inss[k] || '';
          html += `<div class="line-chg">${wordDiff(d, ins)}\n</div>`;
        }
      } else {
        dels.forEach(l => { html += `<div class="line-del"><span class="del">- ${escapeHtml(l)}</span>\n</div>`; });
        inss.forEach(l => { html += `<div class="line-ins"><span class="ins">+ ${escapeHtml(l)}</span>\n</div>`; });
      }
    }
  }
  view.innerHTML = html || '<em>No differences.</em>';

  // Build simple unified-style patch
  let patchLines = ['--- original', '+++ revised', '@@'];
  lineOps.forEach(op => {
    if (op.type === 'eq') patchLines.push(' ' + op.value);
    else if (op.type === 'del') patchLines.push('-' + op.value);
    else patchLines.push('+' + op.value);
  });
  window._lastPatch = patchLines.join('\n');
  status.textContent = `Compared ${la.length} vs ${lb.length} lines.`;
  save();
}

function makePatch() {
  compute();
  return window._lastPatch || '';
}

document.getElementById('diffBtn').onclick = compute;
a.oninput = b.oninput = () => { clearTimeout(window._t); window._t = setTimeout(compute, 400); };
document.getElementById('copyPatch').onclick = async () => {
  const p = makePatch();
  try { await navigator.clipboard.writeText(p); status.textContent = 'Patch copied.'; }
  catch (e) { status.textContent = 'Copy failed — select and copy manually.'; }
};
document.getElementById('download').onclick = () => {
  const p = makePatch();
  const blob = new Blob([p], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const ael = document.createElement('a');
  ael.href = url; ael.download = 'diff.diff'; ael.click();
  URL.revokeObjectURL(url);
  status.textContent = 'Downloaded diff.diff';
};
document.getElementById('share').onclick = async () => {
  const data = { a: a.value, b: b.value };
  const hash = '#' + encodeURIComponent(JSON.stringify(data));
  const url = location.origin + location.pathname + hash;
  try { await navigator.clipboard.writeText(url); status.textContent = 'Share link copied.'; }
  catch (e) { location.hash = hash.slice(1); status.textContent = 'Link updated in address bar — copy it.'; }
};
document.getElementById('clear').onclick = () => {
  a.value = b.value = '';
  view.textContent = 'Differences appear here.';
  localStorage.removeItem(KEY);
  history.replaceState(null, '', location.pathname);
  status.textContent = 'Cleared.';
};

load();
if (a.value || b.value) setTimeout(compute, 50);
</script>
</body>
</html>
