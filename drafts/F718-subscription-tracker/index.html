<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscription Tracker</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --text: #e6edf3;
    --muted: #8b9bb4;
    --accent: #58a6ff;
    --good: #3fb950;
    --border: #30363d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 1rem;
  }
  h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
  .sub { color: var(--muted); margin-bottom: 1.5rem; }
  .totals {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .total-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    flex: 1;
    min-width: 140px;
  }
  .total-card strong { font-size: 1.4rem; color: var(--good); }
  form, .list {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
  input, select, button {
    width: 100%;
    padding: 0.6rem;
    margin-bottom: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #0d1117;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  button.secondary { background: #21262d; color: var(--text); border: 1px solid var(--border); }
  .row { display: flex; gap: 0.5rem; }
  .row > * { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem 0.25rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
  .actions button { width: auto; padding: 0.6rem 1rem; }
  .empty { color: var(--muted); text-align: center; padding: 1rem; }
  footer { margin-top: 2rem; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
  <h1>Subscription tracker</h1>
  <p class="sub">Add what you pay for. Totals update live. Everything stays on this device.</p>

  <div class="totals">
    <div class="total-card">Monthly<br><strong id="monthly">$0.00</strong></div>
    <div class="total-card">Yearly<br><strong id="yearly">$0.00</strong></div>
  </div>

  <form id="form">
    <div class="row">
      <div>
        <label for="name">Service</label>
        <input id="name" required placeholder="Netflix, Spotify…">
      </div>
      <div>
        <label for="price">Price</label>
        <input id="price" type="number" step="0.01" min="0" required placeholder="9.99">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="period">Period</label>
        <select id="period">
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
      <div>
        <label for="date">Next renewal</label>
        <input id="date" type="date" required>
      </div>
    </div>
    <button type="submit">Add subscription</button>
  </form>

  <div class="list">
    <table id="table">
      <thead>
        <tr><th>Service</th><th>Price</th><th>Period</th><th>Next</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty">No subscriptions yet.</div>
  </div>

  <div class="actions">
    <button id="copy" class="secondary">Copy summary</button>
    <button id="ics" class="secondary">Download .ics reminders</button>
    <button id="clear" class="secondary">Clear all</button>
  </div>

  <footer>Offline after load. Data never leaves your browser. Prices are as you entered them; no taxes or currency conversion.</footer>

<script>
const KEY = 'verse-subs-v1';
let subs = [];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) subs = JSON.parse(raw);
  } catch (e) {}
  render();
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(subs)); } catch (e) {}
}

function monthlyOf(s) {
  return s.period === 'monthly' ? s.price : s.price / 12;
}

function render() {
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  tbody.innerHTML = '';
  let mon = 0, yr = 0;
  subs.forEach((s, i) => {
    const m = monthlyOf(s);
    mon += m;
    yr += m * 12;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escape(s.name)}</td>
      <td>$${s.price.toFixed(2)}</td>
      <td>${s.period}</td>
      <td>${s.date}</td>
      <td><button type="button" data-i="${i}" style="width:auto;padding:0.3rem 0.6rem;background:#da3633;color:#fff">×</button></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('monthly').textContent = '$' + mon.toFixed(2);
  document.getElementById('yearly').textContent = '$' + yr.toFixed(2);
  empty.style.display = subs.length ? 'none' : 'block';
  tbody.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      subs.splice(+btn.dataset.i, 1);
      save();
      render();
    };
  });
}

function escape(t) {
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const price = parseFloat(document.getElementById('price').value);
  const period = document.getElementById('period').value;
  const date = document.getElementById('date').value;
  if (!name || isNaN(price) || !date) return;
  subs.push({ name, price, period, date });
  save();
  render();
  e.target.reset();
  document.getElementById('name').focus();
};

document.getElementById('copy').onclick = () => {
  let mon = 0;
  const lines = subs.map(s => {
    const m = monthlyOf(s);
    mon += m;
    return `${s.name}: $${s.price.toFixed(2)} / ${s.period} (next ${s.date})`;
  });
  const text = `Subscriptions\n\n${lines.join('\n')}\n\nMonthly: $${mon.toFixed(2)}\nYearly: $${(mon*12).toFixed(2)}`;
  navigator.clipboard.writeText(text).then(() => alert('Summary copied')).catch(() => {
    prompt('Copy this:', text);
  });
};

document.getElementById('ics').onclick = () => {
  if (!subs.length) return alert('Add some subscriptions first');
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Verse//Subscription Tracker//EN\r\n';
  subs.forEach((s, i) => {
    const d = s.date.replace(/-/g, '');
    const freq = s.period === 'monthly' ? 'MONTHLY' : 'YEARLY';
    ics += `BEGIN:VEVENT\r\nUID:sub-${i}-${Date.now()}@verse\r\nDTSTART:${d}\r\nRRULE:FREQ=${freq}\r\nSUMMARY:Renew ${s.name} ($${s.price.toFixed(2)})\r\nDESCRIPTION:Subscription renewal reminder\r\nEND:VEVENT\r\n`;
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], { type: 'text/calendar' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'subscription-reminders.ics';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('clear').onclick = () => {
  if (confirm('Clear all subscriptions?')) {
    subs = [];
    save();
    render();
  }
};

// Set default date to today
document.getElementById('date').valueAsDate = new Date();
load();
</script>
</body>
</html>
