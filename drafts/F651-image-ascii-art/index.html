<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to ASCII Art — Verse</title>
<style>
  :root { --bg: #0f1115; --fg: #e8e8e8; --accent: #5eead4; --muted: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; padding: 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  .controls { display: grid; gap: 0.75rem; max-width: 48rem; margin-bottom: 1rem; }
  label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9rem; }
  input[type="range"], input[type="number"], select, input[type="text"] { padding: 0.4rem; background: #1a1d24; color: var(--fg); border: 1px solid #333; border-radius: 4px; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; }
  button { background: var(--accent); color: #0f1115; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  pre, textarea { background: #1a1d24; border: 1px solid #333; border-radius: 6px; padding: 0.75rem; overflow: auto; white-space: pre; font: 10px/1.1 ui-monospace, monospace; max-height: 70vh; width: 100%; }
  .status { color: var(--muted); font-size: 0.85rem; }
  canvas { display: none; }
</style>
</head>
<body>
<h1>Image to ASCII Art</h1>
<p class="status">Fully offline. Nothing leaves this device.</p>

<div class="controls">
  <label>Image
    <input type="file" id="file" accept="image/*">
  </label>
  <div class="row">
    <label>Width (chars)
      <input type="number" id="width" min="20" max="200" value="80">
    </label>
    <label>Contrast
      <input type="range" id="contrast" min="0.5" max="2.5" step="0.1" value="1.2">
    </label>
    <label>Charset
      <select id="charset">
        <option value=" .:-=+*#%@">Standard</option>
        <option value=" .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$">Detailed</option>
        <option value=" ░▒▓█">Blocks</option>
        <option value="custom">Custom</option>
      </select>
    </label>
  </div>
  <label id="customLabel" style="display:none">Custom charset (light → dark)
    <input type="text" id="customCharset" value=" .-=*#">
  </label>
  <div class="row">
    <button id="copy">Copy ASCII</button>
    <button id="download">Download .txt</button>
    <span class="status" id="info"></span>
  </div>
</div>

<pre id="preview">Upload an image to begin.</pre>
<canvas id="canvas"></canvas>

<script>
const $ = id => document.getElementById(id);
const fileIn = $('file');
const widthIn = $('width');
const contrastIn = $('contrast');
const charsetSel = $('charset');
const customIn = $('customCharset');
const customLabel = $('customLabel');
const preview = $('preview');
const canvas = $('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const info = $('info');
const KEY = 'verse-f651-ascii';

let img = null;
let lastName = '';

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (s.width) widthIn.value = s.width;
    if (s.contrast) contrastIn.value = s.contrast;
    if (s.charset) charsetSel.value = s.charset;
    if (s.custom) customIn.value = s.custom;
    if (s.name) lastName = s.name;
    updateCustom();
  } catch {}
}
function saveState() {
  const s = {
    width: +widthIn.value,
    contrast: +contrastIn.value,
    charset: charsetSel.value,
    custom: customIn.value,
    name: lastName
  };
  localStorage.setItem(KEY, JSON.stringify(s));
}
function updateCustom() {
  customLabel.style.display = charsetSel.value === 'custom' ? '' : 'none';
}
function getCharset() {
  return charsetSel.value === 'custom' ? customIn.value || ' .' : charsetSel.value;
}
function luminance(r, g, b) {
  return 0.299 * r + 0.587 * g + 0.114 * b;
}
function render() {
  if (!img) { preview.textContent = 'Upload an image to begin.'; return; }
  const cols = Math.max(20, Math.min(200, +widthIn.value || 80));
  const aspect = img.height / img.width;
  const rows = Math.max(8, Math.round(cols * aspect * 0.5)); // char aspect correction
  canvas.width = cols;
  canvas.height = rows;
  ctx.drawImage(img, 0, 0, cols, rows);
  const data = ctx.getImageData(0, 0, cols, rows).data;
  const charset = getCharset();
  const contrast = +contrastIn.value || 1;
  let out = '';
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      let L = luminance(data[i], data[i+1], data[i+2]) / 255;
      L = Math.pow(L, contrast); // simple contrast
      L = Math.max(0, Math.min(1, L));
      const idx = Math.floor(L * (charset.length - 1));
      out += charset[idx] || ' ';
    }
    out += '\n';
  }
  preview.textContent = out;
  info.textContent = `${cols}×${rows} · ${lastName || 'image'}`;
  saveState();
}

fileIn.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  lastName = f.name;
  const url = URL.createObjectURL(f);
  img = new Image();
  img.onload = () => { URL.revokeObjectURL(url); render(); };
  img.src = url;
});
widthIn.addEventListener('input', render);
contrastIn.addEventListener('input', render);
charsetSel.addEventListener('change', () => { updateCustom(); render(); });
customIn.addEventListener('input', render);

$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(preview.textContent);
    info.textContent = 'Copied!';
  } catch {
    info.textContent = 'Copy failed — use download';
  }
});
$('download').addEventListener('click', () => {
  const blob = new Blob([preview.textContent], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (lastName || 'ascii').replace(/\.[^.]+$/, '') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

loadState();
updateCustom();
</script>
</body>
</html>
