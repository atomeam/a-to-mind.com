<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt to expense list</title>
<style>
:root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8b9bb4; --accent:#4cc9f0; --ok:#06d6a0; --warn:#ffd166; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); line-height:1.4; }
header { padding:1rem 1.2rem; border-bottom:1px solid #2a3548; }
h1 { margin:0; font-size:1.4rem; }
.sub { color:var(--muted); font-size:.9rem; margin:.25rem 0 0; }
main { max-width:900px; margin:0 auto; padding:1rem; display:grid; gap:1rem; }
.card { background:var(--card); border-radius:12px; padding:1rem; border:1px solid #2a3548; }
label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.25rem; }
input, select, textarea, button { font:inherit; color:inherit; background:#0d1117; border:1px solid #334; border-radius:8px; padding:.5rem .7rem; }
textarea { width:100%; min-height:120px; resize:vertical; }
.row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:end; margin-top:.5rem; }
.row > * { flex:1; min-width:120px; }
button { background:var(--accent); color:#042; border:none; cursor:pointer; font-weight:600; }
button.secondary { background:#243044; color:var(--text); }
button.danger { background:#c1121f; }
button:disabled { opacity:.5; cursor:not-allowed; }
table { width:100%; border-collapse:collapse; font-size:.9rem; }
th, td { text-align:left; padding:.45rem .4rem; border-bottom:1px solid #2a3548; }
th { color:var(--muted); font-weight:500; }
.amt { text-align:right; font-variant-numeric:tabular-nums; }
.cat { font-size:.8rem; background:#243044; padding:.15rem .4rem; border-radius:4px; }
.totals { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.5rem; }
.total-box { background:#0d1117; padding:.6rem; border-radius:8px; }
.total-box strong { display:block; font-size:1.2rem; color:var(--ok); }
.empty { color:var(--muted); text-align:center; padding:1.5rem; }
.note { font-size:.8rem; color:var(--muted); margin-top:.3rem; }
@media (max-width:600px) { .row { flex-direction:column; } }
</style>
</head>
<body>
<header>
  <h1>Receipt to expense list</h1>
  <p class="sub">Paste lines or add items · categorize · download CSV. Offline, nothing leaves your device.</p>
</header>
<main>
  <section class="card">
    <label for="paste">Paste receipt lines (description amount [category])</label>
    <textarea id="paste" placeholder="coffee 4.50 food
uber 12.80 transport
notebook 8.99 office"></textarea>
    <div class="row">
      <button id="parseBtn">Parse lines</button>
      <button id="clearPaste" class="secondary">Clear paste</button>
    </div>
    <p class="note" id="parseNote"></p>
  </section>

  <section class="card">
    <label>Add one item</label>
    <div class="row">
      <input id="desc" placeholder="Description" />
      <input id="amt" type="number" step="0.01" placeholder="Amount" />
      <select id="cat"></select>
      <input id="newCat" placeholder="or new category" />
      <button id="addBtn">Add</button>
    </div>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;">
      <strong>Items</strong>
      <div>
        <button id="copyBtn" class="secondary">Copy summary</button>
        <button id="csvBtn">Download CSV</button>
        <button id="clearAll" class="secondary">Clear all</button>
      </div>
    </div>
    <div id="tableWrap"></div>
    <div class="totals" id="totals" style="margin-top:1rem;"></div>
  </section>
</main>
<script>
const LS = 'verse-f643-receipt';
let items = [];
let categories = ['food','transport','office','home','health','other'];

function load() {
  try {
    const h = location.hash.slice(1);
    if (h) {
      const data = JSON.parse(decodeURIComponent(escape(atob(h))));
      if (Array.isArray(data.items)) items = data.items;
      if (Array.isArray(data.categories)) categories = [...new Set([...categories, ...data.categories])];
    } else {
      const raw = localStorage.getItem(LS);
      if (raw) {
        const data = JSON.parse(raw);
        items = data.items || [];
        categories = data.categories || categories;
      }
    }
  } catch(e) {}
  render();
}

function save() {
  const data = { items, categories };
  localStorage.setItem(LS, JSON.stringify(data));
  try {
    const h = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    history.replaceState(null, '', '#' + h);
  } catch(e) {}
}

function parseLines() {
  const text = document.getElementById('paste').value.trim();
  if (!text) return;
  const lines = text.split(/\n+/);
  let added = 0, skipped = 0;
  lines.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length < 2) { skipped++; return; }
    let amt = null, cat = null, descParts = [];
    for (let i = parts.length - 1; i >= 0; i--) {
      const n = parseFloat(parts[i].replace(/[^0-9.-]/g,''));
      if (!isNaN(n) && amt === null) {
        amt = n;
        if (i < parts.length - 1) cat = parts.slice(i+1).join(' ');
        descParts = parts.slice(0, i);
        break;
      }
    }
    if (amt === null || descParts.length === 0) { skipped++; return; }
    const desc = descParts.join(' ');
    const category = (cat || 'other').toLowerCase();
    if (!categories.includes(category)) categories.push(category);
    items.push({ desc, amt, category, id: Date.now() + Math.random() });
    added++;
  });
  document.getElementById('parseNote').textContent = `Added ${added}, skipped ${skipped} unparseable lines.`;
  document.getElementById('paste').value = '';
  save(); render();
}

function addOne() {
  const desc = document.getElementById('desc').value.trim();
  const amt = parseFloat(document.getElementById('amt').value);
  let cat = document.getElementById('newCat').value.trim().toLowerCase() || document.getElementById('cat').value;
  if (!desc || isNaN(amt)) return;
  if (!categories.includes(cat)) categories.push(cat);
  items.push({ desc, amt, category: cat, id: Date.now() + Math.random() });
  document.getElementById('desc').value = '';
  document.getElementById('amt').value = '';
  document.getElementById('newCat').value = '';
  save(); render();
}

function del(id) {
  items = items.filter(i => i.id !== id);
  save(); render();
}

function render() {
  const sel = document.getElementById('cat');
  sel.innerHTML = categories.map(c => `<option>${c}</option>`).join('');
  const wrap = document.getElementById('tableWrap');
  if (!items.length) {
    wrap.innerHTML = '<p class="empty">No items yet. Paste lines or add one above.</p>';
    document.getElementById('totals').innerHTML = '';
    return;
  }
  let html = '<table><thead><tr><th>Description</th><th class="amt">Amount</th><th>Category</th><th></th></tr></thead><tbody>';
  items.forEach(i => {
    html += `<tr><td>${escapeHtml(i.desc)}</td><td class="amt">${i.amt.toFixed(2)}</td><td><span class="cat">${escapeHtml(i.category)}</span></td><td><button class="danger" onclick="del(${i.id})">✕</button></td></tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  const byCat = {};
  let grand = 0;
  items.forEach(i => {
    byCat[i.category] = (byCat[i.category] || 0) + i.amt;
    grand += i.amt;
  });
  let t = `<div class="total-box"><span>Grand total</span><strong>${grand.toFixed(2)}</strong></div>`;
  Object.keys(byCat).sort().forEach(c => {
    t += `<div class="total-box"><span>${escapeHtml(c)}</span><strong>${byCat[c].toFixed(2)}</strong></div>`;
  });
  document.getElementById('totals').innerHTML = t;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toCSV() {
  const date = new Date().toISOString().slice(0,10);
  let csv = 'Date,Description,Amount,Category\n';
  items.forEach(i => csv += `${date},"${i.desc.replace(/"/g,'""')}",${i.amt.toFixed(2)},${i.category}\n`);
  csv += '\nCategory,Total\n';
  const byCat = {};
  let grand = 0;
  items.forEach(i => { byCat[i.category]=(byCat[i.category]||0)+i.amt; grand+=i.amt; });
  Object.keys(byCat).sort().forEach(c => csv += `${c},${byCat[c].toFixed(2)}\n`);
  csv += `TOTAL,${grand.toFixed(2)}\n`;
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `receipt-${date}.csv`;
  a.click();
}

function copySummary() {
  if (!items.length) return;
  const byCat = {};
  let grand = 0;
  items.forEach(i => { byCat[i.category]=(byCat[i.category]||0)+i.amt; grand+=i.amt; });
  let text = `Receipt summary\nGrand total: ${grand.toFixed(2)}\n\n`;
  Object.keys(byCat).sort().forEach(c => text += `${c}: ${byCat[c].toFixed(2)}\n`);
  text += '\nItems:\n';
  items.forEach(i => text += `- ${i.desc}: ${i.amt.toFixed(2)} (${i.category})\n`);
  navigator.clipboard.writeText(text).then(() => alert('Summary copied'));
}

document.getElementById('parseBtn').onclick = parseLines;
document.getElementById('clearPaste').onclick = () => { document.getElementById('paste').value=''; document.getElementById('parseNote').textContent=''; };
document.getElementById('addBtn').onclick = addOne;
document.getElementById('csvBtn').onclick = toCSV;
document.getElementById('copyBtn').onclick = copySummary;
document.getElementById('clearAll').onclick = () => { if(confirm('Clear all items?')) { items=[]; save(); render(); } };
document.getElementById('desc').onkeydown = e => { if(e.key==='Enter') addOne(); };
document.getElementById('amt').onkeydown = e => { if(e.key==='Enter') addOne(); };

load();
</script>
</body>
</html>
