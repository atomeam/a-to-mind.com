<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill splitter · Verse</title>
<style>
:root { --bg:#0f1419; --fg:#e7ecf1; --acc:#3dd6c6; --card:#1a2332; --muted:#8b9bb4; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); line-height:1.4; }
header { padding:1rem; text-align:center; border-bottom:1px solid #2a3544; }
h1 { margin:0; font-size:1.4rem; }
.sub { color:var(--muted); font-size:.9rem; }
main { max-width:720px; margin:0 auto; padding:1rem; }
section { background:var(--card); border-radius:12px; padding:1rem; margin-bottom:1rem; }
h2 { margin:0 0 .75rem; font-size:1.1rem; }
label { display:block; margin:.4rem 0 .2rem; font-size:.85rem; color:var(--muted); }
input, select, button { font:inherit; padding:.5rem; border-radius:8px; border:1px solid #3a4658; background:#121a24; color:var(--fg); }
input[type=number] { width:100px; }
button { background:var(--acc); color:#042; border:none; cursor:pointer; font-weight:600; }
button.secondary { background:#2a3544; color:var(--fg); }
button.danger { background:#c44; color:#fff; }
.row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:.5rem 0; }
.people-list, .items-list { display:flex; flex-direction:column; gap:.4rem; }
.person, .item { background:#121a24; padding:.6rem; border-radius:8px; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
.assignees { display:flex; gap:.3rem; flex-wrap:wrap; }
.assignees label { display:inline-flex; align-items:center; gap:.2rem; margin:0; font-size:.85rem; }
.totals { font-size:1.05rem; }
.person-total { display:flex; justify-content:space-between; padding:.4rem 0; border-bottom:1px solid #2a3544; }
.actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.5rem; }
.note { font-size:.8rem; color:var(--muted); margin-top:.5rem; }
@media (max-width:480px) { .row { flex-direction:column; align-items:stretch; } }
</style>
</head>
<body>
<header>
  <h1>Bill splitter</h1>
  <div class="sub">Itemized shares · tax & tip · copy or download · saved on this device</div>
</header>
<main>
  <section>
    <h2>People</h2>
    <div class="row">
      <input id="personName" placeholder="Add a person" maxlength="40">
      <button id="addPerson">Add</button>
    </div>
    <div id="people" class="people-list"></div>
  </section>

  <section>
    <h2>Items</h2>
    <div class="row">
      <input id="itemDesc" placeholder="Description" maxlength="60">
      <input id="itemPrice" type="number" step="0.01" min="0" placeholder="Price">
      <button id="addItem">Add item</button>
    </div>
    <div id="items" class="items-list"></div>
  </section>

  <section>
    <h2>Tax & tip</h2>
    <div class="row">
      <label>Tax % <input id="tax" type="number" step="0.1" min="0" value="8"></label>
      <label>Tip % <input id="tip" type="number" step="0.1" min="0" value="18"></label>
    </div>
  </section>

  <section>
    <h2>Who owes what</h2>
    <div id="totals" class="totals"></div>
    <div class="actions">
      <button id="copy">Copy summary</button>
      <button id="download" class="secondary">Download .txt</button>
      <button id="clear" class="danger secondary">Clear all</button>
    </div>
    <div class="note">Shares are equal among the people assigned to each item. Tax and tip are added in proportion to each person's item subtotal. Numbers are rounded to cents at the end.</div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const KEY = 'verse-f652-bill';

let people = [];
let items = [];

function uid() { return Math.random().toString(36).slice(2, 9); }

function save() {
  const data = { people, items, tax: +$('tax').value || 0, tip: +$('tip').value || 0 };
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {}
  updateHash(data);
}

function load() {
  let data = null;
  const hash = location.hash.slice(1);
  if (hash) {
    try { data = JSON.parse(decodeURIComponent(escape(atob(hash)))); } catch(e) {}
  }
  if (!data) {
    try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
  }
  if (data) {
    people = data.people || [];
    items = data.items || [];
    $('tax').value = data.tax ?? 8;
    $('tip').value = data.tip ?? 18;
  }
  render();
}

function updateHash(data) {
  try {
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    history.replaceState(null, '', '#' + b64);
  } catch(e) {}
}

function render() {
  const pEl = $('people');
  pEl.innerHTML = people.map(p => `
    <div class="person">
      <strong>${escapeHtml(p.name)}</strong>
      <button class="secondary danger" data-remove-person="${p.id}">Remove</button>
    </div>`).join('');

  const iEl = $('items');
  iEl.innerHTML = items.map(it => `
    <div class="item">
      <span>${escapeHtml(it.desc)} — $${it.price.toFixed(2)}</span>
      <div class="assignees">
        ${people.map(p => `<label><input type="checkbox" data-item="${it.id}" data-person="${p.id}" ${it.assignees.includes(p.id)?'checked':''}> ${escapeHtml(p.name)}</label>`).join('')}
      </div>
      <button class="secondary danger" data-remove-item="${it.id}">Remove</button>
    </div>`).join('');

  calc();
  save();
}

function calc() {
  const taxRate = (+$('tax').value || 0) / 100;
  const tipRate = (+$('tip').value || 0) / 100;
  const shares = {};
  people.forEach(p => shares[p.id] = { name: p.name, sub: 0, tax: 0, tip: 0, total: 0 });

  let grandSub = 0;
  items.forEach(it => {
    const n = it.assignees.length;
    if (n === 0) return;
    const each = it.price / n;
    it.assignees.forEach(pid => {
      if (shares[pid]) shares[pid].sub += each;
    });
    grandSub += it.price;
  });

  const taxTotal = grandSub * taxRate;
  const tipTotal = grandSub * tipRate;

  Object.values(shares).forEach(s => {
    if (grandSub > 0) {
      const prop = s.sub / grandSub;
      s.tax = taxTotal * prop;
      s.tip = tipTotal * prop;
    }
    s.total = s.sub + s.tax + s.tip;
  });

  const tEl = $('totals');
  if (people.length === 0 || items.length === 0) {
    tEl.innerHTML = '<div class="note">Add at least one person and one item.</div>';
    return;
  }
  tEl.innerHTML = Object.values(shares).map(s => 
    `<div class="person-total"><span>${escapeHtml(s.name)}</span><strong>$${s.total.toFixed(2)}</strong></div>`
  ).join('') + `<div class="person-total" style="font-weight:700"><span>Grand total</span><strong>$${(grandSub + taxTotal + tipTotal).toFixed(2)}</strong></div>`;

  window._lastSummary = buildSummary(shares, grandSub, taxTotal, tipTotal);
}

function buildSummary(shares, grandSub, taxTotal, tipTotal) {
  let txt = 'Bill split\n=========\n';
  items.forEach(it => {
    const names = it.assignees.map(id => people.find(p=>p.id===id)?.name || '?').join(', ');
    txt += `${it.desc}: $${it.price.toFixed(2)} (shared by ${names || 'no one'})\n`;
  });
  txt += `\nSubtotal: $${grandSub.toFixed(2)}\nTax: $${taxTotal.toFixed(2)}\nTip: $${tipTotal.toFixed(2)}\nTotal: $${(grandSub+taxTotal+tipTotal).toFixed(2)}\n\n`;
  Object.values(shares).forEach(s => {
    txt += `${s.name}: $${s.total.toFixed(2)}\n`;
  });
  return txt;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('addPerson').onclick = () => {
  const name = $('personName').value.trim();
  if (!name) return;
  people.push({ id: uid(), name });
  $('personName').value = '';
  render();
};

$('addItem').onclick = () => {
  const desc = $('itemDesc').value.trim() || 'Item';
  const price = +$('itemPrice').value || 0;
  if (price <= 0) return;
  items.push({ id: uid(), desc, price, assignees: people.map(p=>p.id) });
  $('itemDesc').value = '';
  $('itemPrice').value = '';
  render();
};

document.body.addEventListener('click', e => {
  if (e.target.dataset.removePerson) {
    const id = e.target.dataset.removePerson;
    people = people.filter(p => p.id !== id);
    items.forEach(it => it.assignees = it.assignees.filter(a => a !== id));
    render();
  }
  if (e.target.dataset.removeItem) {
    items = items.filter(it => it.id !== e.target.dataset.removeItem);
    render();
  }
});

document.body.addEventListener('change', e => {
  if (e.target.dataset.item && e.target.dataset.person) {
    const it = items.find(i => i.id === e.target.dataset.item);
    if (!it) return;
    const pid = e.target.dataset.person;
    if (e.target.checked) {
      if (!it.assignees.includes(pid)) it.assignees.push(pid);
    } else {
      it.assignees = it.assignees.filter(a => a !== pid);
    }
    render();
  }
});

['tax','tip'].forEach(id => $(id).addEventListener('input', render));

$('copy').onclick = () => {
  const t = window._lastSummary || 'Nothing to copy yet.';
  navigator.clipboard.writeText(t).then(() => alert('Copied!')).catch(() => alert('Copy failed — select and copy manually.'));
};

$('download').onclick = () => {
  const t = window._lastSummary || 'Empty bill.';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], {type:'text/plain'}));
  a.download = 'bill-split.txt';
  a.click();
};

$('clear').onclick = () => {
  if (!confirm('Clear the whole bill?')) return;
  people = []; items = [];
  $('tax').value = 8; $('tip').value = 18;
  render();
};

load();
</script>
</body>
</html>
