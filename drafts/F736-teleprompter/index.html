<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter — Verse Lab</title>
<style>
:root {
  --bg: #0f0f12;
  --fg: #f0f0f0;
  --accent: #5eead4;
  --muted: #888;
  --panel: #1a1a1f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 1rem 1.5rem;
  background: var(--panel);
  border-bottom: 1px solid #333;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}
h1 { margin: 0; font-size: 1.4rem; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: center;
}
label { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 0.4rem; }
input[type="range"] { width: 100px; }
input[type="checkbox"] { accent-color: var(--accent); }
button {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}
button.secondary { background: #333; color: var(--fg); }
button:hover { opacity: 0.9; }
#editor {
  padding: 1rem;
  flex: 0 0 auto;
}
textarea {
  width: 100%;
  min-height: 120px;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid #333;
  border-radius: 8px;
  padding: 0.75rem;
  font-size: 1rem;
  resize: vertical;
}
#prompter {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #000;
  display: none;
}
#prompter.active { display: block; }
#script {
  white-space: pre-wrap;
  line-height: 1.6;
  padding: 20vh 10vw;
  transform-origin: center top;
  will-change: transform;
}
#script.mirror { transform: scaleX(-1); }
#status {
  position: fixed;
  bottom: 1rem;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  padding: 0.4rem 0.8rem;
  border-radius: 20px;
  font-size: 0.8rem;
  color: var(--accent);
  display: none;
}
.fullscreen #status { display: block; }
@media (max-width: 600px) {
  .controls { font-size: 0.8rem; }
}
</style>
</head>
<body>
<header>
  <h1>Teleprompter</h1>
  <div class="controls">
    <label>Speed <input type="range" id="speed" min="20" max="200" value="60"> <span id="speedVal">60</span></label>
    <label>Size <input type="range" id="size" min="16" max="72" value="32"> <span id="sizeVal">32</span>px</label>
    <label><input type="checkbox" id="mirror"> Mirror</label>
    <label><input type="checkbox" id="voice"> Voice</label>
    <button id="playBtn">Play</button>
    <button id="fullBtn" class="secondary">Fullscreen</button>
    <button id="copyBtn" class="secondary">Copy</button>
  </div>
</header>
<div id="editor">
  <textarea id="scriptInput" placeholder="Paste your script here…"></textarea>
</div>
<div id="prompter">
  <div id="script"></div>
</div>
<div id="status">Paused</div>
<script>
const $ = id => document.getElementById(id);
const scriptInput = $('scriptInput');
const scriptEl = $('script');
const prompter = $('prompter');
const playBtn = $('playBtn');
const fullBtn = $('fullBtn');
const speed = $('speed');
const size = $('size');
const mirror = $('mirror');
const voice = $('voice');
const status = $('status');
const speedVal = $('speedVal');
const sizeVal = $('sizeVal');

let playing = false;
let scrollY = 0;
let lastTime = 0;
let rafId = null;
let recognition = null;
let voiceActive = false;

const KEY = 'verse-f736-teleprompter';

function load() {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const data = JSON.parse(saved);
      scriptInput.value = data.script || '';
      speed.value = data.speed || 60;
      size.value = data.size || 32;
      mirror.checked = !!data.mirror;
      voice.checked = !!data.voice;
    }
  } catch (e) {}
  // URL hash
  if (location.hash.length > 1) {
    try {
      const text = decodeURIComponent(location.hash.slice(1));
      if (text.length > 10) scriptInput.value = text;
    } catch (e) {}
  }
  updateUI();
}
function save() {
  const data = {
    script: scriptInput.value,
    speed: +speed.value,
    size: +size.value,
    mirror: mirror.checked,
    voice: voice.checked
  };
  localStorage.setItem(KEY, JSON.stringify(data));
}
function updateUI() {
  speedVal.textContent = speed.value;
  sizeVal.textContent = size.value;
  scriptEl.style.fontSize = size.value + 'px';
  scriptEl.classList.toggle('mirror', mirror.checked);
  scriptEl.textContent = scriptInput.value || 'Paste a script and press Play';
}

function loop(ts) {
  if (!playing) return;
  if (!lastTime) lastTime = ts;
  const dt = (ts - lastTime) / 1000;
  lastTime = ts;
  // Approximate: speed is roughly px per second scaled
  const pxPerSec = (+speed.value) * 0.8;
  scrollY += pxPerSec * dt;
  scriptEl.style.transform = `translateY(${-scrollY}px)` + (mirror.checked ? ' scaleX(-1)' : '');
  if (scrollY > scriptEl.scrollHeight - window.innerHeight * 0.5) {
    // end
  }
  rafId = requestAnimationFrame(loop);
}

function startScroll() {
  playing = true;
  playBtn.textContent = 'Pause';
  status.textContent = voice.checked && voiceActive ? 'Listening…' : 'Scrolling';
  lastTime = 0;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
function stopScroll() {
  playing = false;
  playBtn.textContent = 'Play';
  status.textContent = 'Paused';
  if (rafId) cancelAnimationFrame(rafId);
}

function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    voice.disabled = true;
    return;
  }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onstart = () => { voiceActive = true; if (playing) startScroll(); };
  recognition.onend = () => { voiceActive = false; if (voice.checked && playing) stopScroll(); };
  recognition.onerror = () => { voiceActive = false; };
  recognition.onresult = () => { /* keep alive */ };
}

playBtn.onclick = () => {
  if (!scriptInput.value.trim()) return alert('Paste a script first');
  prompter.classList.add('active');
  document.getElementById('editor').style.display = 'none';
  updateUI();
  scrollY = 0;
  if (playing) {
    stopScroll();
    if (recognition) recognition.stop();
  } else {
    if (voice.checked && recognition) {
      try { recognition.start(); } catch (e) { startScroll(); }
    } else {
      startScroll();
    }
  }
  save();
};

fullBtn.onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    document.body.classList.add('fullscreen');
  } else {
    document.exitFullscreen();
    document.body.classList.remove('fullscreen');
  }
};

$('copyBtn').onclick = () => {
  navigator.clipboard.writeText(scriptInput.value).then(() => {
    const orig = $('copyBtn').textContent;
    $('copyBtn').textContent = 'Copied';
    setTimeout(() => $('copyBtn').textContent = orig, 1200);
  });
};

speed.oninput = size.oninput = () => { updateUI(); save(); };
mirror.onchange = voice.onchange = () => { updateUI(); save(); };
scriptInput.oninput = () => { updateUI(); save(); };

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && document.activeElement !== scriptInput) {
    e.preventDefault();
    playBtn.click();
  }
});

// Scroll wheel scrub
prompter.addEventListener('wheel', e => {
  if (!playing) {
    scrollY = Math.max(0, scrollY + e.deltaY);
    scriptEl.style.transform = `translateY(${-scrollY}px)` + (mirror.checked ? ' scaleX(-1)' : '');
  }
}, { passive: true });

load();
initSpeech();
updateUI();
</script>
</body>
</html>
