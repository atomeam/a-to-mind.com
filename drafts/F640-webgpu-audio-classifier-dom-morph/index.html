<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F640 Ambient Spatial Morph</title>
<style>
body { margin:0; background:#0a0a12; color:#e0e0ff; font-family:system-ui,sans-serif; overflow:hidden; }
#canvas { position:absolute; inset:0; width:100%; height:100%; }
.card { position:absolute; width:120px; height:70px; background:rgba(20,30,60,0.7); border:1px solid #4466aa; border-radius:8px; padding:8px; font-size:12px; pointer-events:auto; transition:transform 0.1s linear, background 0.3s; backdrop-filter:blur(4px); }
.card:hover { border-color:#88aaff; }
#ui { position:absolute; top:12px; left:12px; z-index:10; background:rgba(0,0,0,0.6); padding:12px; border-radius:8px; }
button { background:#2244aa; color:white; border:none; padding:8px 14px; border-radius:4px; cursor:pointer; margin:4px; }
button:hover { background:#3366cc; }
#classBadge { font-weight:bold; padding:4px 8px; border-radius:4px; display:inline-block; }
.quiet { background:#333; }
.speech { background:#226622; }
.music { background:#662266; }
.noise { background:#662222; }
#status { font-size:12px; margin-top:8px; opacity:0.8; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <button id="startBtn">Start Mic</button>
  <button id="sealBtn">Seal Snapshot</button>
  <div id="classBadge" class="quiet">quiet</div>
  <div id="status">Click Start Mic (demo mode if denied)</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const sealBtn = document.getElementById('sealBtn');
const classBadge = document.getElementById('classBadge');
const statusEl = document.getElementById('status');

let audioCtx, analyser, dataArray, micStream;
let className = 'quiet';
let modeScores = { quiet:0, speech:0, music:0, noise:0 };
let cards = [];
let field = new Float32Array(64*64);
let useWebGPU = false;
let gpuDevice, pipeline, densityBuffer;

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

// Create floating cards
for (let i = 0; i < 7; i++) {
  const el = document.createElement('div');
  el.className = 'card';
  el.textContent = `Card ${i+1}\nclick to reinforce`;
  el.style.left = (20 + Math.random()*60) + '%';
  el.style.top = (20 + Math.random()*50) + '%';
  el.onclick = () => { modeScores[className] += 1; statusEl.textContent = `Reinforced ${className} (${modeScores[className]})`; };
  document.body.appendChild(el);
  cards.push({ el, x: Math.random(), y: Math.random(), vx:0, vy:0 });
}

async function initAudio() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const source = audioCtx.createMediaStreamSource(micStream);
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    statusEl.textContent = 'Mic active — speak, play music, or stay quiet';
    return true;
  } catch (e) {
    statusEl.textContent = 'Mic denied — synthetic demo spectrum';
    dataArray = new Uint8Array(128);
    return false;
  }
}

function classify(spectrum) {
  // Simple band energies
  const low = spectrum.slice(0, 10).reduce((a,b)=>a+b,0)/10;
  const mid = spectrum.slice(10, 40).reduce((a,b)=>a+b,0)/30;
  const high = spectrum.slice(40, 80).reduce((a,b)=>a+b,0)/40;
  const total = low + mid + high + 1;
  const flux = spectrum.reduce((a,b,i)=>a + Math.abs(b - (i>0?spectrum[i-1]:b)), 0) / spectrum.length;
  if (total < 15) return 'quiet';
  if (mid > low * 1.4 && mid > high && flux < 30) return 'speech';
  if (high > mid * 0.8 && flux > 20) return 'music';
  return 'noise';
}

function stepField(spectrum) {
  // Simple JS diffusion + sources for fallback / always
  const N = 64;
  const next = new Float32Array(N*N);
  for (let y=1; y<N-1; y++) for (let x=1; x<N-1; x++) {
    const i = y*N + x;
    next[i] = (field[i] + field[i-1] + field[i+1] + field[i-N] + field[i+N]) * 0.18;
  }
  // Inject from spectrum peaks
  for (let b=0; b<Math.min(32, spectrum.length); b++) {
    if (spectrum[b] > 40) {
      const ix = (b * 2) % N;
      const iy = Math.floor(b / 2) % N;
      next[iy*N + ix] += spectrum[b] * 0.02;
    }
  }
  field = next.map(v => Math.max(0, v * 0.97));
}

function updateCards() {
  const N = 64;
  cards.forEach((c, idx) => {
    // Sample a peak-ish location based on mode
    let best = 0, bx=0, by=0;
    const offset = idx * 8;
    for (let k=0; k<20; k++) {
      const x = (offset + k*3) % N;
      const y = (idx*5 + k*2) % N;
      const v = field[y*N + x];
      if (v > best) { best = v; bx = x; by = y; }
    }
    const tx = bx / N;
    const ty = by / N;
    c.x += (tx - c.x) * 0.08;
    c.y += (ty - c.y) * 0.08;
    c.el.style.left = (c.x * 80 + 5) + '%';
    c.el.style.top = (c.y * 70 + 10) + '%';
    const scale = 0.8 + Math.min(1.5, best * 0.5);
    c.el.style.transform = `scale(${scale})`;
    const hue = className === 'music' ? 280 : className === 'speech' ? 120 : className === 'noise' ? 0 : 220;
    c.el.style.background = `hsla(${hue}, 40%, 20%, 0.75)`;
  });
}

function drawField() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const N = 64;
  const sx = canvas.width / N;
  const sy = canvas.height / N;
  for (let y=0; y<N; y++) for (let x=0; x<N; x++) {
    const v = Math.min(1, field[y*N + x]);
    if (v > 0.05) {
      ctx.fillStyle = `rgba(100,150,255,${v*0.6})`;
      ctx.fillRect(x*sx, y*sy, sx, sy);
    }
  }
}

async function tryWebGPU() {
  if (!navigator.gpu) return false;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    gpuDevice = await adapter.requestDevice();
    // Minimal compute pipeline would go here; for this prototype we keep JS field
    // as the visual and note WebGPU readiness
    useWebGPU = true;
    statusEl.textContent += ' | WebGPU ready (JS field active)';
    return true;
  } catch (e) { return false; }
}

function syntheticSpectrum() {
  const t = performance.now() / 1000;
  for (let i=0; i<dataArray.length; i++) {
    dataArray[i] = Math.max(0, Math.sin(t*2 + i*0.1)*40 + Math.sin(t*5 + i)*30 + Math.random()*20);
  }
}

function loop() {
  requestAnimationFrame(loop);
  if (analyser) analyser.getByteFrequencyData(dataArray);
  else syntheticSpectrum();
  className = classify(dataArray);
  classBadge.textContent = className;
  classBadge.className = className;
  stepField(dataArray);
  updateCards();
  drawField();
}

startBtn.onclick = async () => {
  startBtn.disabled = true;
  await initAudio();
  await tryWebGPU();
  loop();
};

sealBtn.onclick = () => {
  const snapshot = {
    ts: new Date().toISOString(),
    class: className,
    modeScores,
    fieldSample: Array.from(field.filter((_,i)=>i%16===0)).slice(0,64),
    note: 'F640 ambient spatial morph seal'
  };
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `f640-seal-${Date.now()}.json`;
  a.click();
  statusEl.textContent = 'Sealed snapshot downloaded';
};

// Auto-start demo
setTimeout(() => { if (!audioCtx) loop(); }, 500);
</script>
</body>
</html>
