<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F853 Lenia Continuous CA Mind — Verse</title>
<style>
body { margin:0; background:#0a0a12; color:#c0c0e0; font-family:system-ui; overflow:hidden; }
canvas { display:block; background:#050510; }
.portal { position:absolute; width:72px; height:72px; border:2px solid #4af; border-radius:8px; background:rgba(20,40,80,0.6); cursor:move; display:flex; align-items:center; justify-content:center; font-size:11px; text-align:center; user-select:none; z-index:10; }
.portal.reward { border-color:#fa4; }
#status { position:absolute; top:8px; left:8px; font-size:12px; z-index:5; pointer-events:none; }
#seal { position:absolute; bottom:8px; right:8px; font-size:11px; z-index:5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Lenia Mind · tilt or drag · click portals to reward</div>
<div id="seal">Seal: none</div>
<div class="portal" id="p1" style="left:20%;top:30%;">P1<br>inject</div>
<div class="portal" id="p2" style="left:55%;top:45%;">P2<br>inject</div>
<div class="portal" id="p3" style="left:35%;top:70%;">P3<br>inject</div>
<script>
const N = 48;
const DT = 0.1;
let mu = 0.15, sigma = 0.015, radius = 4;
let fitness = 0;
let state = new Float32Array(N*N);
let next = new Float32Array(N*N);
let kernel = new Float32Array(N*N);

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const sealEl = document.getElementById('seal');
const portals = [...document.querySelectorAll('.portal')];

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

function idx(x,y) { return ((y+N)%N)*N + ((x+N)%N); }

function buildKernel() {
  kernel.fill(0);
  let sum = 0;
  const r2 = radius*radius;
  for (let dy=-radius-2; dy<=radius+2; dy++) for (let dx=-radius-2; dx<=radius+2; dx++) {
    const d2 = dx*dx + dy*dy;
    if (d2 > 0 && d2 < r2*1.5) {
      const k = Math.exp(-(d2 - r2*0.6)**2 / (r2*0.3));
      kernel[idx(dx,dy)] = k;
      sum += k;
    }
  }
  if (sum > 0) for (let i=0; i<kernel.length; i++) kernel[i] /= sum;
}

function growth(u) {
  const z = (u - mu) / sigma;
  return Math.exp(-z*z * 0.5);
}

function step() {
  next.fill(0);
  for (let y=0; y<N; y++) for (let x=0; x<N; x++) {
    let acc = 0;
    for (let dy=-radius-2; dy<=radius+2; dy++) for (let dx=-radius-2; dx<=radius+2; dx++) {
      const k = kernel[idx(dx,dy)];
      if (k) acc += state[idx(x-dx, y-dy)] * k;
    }
    const g = growth(acc);
    next[idx(x,y)] = Math.max(0, Math.min(1, state[idx(x,y)] + DT * (g - state[idx(x,y)]*0.1)));
  }
  [state, next] = [next, state];
}

function injectAt(nx, ny, amt=0.35) {
  const x = Math.floor(nx * N) % N;
  const y = Math.floor(ny * N) % N;
  for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
    state[idx(x+dx,y+dy)] = Math.min(1, state[idx(x+dx,y+dy)] + amt);
  }
}

function render() {
  const img = ctx.createImageData(N, N);
  for (let i=0; i<N*N; i++) {
    const v = state[i];
    const c = Math.floor(v * 255);
    img.data[i*4] = c*0.3;
    img.data[i*4+1] = c*0.8;
    img.data[i*4+2] = c;
    img.data[i*4+3] = 255;
  }
  const tmp = document.createElement('canvas');
  tmp.width = N; tmp.height = N;
  tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
}

let ox=0, oy=0, px=0, py=0, lastX=0, lastY=0;
if (window.DeviceOrientationEvent) {
  addEventListener('deviceorientation', e => {
    ox = (e.gamma || 0) / 45;
    oy = (e.beta || 0) / 45;
  });
}
addEventListener('pointermove', e => {
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  px = dx / 20; py = dy / 20;
});

portals.forEach(p => {
  let dragging = false, sx, sy, oxp, oyp;
  p.addEventListener('pointerdown', e => {
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    oxp = parseFloat(p.style.left); oyp = parseFloat(p.style.top);
    p.setPointerCapture(e.pointerId);
  });
  p.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    p.style.left = (oxp + dx/innerWidth*100) + '%';
    p.style.top = (oyp + dy/innerHeight*100) + '%';
  });
  p.addEventListener('pointerup', e => {
    dragging = false;
    if (Math.abs(e.clientX-sx)<5 && Math.abs(e.clientY-sy)<5) {
      fitness += 0.05;
      mu = Math.max(0.05, Math.min(0.3, mu + (Math.random()-0.5)*0.01));
      sigma = Math.max(0.005, Math.min(0.04, sigma + (Math.random()-0.5)*0.002));
      p.classList.add('reward');
      setTimeout(() => p.classList.remove('reward'), 400);
    }
  });
});

const DB_NAME = 'verse-f853-lennia';
const BC = new BroadcastChannel('f853-genome');
async function seal() {
  const rec = { mu, sigma, radius, fitness, t: Date.now() };
  try {
    const db = await new Promise((res,rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('seal');
      r.onsuccess = () => res(r.result);
      r.onerror = rej;
    });
    const tx = db.transaction('seal', 'readwrite');
    tx.objectStore('seal').put(rec, 'best');
    await new Promise(r => tx.oncomplete = r);
  } catch(e) {}
  BC.postMessage(rec);
  sealEl.textContent = `Seal: μ=${mu.toFixed(3)} σ=${sigma.toFixed(3)} f=${fitness.toFixed(2)}`;
}
BC.onmessage = e => {
  const r = e.data;
  if (r.fitness > fitness) {
    mu = r.mu; sigma = r.sigma; radius = r.radius; fitness = r.fitness;
    buildKernel();
    sealEl.textContent = `Adopted: f=${fitness.toFixed(2)}`;
  }
};

for (let i=0; i<40; i++) state[Math.floor(Math.random()*N*N)] = Math.random()*0.6 + 0.2;
buildKernel();

let last = 0;
function loop(t) {
  if (t - last > 50) {
    const b = ox || px;
    const c = oy || py;
    mu = Math.max(0.05, Math.min(0.3, mu + b*0.001));
    radius = Math.max(3, Math.min(8, radius + c*0.02));
    buildKernel();
    portals.forEach(p => {
      const nx = parseFloat(p.style.left)/100;
      const ny = parseFloat(p.style.top)/100;
      if (Math.random() < 0.15) injectAt(nx, ny, 0.2);
    });
    step();
    render();
    status.textContent = `Lenia · μ=${mu.toFixed(3)} σ=${sigma.toFixed(3)} r=${radius.toFixed(1)} f=${fitness.toFixed(2)}`;
    if (fitness > 0.2 && Math.random() < 0.02) seal();
    last = t;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

(async () => {
  try {
    const db = await new Promise((res,rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('seal');
      r.onsuccess = () => res(r.result);
      r.onerror = rej;
    });
    const tx = db.transaction('seal', 'readonly');
    const req = tx.objectStore('seal').get('best');
    req.onsuccess = () => {
      if (req.result && req.result.fitness > fitness) {
        mu = req.result.mu; sigma = req.result.sigma; radius = req.result.radius; fitness = req.result.fitness;
        buildKernel();
        sealEl.textContent = `Loaded: f=${fitness.toFixed(2)}`;
      }
    };
  } catch(e) {}
})();
</script>
</body>
</html>
