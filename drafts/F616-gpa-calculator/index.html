<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPA calculator — Verse</title>
<style>
:root { --bg:#0f1115; --card:#1a1d24; --accent:#4f8cff; --text:#e8eaed; --muted:#9aa0a6; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); padding:1rem; line-height:1.4; }
h1 { font-size:1.4rem; margin:0 0 0.5rem; }
.summary { background:var(--card); padding:1rem; border-radius:12px; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; }
.gpa { font-size:2rem; font-weight:700; color:var(--accent); }
.controls { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem; }
button, select, input { font:inherit; padding:0.5rem 0.75rem; border-radius:8px; border:1px solid #333; background:#222; color:var(--text); }
button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
button.secondary { background:#333; }
.course { background:var(--card); padding:0.75rem; border-radius:10px; margin-bottom:0.5rem; display:grid; grid-template-columns:1fr 80px 100px 40px; gap:0.5rem; align-items:center; }
.course input { width:100%; }
.bars { margin:1rem 0; }
.bar-row { display:flex; align-items:center; gap:0.5rem; margin:0.25rem 0; font-size:0.85rem; }
.bar { height:12px; background:#333; border-radius:6px; flex:1; overflow:hidden; }
.bar > div { height:100%; background:var(--accent); }
.note { font-size:0.8rem; color:var(--muted); margin-top:1rem; }
@media (max-width:600px) { .course { grid-template-columns:1fr 70px 90px 36px; } }
</style>
</head>
<body>
<h1>GPA calculator</h1>
<div class="summary">
  <div>
    <div class="gpa" id="gpa">0.00</div>
    <div id="credits">0 credits</div>
  </div>
  <div>
    <button id="copy">Copy summary</button>
    <button id="csv" class="secondary">Download CSV</button>
  </div>
</div>
<div class="controls">
  <label>Scale:
    <select id="scale">
      <option value="4.0">4.0 letter</option>
      <option value="percent">Percent (0–100)</option>
    </select>
  </label>
  <button id="add">+ Add course</button>
  <button id="clear" class="secondary">Clear all</button>
</div>
<div id="list"></div>
<div class="bars" id="bars"></div>
<p class="note">Standard US 4.0 weighting (A=4, B=3, C=2, D=1, F=0). Percent maps 90–100=4, 80–89=3, 70–79=2, 60–69=1, below=0. Saved only on this device. Not a transcript.</p>
<script>
const listEl = document.getElementById('list');
const gpaEl = document.getElementById('gpa');
const creditsEl = document.getElementById('credits');
const barsEl = document.getElementById('bars');
const scaleEl = document.getElementById('scale');
let courses = [];
const KEY = 'verse-f616-gpa';

function gradeToPoints(g, scale) {
  if (scale === 'percent') {
    const n = parseFloat(g);
    if (isNaN(n)) return 0;
    if (n >= 90) return 4;
    if (n >= 80) return 3;
    if (n >= 70) return 2;
    if (n >= 60) return 1;
    return 0;
  }
  const map = { A:4, B:3, C:2, D:1, F:0, a:4, b:3, c:2, d:1, f:0 };
  return map[String(g).trim().toUpperCase()] ?? 0;
}

function recalc() {
  let totalPts = 0, totalCr = 0;
  courses.forEach(c => {
    const cr = parseFloat(c.credits) || 0;
    const pts = gradeToPoints(c.grade, scaleEl.value);
    totalPts += pts * cr;
    totalCr += cr;
  });
  const gpa = totalCr > 0 ? (totalPts / totalCr) : 0;
  gpaEl.textContent = gpa.toFixed(2);
  creditsEl.textContent = totalCr.toFixed(1) + ' credits';
  renderBars();
  save();
}

function render() {
  listEl.innerHTML = '';
  courses.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'course';
    div.innerHTML = `
      <input placeholder="Course name" value="${c.name||''}" data-i="${i}" data-f="name">
      <input type="number" min="0" step="0.5" placeholder="Credits" value="${c.credits||''}" data-i="${i}" data-f="credits">
      <input placeholder="${scaleEl.value==='percent'?'0-100':'A-F'}" value="${c.grade||''}" data-i="${i}" data-f="grade">
      <button data-i="${i}" class="secondary">×</button>
    `;
    listEl.appendChild(div);
  });
  listEl.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = +e.target.dataset.i;
      courses[i][e.target.dataset.f] = e.target.value;
      recalc();
    });
  });
  listEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', e => {
      courses.splice(+e.target.dataset.i, 1);
      render();
      recalc();
    });
  });
}

function renderBars() {
  barsEl.innerHTML = '';
  const max = Math.max(...courses.map(c => parseFloat(c.credits)||0), 1);
  courses.forEach(c => {
    const cr = parseFloat(c.credits)||0;
    const pts = gradeToPoints(c.grade, scaleEl.value);
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `<span style="width:80px;overflow:hidden">${c.name||'—'}</span>
      <div class="bar"><div style="width:${(cr/max*100)}%"></div></div>
      <span>${pts.toFixed(1)} × ${cr}</span>`;
    barsEl.appendChild(row);
  });
}

function save() {
  localStorage.setItem(KEY, JSON.stringify({ courses, scale: scaleEl.value }));
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    courses = d.courses || [{name:'',credits:'3',grade:'A'}];
    if (d.scale) scaleEl.value = d.scale;
  } catch { courses = [{name:'',credits:'3',grade:'A'}]; }
  render();
  recalc();
}

document.getElementById('add').onclick = () => {
  courses.push({name:'',credits:'3',grade: scaleEl.value==='percent'?'90':'A'});
  render();
  recalc();
};
document.getElementById('clear').onclick = () => {
  if (confirm('Clear all courses?')) { courses = []; render(); recalc(); }
};
scaleEl.onchange = () => { render(); recalc(); };
document.getElementById('copy').onclick = () => {
  const text = `GPA ${gpaEl.textContent} on ${creditsEl.textContent} (${scaleEl.value} scale)`;
  navigator.clipboard.writeText(text).then(() => alert('Copied'));
};
document.getElementById('csv').onclick = () => {
  let csv = 'Course,Credits,Grade,Points\n';
  courses.forEach(c => {
    const pts = gradeToPoints(c.grade, scaleEl.value);
    csv += `"${c.name||''}",${c.credits||0},${c.grade||''},${pts}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gpa.csv';
  a.click();
};
load();
</script>
</body>
</html>
