<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scoreboard — Verse Lab F634</title>
<style>
:root { --bg:#0f1115; --card:#1a1d24; --accent:#4cc9f0; --text:#e8e8e8; --muted:#888; --good:#4ade80; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); line-height:1.4; }
header { padding:1rem; text-align:center; border-bottom:1px solid #222; }
h1 { margin:0; font-size:1.4rem; }
.sub { color:var(--muted); font-size:0.85rem; }
main { max-width:720px; margin:0 auto; padding:1rem; }
.card { background:var(--card); border-radius:12px; padding:1rem; margin-bottom:1rem; }
label { display:block; font-size:0.8rem; color:var(--muted); margin:0.5rem 0 0.2rem; }
input, button { font:inherit; }
input[type=text], input[type=number] { width:100%; padding:0.6rem; border:1px solid #333; border-radius:8px; background:#111; color:var(--text); }
.row { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
button { background:var(--accent); color:#000; border:0; padding:0.6rem 1rem; border-radius:8px; font-weight:600; cursor:pointer; }
button.secondary { background:#333; color:var(--text); }
button.danger { background:#c44; color:#fff; }
.players { display:flex; flex-wrap:wrap; gap:0.4rem; margin:0.5rem 0; }
.player-chip { background:#222; padding:0.3rem 0.6rem; border-radius:999px; display:flex; align-items:center; gap:0.4rem; }
.player-chip button { padding:0.1rem 0.4rem; background:#444; font-size:0.75rem; }
.scores { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:0.9rem; }
th, td { padding:0.4rem; text-align:center; border-bottom:1px solid #2a2a2a; }
th { color:var(--muted); font-weight:500; }
input.score { width:4rem; text-align:center; padding:0.3rem; }
.totals { font-weight:700; color:var(--good); }
.bars { margin:1rem 0; }
.bar-row { display:flex; align-items:center; margin:0.3rem 0; cursor:grab; }
.bar-row:active { cursor:grabbing; }
.bar-label { width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.85rem; }
.bar { height:1.4rem; background:linear-gradient(90deg, var(--accent), #7dd3fc); border-radius:6px; transition:width 0.3s; min-width:2px; }
.bar-value { margin-left:0.5rem; font-variant-numeric:tabular-nums; }
.actions { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:1rem; }
.note { font-size:0.75rem; color:var(--muted); margin-top:0.5rem; }
@media (max-width:480px) { .bar-label { width:70px; } }
</style>
</head>
<body>
<header>
  <h1>Scoreboard</h1>
  <div class="sub">Any game · running totals · offline · share link</div>
</header>
<main>
  <div class="card">
    <label>Add player</label>
    <div class="row">
      <input type="text" id="newPlayer" placeholder="Name" autocomplete="off">
      <button id="addPlayer">Add</button>
    </div>
    <div class="players" id="playerList"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <strong>Rounds</strong>
      <button id="addRound" class="secondary">+ Round</button>
    </div>
    <div class="scores" id="tableWrap"></div>
  </div>

  <div class="card">
    <strong>Standings</strong>
    <div class="bars" id="bars"></div>
  </div>

  <div class="actions">
    <button id="copyBtn">Copy standings</button>
    <button id="csvBtn" class="secondary">Download CSV</button>
    <button id="shareBtn" class="secondary">Copy share link</button>
    <button id="clearBtn" class="danger">Clear board</button>
  </div>
  <div class="note">Saved on this device. Share link restores players, scores and order. Nothing leaves your browser.</div>
</main>
<script>
const STORAGE_KEY = 'verse-f634-scoreboard';
let state = { players: [], rounds: [], order: [] };

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
  if (location.hash.length > 1) {
    try {
      const data = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      if (data.players && data.rounds) state = data;
    } catch(e) {}
  }
  if (!state.order) state.order = state.players.map((_,i)=>i);
  render();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const hash = '#' + encodeURIComponent(JSON.stringify(state));
  history.replaceState(null, '', hash);
}

function addPlayer() {
  const input = document.getElementById('newPlayer');
  const name = input.value.trim();
  if (!name) return;
  state.players.push(name);
  state.order.push(state.players.length - 1);
  state.rounds.forEach(r => r.scores.push(0));
  input.value = '';
  save(); render();
}

function removePlayer(idx) {
  state.players.splice(idx, 1);
  state.rounds.forEach(r => r.scores.splice(idx, 1));
  state.order = state.order.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
  save(); render();
}

function addRound() {
  const scores = state.players.map(() => 0);
  state.rounds.push({ name: 'Round ' + (state.rounds.length + 1), scores });
  save(); render();
}

function updateScore(rIdx, pIdx, val) {
  const n = parseFloat(val) || 0;
  state.rounds[rIdx].scores[pIdx] = n;
  save(); render();
}

function updateRoundName(rIdx, name) {
  state.rounds[rIdx].name = name;
  save();
}

function totals() {
  const t = state.players.map(() => 0);
  state.rounds.forEach(r => r.scores.forEach((s, i) => t[i] += s));
  return t;
}

function render() {
  const pl = document.getElementById('playerList');
  pl.innerHTML = state.players.map((p, i) => `
    <span class="player-chip">${escape(p)} <button onclick="removePlayer(${i})">×</button></span>
  `).join('');

  const tot = totals();
  let html = '<table><thead><tr><th>Player</th>';
  state.rounds.forEach((r, ri) => {
    html += `<th><input value="${escape(r.name)}" onchange="updateRoundName(${ri}, this.value)" style="width:5rem;background:#111;color:#eee;border:1px solid #333;border-radius:4px;padding:0.2rem"></th>`;
  });
  html += '<th>Total</th></tr></thead><tbody>';
  state.players.forEach((p, pi) => {
    html += `<tr><td>${escape(p)}</td>`;
    state.rounds.forEach((r, ri) => {
      html += `<td><input class="score" type="number" step="any" value="${r.scores[pi]}" onchange="updateScore(${ri}, ${pi}, this.value)"></td>`;
    });
    html += `<td class="totals">${tot[pi]}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;

  const bars = document.getElementById('bars');
  const max = Math.max(...tot, 1);
  const sorted = state.order.map(i => ({ i, name: state.players[i], total: tot[i] }))
    .sort((a,b) => b.total - a.total);
  bars.innerHTML = sorted.map(item => `
    <div class="bar-row" data-idx="${item.i}">
      <div class="bar-label">${escape(item.name)}</div>
      <div class="bar" style="width:${(item.total / max * 100)}%"></div>
      <div class="bar-value">${item.total}</div>
    </div>
  `).join('');

  makeDraggable();
}

function makeDraggable() {
  const rows = document.querySelectorAll('.bar-row');
  let dragEl = null;
  rows.forEach(row => {
    row.draggable = true;
    row.ondragstart = e => { dragEl = row; e.dataTransfer.effectAllowed = 'move'; };
    row.ondragover = e => { e.preventDefault(); };
    row.ondrop = e => {
      e.preventDefault();
      if (!dragEl || dragEl === row) return;
      const parent = row.parentNode;
      const children = [...parent.children];
      const from = children.indexOf(dragEl);
      const to = children.indexOf(row);
      if (from < to) parent.insertBefore(dragEl, row.nextSibling);
      else parent.insertBefore(dragEl, row);
      state.order = [...parent.children].map(el => parseInt(el.dataset.idx));
      save();
    };
  });
}

function escape(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }

document.getElementById('addPlayer').onclick = addPlayer;
document.getElementById('newPlayer').onkeydown = e => { if (e.key === 'Enter') addPlayer(); };
document.getElementById('addRound').onclick = addRound;
document.getElementById('copyBtn').onclick = () => {
  const tot = totals();
  const lines = state.players.map((p,i) => `${p}: ${tot[i]}`).sort((a,b) => parseFloat(b.split(': ')[1]) - parseFloat(a.split(': ')[1]));
  const text = 'Standings\n' + lines.join('\n');
  navigator.clipboard.writeText(text).then(() => alert('Copied'));
};
document.getElementById('csvBtn').onclick = () => {
  const tot = totals();
  let csv = 'Player,' + state.rounds.map(r => r.name).join(',') + ',Total\n';
  state.players.forEach((p,i) => {
    csv += [p, ...state.rounds.map(r => r.scores[i]), tot[i]].join(',') + '\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'scoreboard.csv';
  a.click();
};
document.getElementById('shareBtn').onclick = () => {
  const url = location.origin + location.pathname + '#' + encodeURIComponent(JSON.stringify(state));
  navigator.clipboard.writeText(url).then(() => alert('Share link copied'));
};
document.getElementById('clearBtn').onclick = () => {
  if (confirm('Clear the whole board?')) {
    state = { players: [], rounds: [], order: [] };
    save(); render();
  }
};

window.removePlayer = removePlayer;
window.updateScore = updateScore;
window.updateRoundName = updateRoundName;

load();
</script>
</body>
</html>
