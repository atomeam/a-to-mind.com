<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chore Rota Maker — Verse</title>
<style>
:root { --bg:#0f1115; --card:#1a1d24; --accent:#4a9eff; --text:#e6e6e6; --muted:#888; --good:#4caf50; --warn:#ff9800; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); line-height:1.4; }
header { padding:1rem; text-align:center; border-bottom:1px solid #333; }
h1 { margin:0; font-size:1.4rem; }
.container { max-width:1100px; margin:0 auto; padding:1rem; }
.inputs { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
@media (max-width:700px) { .inputs { grid-template-columns:1fr; } }
textarea, input { width:100%; background:var(--card); color:var(--text); border:1px solid #333; border-radius:6px; padding:0.5rem; font:inherit; }
label { display:block; margin-bottom:0.3rem; font-size:0.9rem; color:var(--muted); }
.toolbar { display:flex; flex-wrap:wrap; gap:0.5rem; margin:1rem 0; align-items:center; }
button { background:var(--accent); color:#fff; border:none; padding:0.5rem 1rem; border-radius:6px; cursor:pointer; font:inherit; }
button.secondary { background:#333; }
.grid-wrap { overflow-x:auto; margin:1rem 0; }
table.rota { width:100%; border-collapse:collapse; background:var(--card); border-radius:8px; overflow:hidden; }
table.rota th, table.rota td { border:1px solid #333; padding:0.4rem; min-width:80px; vertical-align:top; }
table.rota th { background:#222; font-weight:600; text-align:center; }
.person { font-weight:600; background:#222; }
.cell { min-height:60px; position:relative; }
.chore-card { background:#2a3a4a; border:1px solid var(--accent); border-radius:4px; padding:0.25rem 0.4rem; margin:2px; cursor:grab; font-size:0.85rem; display:inline-block; user-select:none; }
.chore-card:active { cursor:grabbing; }
.load-bar { height:4px; background:#333; border-radius:2px; margin-top:4px; }
.load-fill { height:100%; background:var(--good); border-radius:2px; }
.stats { font-size:0.85rem; color:var(--muted); margin:0.5rem 0; }
.pool { min-height:50px; background:#1a1d24; border:1px dashed #444; border-radius:6px; padding:0.5rem; margin:0.5rem 0; }
footer { text-align:center; padding:1rem; color:var(--muted); font-size:0.8rem; }
canvas { display:none; }
</style>
</head>
<body>
<header>
  <h1>Chore Rota Maker</h1>
  <p>Drag chores onto the weekly grid. Balance for fairness. Download or share the plan.</p>
</header>
<div class="container">
  <div class="inputs">
    <div>
      <label for="people">People (one per line)</label>
      <textarea id="people" rows="6" placeholder="Alex&#10;Jordan&#10;Sam"></textarea>
    </div>
    <div>
      <label for="chores">Chores (one per line, optional: name,difficulty)</label>
      <textarea id="chores" rows="6" placeholder="Dishes,2&#10;Vacuum,3&#10;Trash,1&#10;Cook dinner,4"></textarea>
    </div>
  </div>
  <div class="toolbar">
    <button id="balance">Balance fairly</button>
    <button id="clear" class="secondary">Clear assignments</button>
    <button id="png">Download PNG</button>
    <button id="copy" class="secondary">Copy list</button>
    <button id="share" class="secondary">Share link</button>
    <span id="stats" class="stats"></span>
  </div>
  <div class="pool" id="pool"><em>Unassigned chores appear here. Drag them onto cells.</em></div>
  <div class="grid-wrap">
    <table class="rota" id="rota">
      <thead><tr id="header-row"><th>Person</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>
<canvas id="export"></canvas>
<footer>Everything stays on this device. Void is now Verse everywhere.</footer>
<script>
const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let people = [];
let chores = []; // {id, name, diff}
let assignments = {}; // key: person|day -> choreId
let nextId = 1;

const $ = id => document.getElementById(id);
const peopleEl = $('people'), choresEl = $('chores'), body = $('body'), header = $('header-row');
const pool = $('pool'), stats = $('stats');

function parse() {
  people = peopleEl.value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 12);
  chores = [];
  nextId = 1;
  choresEl.value.split('\n').forEach(line => {
    const [name, d] = line.split(',').map(s => s.trim());
    if (name) chores.push({ id: nextId++, name, diff: Math.max(1, Math.min(5, parseInt(d) || 1)) });
  });
  chores = chores.slice(0, 40);
}

function loadState() {
  try {
    const hash = location.hash.slice(1);
    if (hash) {
      const data = JSON.parse(decodeURIComponent(hash));
      if (data.people) peopleEl.value = data.people.join('\n');
      if (data.chores) choresEl.value = data.chores.map(c => c.diff !== 1 ? `${c.name},${c.diff}` : c.name).join('\n');
      if (data.assignments) assignments = data.assignments;
    } else {
      const saved = localStorage.getItem('verse-f663-rota');
      if (saved) {
        const data = JSON.parse(saved);
        peopleEl.value = data.people.join('\n');
        choresEl.value = data.chores.map(c => c.diff !== 1 ? `${c.name},${c.diff}` : c.name).join('\n');
        assignments = data.assignments || {};
      }
    }
  } catch(e) {}
  parse();
  render();
}

function saveState() {
  const data = { people, chores, assignments };
  localStorage.setItem('verse-f663-rota', JSON.stringify(data));
  history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(data)));
}

function getLoad(person) {
  let load = 0;
  days.forEach(d => {
    const cid = assignments[person + '|' + d];
    if (cid) {
      const c = chores.find(x => x.id === cid);
      if (c) load += c.diff;
    }
  });
  return load;
}

function render() {
  // header
  header.innerHTML = '<th>Person</th>' + days.map(d => `<th>${d}</th>`).join('');
  body.innerHTML = '';
  people.forEach(p => {
    const tr = document.createElement('tr');
    const load = getLoad(p);
    const max = Math.max(1, ...people.map(getLoad));
    tr.innerHTML = `<td class="person">${p}<div class="load-bar"><div class="load-fill" style="width:${(load/max)*100}%"></div></div><small>${load}</small></td>`;
    days.forEach(d => {
      const td = document.createElement('td');
      td.className = 'cell';
      td.dataset.person = p;
      td.dataset.day = d;
      const cid = assignments[p + '|' + d];
      if (cid) {
        const c = chores.find(x => x.id === cid);
        if (c) {
          const card = document.createElement('div');
          card.className = 'chore-card';
          card.draggable = true;
          card.textContent = c.name + (c.diff > 1 ? ` (${c.diff})` : '');
          card.dataset.id = c.id;
          card.addEventListener('dragstart', onDragStart);
          td.appendChild(card);
        }
      }
      td.addEventListener('dragover', e => e.preventDefault());
      td.addEventListener('drop', onDrop);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  // pool
  pool.innerHTML = '';
  const assigned = new Set(Object.values(assignments));
  const free = chores.filter(c => !assigned.has(c.id));
  if (free.length === 0) pool.innerHTML = '<em>All chores assigned. Drag from cells to reassign or unassign.</em>';
  free.forEach(c => {
    const card = document.createElement('div');
    card.className = 'chore-card';
    card.draggable = true;
    card.textContent = c.name + (c.diff > 1 ? ` (${c.diff})` : '');
    card.dataset.id = c.id;
    card.addEventListener('dragstart', onDragStart);
    pool.appendChild(card);
  });
  // stats
  if (people.length) {
    const loads = people.map(getLoad);
    const avg = loads.reduce((a,b)=>a+b,0)/loads.length;
    const maxDiff = Math.max(...loads) - Math.min(...loads);
    stats.textContent = `People: ${people.length} · Chores: ${chores.length} · Avg load: ${avg.toFixed(1)} · Max difference: ${maxDiff}`;
  } else stats.textContent = 'Add people and chores above.';
}

let dragId = null;
function onDragStart(e) {
  dragId = e.target.dataset.id;
  e.dataTransfer.setData('text/plain', dragId);
  e.dataTransfer.effectAllowed = 'move';
}
function onDrop(e) {
  e.preventDefault();
  const id = parseInt(e.dataTransfer.getData('text/plain') || dragId);
  const cell = e.currentTarget;
  const person = cell.dataset.person;
  const day = cell.dataset.day;
  if (!person || !day) return;
  // remove from wherever it was
  for (const k in assignments) if (assignments[k] == id) delete assignments[k];
  assignments[person + '|' + day] = id;
  saveState();
  render();
}
// allow drop on pool to unassign
pool.addEventListener('dragover', e => e.preventDefault());
pool.addEventListener('drop', e => {
  e.preventDefault();
  const id = parseInt(e.dataTransfer.getData('text/plain') || dragId);
  for (const k in assignments) if (assignments[k] == id) delete assignments[k];
  saveState();
  render();
});

function balance() {
  parse();
  assignments = {};
  if (!people.length || !chores.length) { render(); return; }
  // simple: distribute chores across days and people by lowest load
  const queue = [...chores];
  days.forEach(day => {
    // for this day, assign remaining chores preferring low load
    const dayChores = queue.splice(0, Math.ceil(queue.length / (days.length - days.indexOf(day)) || 1));
    dayChores.forEach(c => {
      let best = people[0];
      let bestLoad = Infinity;
      people.forEach(p => {
        const l = getLoad(p); // current including previous days
        if (l < bestLoad) { bestLoad = l; best = p; }
      });
      assignments[best + '|' + day] = c.id;
    });
  });
  // leftover to lowest
  queue.forEach(c => {
    let best = people[0];
    let bestLoad = Infinity;
    people.forEach(p => {
      const l = getLoad(p);
      if (l < bestLoad) { bestLoad = l; best = p; }
    });
    // put on first free day or Mon
    const day = days.find(d => !assignments[best + '|' + d]) || 'Mon';
    assignments[best + '|' + day] = c.id;
  });
  saveState();
  render();
}

function clearAssign() {
  assignments = {};
  saveState();
  render();
}

function downloadPNG() {
  const canvas = $('export');
  const w = 800, h = 40 + people.length * 50;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0f1115'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#e6e6e6'; ctx.font = '14px system-ui';
  ctx.fillText('Weekly Chore Rota', 20, 25);
  const colW = (w - 120) / 7;
  days.forEach((d, i) => {
    ctx.fillStyle = '#888';
    ctx.fillText(d, 120 + i * colW + 10, 25);
  });
  people.forEach((p, pi) => {
    const y = 50 + pi * 50;
    ctx.fillStyle = '#4a9eff';
    ctx.fillText(p, 10, y + 20);
    days.forEach((d, di) => {
      const cid = assignments[p + '|' + d];
      if (cid) {
        const c = chores.find(x => x.id === cid);
        if (c) {
          ctx.fillStyle = '#2a3a4a';
          ctx.fillRect(120 + di * colW, y, colW - 4, 40);
          ctx.fillStyle = '#e6e6e6';
          ctx.font = '12px system-ui';
          ctx.fillText(c.name.slice(0, 12), 120 + di * colW + 6, y + 22);
        }
      }
    });
  });
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'chore-rota.png';
  a.click();
}

function copyList() {
  let text = 'Weekly Chore Rota\n\n';
  people.forEach(p => {
    text += p + ':\n';
    days.forEach(d => {
      const cid = assignments[p + '|' + d];
      const c = chores.find(x => x.id === cid);
      text += `  ${d}: ${c ? c.name : '-'}\n`;
    });
    text += '\n';
  });
  navigator.clipboard.writeText(text).then(() => alert('Copied assignment list')).catch(() => prompt('Copy:', text));
}

function share() {
  saveState();
  navigator.clipboard.writeText(location.href).then(() => alert('Share link copied')).catch(() => prompt('Share this link:', location.href));
}

peopleEl.addEventListener('input', () => { parse(); saveState(); render(); });
choresEl.addEventListener('input', () => { parse(); saveState(); render(); });
$('balance').addEventListener('click', balance);
$('clear').addEventListener('click', clearAssign);
$('png').addEventListener('click', downloadPNG);
$('copy').addEventListener('click', copyList);
$('share').addEventListener('click', share);

loadState();
</script>
</body>
</html>
