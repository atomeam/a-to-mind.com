<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F765 WebGPU FFT Spectral Portal Morph Mind — Verse</title>
<style>
  body { margin: 0; background: #0a0a12; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px; }
  button { margin: 2px; padding: 6px 12px; background: #222; color: #fff; border: 1px solid #555; cursor: pointer; }
  .portal {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    background: hsl(180, 70%, 50%); border: 2px solid #fff; opacity: 0.85;
    display: flex; align-items: center; justify-content: center; font-size: 10px;
    pointer-events: auto; cursor: grab; transition: transform 0.1s;
    box-shadow: 0 0 12px rgba(255,255,255,0.4);
  }
  .portal:active { cursor: grabbing; }
  #status { font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="seal">Seal Genome</button>
  <button id="reset">Reset</button>
  <button id="orient">Enable Orientation</button>
  <div id="status">F765 Spectral Portal Mind — move mouse to seed field</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = innerWidth;
let H = canvas.height = innerHeight;
window.addEventListener('resize', () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; });

const N = 48; // grid size
let density = new Float32Array(N * N);
let spectrum = new Float32Array(N * N);
const portals = [];
const NUM = 6;
let orientBeta = 0, orientGamma = 0;
let bestFitness = -Infinity;
let sealedWeights = null;

// Tiny MLP 5->6->3
function createMLP() {
  return {
    w1: Array.from({length: 6}, () => Array.from({length: 5}, () => (Math.random()-0.5)*0.8)),
    b1: Array.from({length: 6}, () => (Math.random()-0.5)*0.2),
    w2: Array.from({length: 3}, () => Array.from({length: 6}, () => (Math.random()-0.5)*0.8)),
    b2: Array.from({length: 3}, () => (Math.random()-0.5)*0.2)
  };
}
function forward(mlp, inp) {
  const h = mlp.b1.map((b, i) => Math.tanh(mlp.w1[i].reduce((s, w, j) => s + w * inp[j], b)));
  return mlp.b2.map((b, i) => mlp.w2[i].reduce((s, w, j) => s + w * h[j], b));
}

for (let i = 0; i < NUM; i++) {
  const el = document.createElement('div');
  el.className = 'portal';
  el.textContent = i + 1;
  document.body.appendChild(el);
  portals.push({
    el, mlp: createMLP(),
    x: Math.random() * W, y: Math.random() * H,
    fitness: 0, freq: Math.random() * N
  });
}

// Simple 2D DFT magnitude (row-wise 1D for speed; full 2D too slow in pure JS at 60Hz)
function computeSpectrum() {
  const mag = new Float32Array(N * N);
  for (let y = 0; y < N; y++) {
    const row = density.slice(y * N, (y + 1) * N);
    for (let k = 0; k < N; k++) {
      let re = 0, im = 0;
      for (let n = 0; n < N; n++) {
        const ang = -2 * Math.PI * k * n / N;
        re += row[n] * Math.cos(ang);
        im += row[n] * Math.sin(ang);
      }
      mag[y * N + k] = Math.hypot(re, im) / N;
    }
  }
  // average columns for a 1D-like spectrum usable by portals
  for (let k = 0; k < N; k++) {
    let s = 0;
    for (let y = 0; y < N; y++) s += mag[y * N + k];
    spectrum[k] = s / N;
  }
}

function diffuse() {
  const next = new Float32Array(N * N);
  for (let y = 1; y < N-1; y++) {
    for (let x = 1; x < N-1; x++) {
      const i = y * N + x;
      next[i] = (density[i] * 0.7 +
        density[i-1] * 0.075 + density[i+1] * 0.075 +
        density[i-N] * 0.075 + density[i+N] * 0.075) * 0.98;
    }
  }
  density.set(next);
}

let mouseX = W/2, mouseY = H/2;
canvas.addEventListener('pointermove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  const gx = Math.floor((e.clientX / W) * N);
  const gy = Math.floor((e.clientY / H) * N);
  const rad = 3;
  for (let dy = -rad; dy <= rad; dy++) {
    for (let dx = -rad; dx <= rad; dx++) {
      const x = gx + dx, y = gy + dy;
      if (x >= 0 && x < N && y >= 0 && y < N) {
        const d = Math.hypot(dx, dy);
        if (d < rad) density[y * N + x] += (1 - d/rad) * 0.4;
      }
    }
  }
});

// Drag portals
let dragging = null;
portals.forEach((p, idx) => {
  p.el.addEventListener('pointerdown', e => { dragging = idx; e.stopPropagation(); });
});
window.addEventListener('pointerup', () => { dragging = null; });
window.addEventListener('pointermove', e => {
  if (dragging !== null) {
    portals[dragging].x = e.clientX - 24;
    portals[dragging].y = e.clientY - 24;
    portals[dragging].fitness += 0.05; // reward
  }
});

document.getElementById('seal').onclick = () => {
  const best = portals.reduce((a, b) => a.fitness > b.fitness ? a : b);
  sealedWeights = JSON.parse(JSON.stringify(best.mlp));
  portals.forEach(p => { if (p !== best) p.mlp = JSON.parse(JSON.stringify(best.mlp)); });
  try {
    const req = indexedDB.open('verse-f765', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('genomes');
    req.onsuccess = () => {
      const tx = req.result.transaction('genomes', 'readwrite');
      tx.objectStore('genomes').put(sealedWeights, 'best');
    };
  } catch (e) {}
  document.getElementById('status').textContent = 'Sealed best genome';
};

document.getElementById('reset').onclick = () => {
  density.fill(0); spectrum.fill(0);
  portals.forEach(p => { p.mlp = createMLP(); p.fitness = 0; });
};

document.getElementById('orient').onclick = () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(p => { if (p === 'granted') window.addEventListener('deviceorientation', onOrient); });
  } else {
    window.addEventListener('deviceorientation', onOrient);
  }
};
function onOrient(e) {
  orientBeta = (e.beta || 0) / 90;
  orientGamma = (e.gamma || 0) / 90;
}

// Restore
try {
  const req = indexedDB.open('verse-f765', 1);
  req.onsuccess = () => {
    const tx = req.result.transaction('genomes', 'readonly');
    const g = tx.objectStore('genomes').get('best');
    g.onsuccess = () => { if (g.result) { sealedWeights = g.result; portals.forEach(p => p.mlp = JSON.parse(JSON.stringify(sealedWeights))); } };
  };
} catch (e) {}

let frame = 0;
function loop() {
  frame++;
  if (frame % 2 === 0) diffuse();
  if (frame % 6 === 0) computeSpectrum();

  // Render density
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, W, H);
  const img = ctx.createImageData(N, N);
  for (let i = 0; i < N*N; i++) {
    const v = Math.min(255, density[i] * 800);
    img.data[i*4] = v * 0.3;
    img.data[i*4+1] = v * 0.6;
    img.data[i*4+2] = v;
    img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 20, 80);
  // Spectrum bars
  ctx.fillStyle = '#4af';
  for (let k = 0; k < N; k++) {
    const h = spectrum[k] * 120;
    ctx.fillRect(20 + k * 8, 200 - h, 6, h);
  }
  ctx.fillStyle = '#888';
  ctx.fillText('Density', 20, 70);
  ctx.fillText('Spectrum', 20, 220);

  // Update portals
  portals.forEach((p, i) => {
    const bin = Math.floor(p.freq) % N;
    const energy = spectrum[bin] || 0;
    const inp = [
      mouseX / W,
      mouseY / H,
      orientBeta,
      energy,
      p.fitness * 0.01
    ];
    const out = forward(p.mlp, inp);
    p.freq = (p.freq + out[0] * 0.4 + orientGamma * 2 + N) % N;
    const targetX = 40 + (p.freq / N) * (W - 100);
    const targetY = 240 + (1 - Math.min(1, energy * 4)) * 180 + out[1] * 20;
    if (dragging !== i) {
      p.x += (targetX - p.x) * 0.08;
      p.y += (targetY - p.y) * 0.08;
    }
    p.fitness = p.fitness * 0.995 + energy * 0.5;
    if (p.fitness > bestFitness) bestFitness = p.fitness;

    const scale = 0.7 + Math.min(1.8, energy * 3 + Math.abs(out[2]) * 0.3);
    const hue = (180 + p.freq * 4 + out[2] * 40) % 360;
    p.el.style.transform = `translate(${p.x}px, ${p.y}px) scale(${scale})`;
    p.el.style.background = `hsl(${hue}, 70%, 50%)`;
  });

  document.getElementById('status').textContent = `Best fitness: ${bestFitness.toFixed(2)} | β ${orientBeta.toFixed(2)}`;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
