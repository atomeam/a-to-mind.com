<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F576 WebGPU CA CSS Grid Living Layout Mind — Verse</title>
<style>
  :root {
    --density: 0.3;
    --entropy: 0.5;
    --cx: 50;
    --cy: 50;
    --cols: 4;
    --gap: 12px;
  }
  html, body { margin: 0; height: 100%; background: #0a0a12; color: #e0e0ff; font-family: system-ui, sans-serif; overflow: hidden; }
  #stage {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: var(--gap);
    height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    transition: gap 0.3s, grid-template-columns 0.4s;
  }
  .card {
    background: hsl(calc(var(--entropy) * 240), 60%, 30%);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transform: scale(calc(0.8 + var(--density) * 0.4)) translate(calc((var(--cx) - 50) * 0.2px), calc((var(--cy) - 50) * 0.2px));
    transition: transform 0.3s, background 0.4s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    user-select: none;
  }
  .card h3 { margin: 0 0 8px; font-size: 1.1rem; }
  .card p { margin: 0; font-size: 0.85rem; opacity: 0.8; text-align: center; }
  #chrome {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px;
    font-size: 0.8rem; display: flex; gap: 12px; align-items: center;
  }
  button { background: #224; color: #aaf; border: 1px solid #446; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #336; }
  #status { opacity: 0.7; }
  canvas#vis { position: fixed; bottom: 8px; right: 8px; width: 160px; height: 120px; border: 1px solid #333; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="chrome">
  <span id="status">init</span>
  <button id="seal">Seal</button>
  <button id="reset">Reset</button>
  <button id="inject">Inject</button>
</div>
<div id="stage"></div>
<canvas id="vis" width="160" height="120"></canvas>
<script>
const STAGE = document.getElementById('stage');
const STATUS = document.getElementById('status');
const VIS = document.getElementById('vis');
const VCTX = VIS.getContext('2d');
const W = 64, H = 48;
let grid = new Uint8Array(W * H);
let next = new Uint8Array(W * H);
let rules = new Uint8Array(4 * 4 * 4); // simple lookup: s0,s1,s2 -> new (simplified)
let density = 0.3, entropy = 0.5, cx = 50, cy = 50;
let useGPU = false;
let adapter, device, pipeline, bindGroup;

// Init cards
const CARDS = [
  { t: 'Clock', d: 'Live time' },
  { t: 'Timer', d: 'Countdown' },
  { t: 'Note', d: 'Sticky' },
  { t: 'Calc', d: 'Units' },
  { t: 'Shape', d: 'Draw' },
  { t: 'Link', d: 'Card' },
  { t: 'List', d: 'Tasks' },
  { t: 'Color', d: 'Palette' }
];
CARDS.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<h3>${c.t}</h3><p>${c.d}</p>`;
  el.onclick = () => injectAt(i % 4 * 16, Math.floor(i / 4) * 12);
  STAGE.appendChild(el);
});

function randRules() {
  for (let i = 0; i < rules.length; i++) rules[i] = (Math.random() * 4) | 0;
}
randRules();

function seed() {
  for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < 0.15 ? (Math.random() * 3 | 0) + 1 : 0;
}

function stepCPU() {
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      const n = grid[i - 1] + grid[i + 1] + grid[i - W] + grid[i + W];
      const s = grid[i];
      const key = (s * 16 + (n & 3) * 4 + (grid[i - W - 1] & 3)) % rules.length;
      next[i] = rules[key] % 4;
    }
  }
  [grid, next] = [next, grid];
}

function computeStats() {
  let act = 0, e = 0, sx = 0, sy = 0;
  const counts = [0,0,0,0];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const s = grid[y * W + x];
      counts[s]++;
      if (s) { act++; sx += x; sy += y; }
    }
  }
  density = act / (W * H);
  const tot = act || 1;
  for (let c of counts) if (c) e -= (c / tot) * Math.log2(c / tot + 1e-9);
  entropy = Math.min(1, e / 2);
  cx = act ? (sx / act / W) * 100 : 50;
  cy = act ? (sy / act / H) * 100 : 50;
  document.documentElement.style.setProperty('--density', density.toFixed(3));
  document.documentElement.style.setProperty('--entropy', entropy.toFixed(3));
  document.documentElement.style.setProperty('--cx', cx.toFixed(1));
  document.documentElement.style.setProperty('--cy', cy.toFixed(1));
  document.documentElement.style.setProperty('--cols', Math.max(2, Math.min(6, 2 + Math.round(entropy * 4))));
  document.documentElement.style.setProperty('--gap', (8 + density * 20) + 'px');
  STATUS.textContent = `d=${density.toFixed(2)} e=${entropy.toFixed(2)} ${useGPU ? 'GPU' : 'CPU'}`;
}

function drawVis() {
  VCTX.fillStyle = '#000';
  VCTX.fillRect(0, 0, 160, 120);
  const sx = 160 / W, sy = 120 / H;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const s = grid[y * W + x];
      if (s) {
        VCTX.fillStyle = ['#000', '#4af', '#fa4', '#4fa'][s];
        VCTX.fillRect(x * sx, y * sy, sx, sy);
      }
    }
  }
}

function injectAt(gx, gy) {
  const x = Math.max(1, Math.min(W - 2, gx));
  const y = Math.max(1, Math.min(H - 2, gy));
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const i = (y + dy) * W + (x + dx);
    if (i >= 0 && i < grid.length) grid[i] = 2;
  }
}

document.getElementById('inject').onclick = () => injectAt(W / 2, H / 2);
document.getElementById('reset').onclick = () => { seed(); randRules(); };
document.getElementById('seal').onclick = seal;

async function seal() {
  try {
    const db = await new Promise((res, rej) => {
      const r = indexedDB.open('f576-ca-grid-mind', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('seal');
      r.onsuccess = () => res(r.result);
      r.onerror = rej;
    });
    const tx = db.transaction('seal', 'readwrite');
    tx.objectStore('seal').put({ rules: Array.from(rules), density, entropy, t: Date.now() }, 'best');
    await new Promise(r => tx.oncomplete = r);
    STATUS.textContent = 'sealed';
  } catch (e) { console.warn(e); }
}

async function tryLoad() {
  try {
    const db = await new Promise(res => {
      const r = indexedDB.open('f576-ca-grid-mind', 1);
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    });
    if (!db) return;
    const tx = db.transaction('seal');
    const req = tx.objectStore('seal').get('best');
    req.onsuccess = () => {
      if (req.result && req.result.rules) {
        rules.set(req.result.rules);
        STATUS.textContent = 'restored';
      }
    };
  } catch (e) {}
}

// Minimal WebGPU attempt (placeholder; falls back)
async function tryGPU() {
  if (!navigator.gpu) return;
  try {
    adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return;
    device = await adapter.requestDevice();
    useGPU = true;
    STATUS.textContent = 'GPU ready (sim)';
  } catch (e) { useGPU = false; }
}

function loop() {
  stepCPU();
  computeStats();
  drawVis();
  requestAnimationFrame(loop);
}

seed();
tryLoad();
tryGPU().then(() => loop());
</script>
</body>
</html>
