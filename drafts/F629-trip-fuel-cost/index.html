<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip fuel cost — Verse</title>
<style>
:root { --bg:#0f1419; --fg:#e7e9ea; --accent:#1d9bf0; --card:#1e2732; --ok:#00ba7c; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); line-height:1.4; }
header { padding:1rem; text-align:center; border-bottom:1px solid #2f3336; }
h1 { margin:0; font-size:1.4rem; }
.sub { opacity:0.7; font-size:0.9rem; }
main { max-width:720px; margin:0 auto; padding:1rem; display:grid; gap:1rem; }
.card { background:var(--card); border-radius:12px; padding:1rem; }
label { display:block; margin:0.6rem 0 0.2rem; font-size:0.85rem; opacity:0.9; }
input, select { width:100%; padding:0.6rem; border-radius:8px; border:1px solid #38444d; background:#0f1419; color:var(--fg); font-size:1rem; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
.results { font-size:1.1rem; }
.results strong { color:var(--accent); }
canvas { width:100%; height:180px; background:#15202b; border-radius:8px; display:block; }
.actions { display:flex; gap:0.5rem; flex-wrap:wrap; }
button { background:var(--accent); color:#fff; border:none; padding:0.6rem 1rem; border-radius:999px; font-weight:600; cursor:pointer; }
button.secondary { background:#38444d; }
.note { font-size:0.8rem; opacity:0.6; margin-top:0.5rem; }
.toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:var(--ok); color:#000; padding:0.5rem 1rem; border-radius:999px; opacity:0; transition:opacity 0.3s; pointer-events:none; }
.toast.show { opacity:1; }
@media (max-width:480px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Trip fuel cost</h1>
  <div class="sub">Distance, fuel use and price → volume and cost, split per person</div>
</header>
<main>
  <div class="card">
    <div class="row">
      <div>
        <label for="dist">Distance</label>
        <input id="dist" type="number" min="0" step="any" value="320" placeholder="320">
      </div>
      <div>
        <label for="distUnit">Unit</label>
        <select id="distUnit"><option value="mi">miles</option><option value="km">km</option></select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="eff">Fuel use</label>
        <input id="eff" type="number" min="0" step="any" value="28" placeholder="28">
      </div>
      <div>
        <label for="effUnit">Unit</label>
        <select id="effUnit">
          <option value="mpg">mpg</option>
          <option value="l100">L/100 km</option>
          <option value="kml">km/L</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="price">Price</label>
        <input id="price" type="number" min="0" step="any" value="3.59" placeholder="3.59">
      </div>
      <div>
        <label for="priceUnit">per</label>
        <select id="priceUnit"><option value="gal">gallon</option><option value="l">liter</option></select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="people">People</label>
        <input id="people" type="number" min="1" step="1" value="3">
      </div>
      <div>
        <label for="round">Round trip</label>
        <select id="round"><option value="0">one way</option><option value="1">round trip</option></select>
      </div>
    </div>
    <label for="name">Trip name (optional)</label>
    <input id="name" type="text" placeholder="Weekend drive">
  </div>
  <div class="card">
    <canvas id="dash" width="640" height="180"></canvas>
    <div class="results" id="out"></div>
    <div class="actions">
      <button id="copy">Copy summary</button>
      <button id="txt" class="secondary">Download .txt</button>
      <button id="csv" class="secondary">Download CSV</button>
    </div>
    <div class="note">Units use standard factors (1 gal ≈ 3.785 L, 1 mi ≈ 1.609 km). Straight distance only — no elevation or traffic. Numbers stay on this device.</div>
  </div>
</main>
<div class="toast" id="toast">Copied</div>
<script>
const $ = id => document.getElementById(id);
const KEY = 'verse-f629-fuel';
const MI_KM = 1.609344;
const GAL_L = 3.785411784;

function load() {
  try {
    const h = location.hash.slice(1);
    if (h) {
      const p = new URLSearchParams(h);
      ['dist','eff','price','people','name'].forEach(k => { if (p.has(k)) $(k).value = p.get(k); });
      ['distUnit','effUnit','priceUnit','round'].forEach(k => { if (p.has(k)) $(k).value = p.get(k); });
    } else {
      const s = localStorage.getItem(KEY);
      if (s) {
        const d = JSON.parse(s);
        Object.keys(d).forEach(k => { if ($(k)) $(k).value = d[k]; });
      }
    }
  } catch(e) {}
  calc();
}

function save() {
  const d = {
    dist: $('dist').value, distUnit: $('distUnit').value,
    eff: $('eff').value, effUnit: $('effUnit').value,
    price: $('price').value, priceUnit: $('priceUnit').value,
    people: $('people').value, round: $('round').value,
    name: $('name').value
  };
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {}
  const p = new URLSearchParams(d);
  history.replaceState(null, '', '#' + p.toString());
}

function toMiles(dist, unit) { return unit === 'km' ? dist / MI_KM : dist; }
function toGallons(volL) { return volL / GAL_L; }

function calc() {
  const dist = +$('dist').value || 0;
  const du = $('distUnit').value;
  const eff = +$('eff').value || 0;
  const eu = $('effUnit').value;
  const price = +$('price').value || 0;
  const pu = $('priceUnit').value;
  const people = Math.max(1, +$('people').value || 1);
  const rt = $('round').value === '1';
  const name = $('name').value.trim();

  let note = '';
  if (dist <= 0 || eff <= 0 || price <= 0) {
    note = 'Enter positive distance, fuel use and price.';
  }

  const miles = toMiles(dist, du) * (rt ? 2 : 1);
  let gallons = 0;
  if (eu === 'mpg') gallons = miles / eff;
  else if (eu === 'kml') gallons = (miles / MI_KM) / eff / GAL_L;
  else { // L/100km
    const km = miles * MI_KM;
    gallons = (km / 100 * eff) / GAL_L;
  }
  const liters = gallons * GAL_L;
  const pricePerGal = pu === 'l' ? price * GAL_L : price;
  const total = gallons * pricePerGal;
  const each = total / people;

  const summary = [
    name ? name + ': ' : '',
    dist.toFixed(1) + ' ' + (du === 'mi' ? 'mi' : 'km') + (rt ? ' (round trip)' : ''),
    ' at ' + eff + ' ' + (eu === 'mpg' ? 'mpg' : eu === 'l100' ? 'L/100km' : 'km/L'),
    ', $' + price.toFixed(2) + '/' + (pu === 'gal' ? 'gal' : 'L'),
    ' → ' + (note ? '—' : gallons.toFixed(2) + ' gal / ' + liters.toFixed(1) + ' L'),
    note ? '' : ', $' + total.toFixed(2) + ' total',
    note ? '' : ', $' + each.toFixed(2) + ' each for ' + people
  ].join('');

  $('out').innerHTML = note
    ? '<span style="color:#f4212e">' + note + '</span>'
    : '<strong>$' + total.toFixed(2) + '</strong> total · <strong>$' + each.toFixed(2) + '</strong> each · ' + gallons.toFixed(2) + ' gal (' + liters.toFixed(1) + ' L)';

  draw(miles, gallons, total, note);
  save();
  window._summary = summary;
  window._data = { name, dist, du, eff, eu, price, pu, people, rt, gallons, liters, total, each, summary };
}

function draw(miles, gallons, total, note) {
  const c = $('dash');
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#15202b';
  ctx.fillRect(0, 0, w, h);

  // Road
  ctx.strokeStyle = '#38444d';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(40, 140);
  ctx.lineTo(w - 40, 140);
  ctx.stroke();
  // Car marker
  const maxM = Math.max(miles, 100);
  const x = 40 + (miles / maxM) * (w - 80);
  ctx.fillStyle = '#1d9bf0';
  ctx.beginPath();
  ctx.arc(x, 140, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '12px system-ui';
  ctx.fillText(miles.toFixed(0) + ' mi', x - 18, 125);

  // Fuel gauge arc
  const cx = 160, cy = 70, r = 40;
  ctx.strokeStyle = '#38444d';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 2.25);
  ctx.stroke();
  const pct = Math.min(1, gallons / Math.max(gallons, 10));
  ctx.strokeStyle = '#00ba7c';
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 0.75 + pct * Math.PI * 1.5);
  ctx.stroke();
  ctx.fillStyle = '#e7e9ea';
  ctx.font = 'bold 14px system-ui';
  ctx.fillText(note ? '—' : gallons.toFixed(1) + ' gal', cx - 28, cy + 5);

  // Cost bar
  ctx.fillStyle = '#38444d';
  ctx.fillRect(320, 50, 200, 20);
  const barW = Math.min(200, (total / Math.max(total, 50)) * 200);
  ctx.fillStyle = '#1d9bf0';
  ctx.fillRect(320, 50, barW, 20);
  ctx.fillStyle = '#e7e9ea';
  ctx.fillText(note ? '—' : '$' + total.toFixed(0), 330, 65);
}

['dist','eff','price','people','name','distUnit','effUnit','priceUnit','round'].forEach(id => {
  $(id).addEventListener('input', calc);
  $(id).addEventListener('change', calc);
});

$('copy').onclick = () => {
  navigator.clipboard.writeText(window._summary || '').then(() => {
    const t = $('toast');
    t.textContent = 'Copied';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  });
};

function download(ext, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = (window._data.name || 'trip-fuel') + '.' + ext;
  a.click();
  URL.revokeObjectURL(a.href);
}

$('txt').onclick = () => download('txt', window._summary || '', 'text/plain');
$('csv').onclick = () => {
  const d = window._data;
  const csv = 'name,distance,unit,efficiency,effUnit,price,priceUnit,people,roundTrip,gallons,liters,total,each\n' +
    [d.name, d.dist, d.du, d.eff, d.eu, d.price, d.pu, d.people, d.rt, d.gallons.toFixed(3), d.liters.toFixed(2), d.total.toFixed(2), d.each.toFixed(2)].join(',');
  download('csv', csv, 'text/csv');
};

load();
</script>
</body>
</html>
