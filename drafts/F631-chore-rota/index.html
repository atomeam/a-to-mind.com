<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chore rota</title>
<style>
:root { --bg:#f7f5f2; --fg:#1a1a1a; --card:#fff; --accent:#2d6a4f; --muted:#666; }
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 1rem; line-height: 1.4; }
h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
.subtitle { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
@media (max-width: 700px) { .controls { grid-template-columns: 1fr; } }
.card { background: var(--card); border-radius: 12px; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.card h2 { margin: 0 0 0.75rem; font-size: 1.1rem; }
.list { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem; }
.list-item { display: flex; gap: 0.4rem; align-items: center; }
.list-item input { flex: 1; padding: 0.45rem 0.6rem; border: 1px solid #ddd; border-radius: 6px; font: inherit; }
.list-item button, .add-btn { background: #eee; border: none; border-radius: 6px; padding: 0.4rem 0.7rem; cursor: pointer; font: inherit; }
.list-item button:hover, .add-btn:hover { background: #ddd; }
.add-btn { background: var(--accent); color: #fff; }
.settings { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin: 1rem 0; }
.settings label { display: flex; align-items: center; gap: 0.4rem; }
.settings input[type=number] { width: 5rem; padding: 0.4rem; border: 1px solid #ddd; border-radius: 6px; }
.rota { overflow-x: auto; margin-top: 1rem; }
table { border-collapse: collapse; width: 100%; min-width: 600px; background: var(--card); border-radius: 8px; overflow: hidden; }
th, td { border: 1px solid #e0e0e0; padding: 0.55rem 0.7rem; text-align: left; }
th { background: #f0f0f0; font-weight: 600; }
.person { font-weight: 500; }
.actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; flex-wrap: wrap; }
button.primary { background: var(--accent); color: #fff; border: none; padding: 0.6rem 1.1rem; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 500; }
button.primary:hover { filter: brightness(1.1); }
button.secondary { background: #eee; border: none; padding: 0.6rem 1.1rem; border-radius: 8px; cursor: pointer; font: inherit; }
.empty { color: var(--muted); font-style: italic; padding: 1rem; text-align: center; }
@media print {
  body { background: #fff; padding: 0; }
  .controls, .settings, .actions, .subtitle { display: none !important; }
  .card { box-shadow: none; }
  h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>
<h1>Chore rota</h1>
<p class="subtitle">Add people and chores. Get a fair rotating weekly schedule. Download or print.</p>

<div class="controls">
  <div class="card">
    <h2>People</h2>
    <div id="people-list" class="list"></div>
    <button class="add-btn" id="add-person">+ Add person</button>
  </div>
  <div class="card">
    <h2>Chores</h2>
    <div id="chores-list" class="list"></div>
    <button class="add-btn" id="add-chore">+ Add chore</button>
  </div>
</div>

<div class="settings">
  <label>Weeks to show: <input type="number" id="weeks" min="1" max="12" value="4"></label>
  <label>Start week offset: <input type="number" id="offset" min="0" max="20" value="0"></label>
</div>

<div id="rota-container" class="rota"></div>

<div class="actions">
  <button class="primary" id="download">Download PNG</button>
  <button class="secondary" id="print">Print</button>
  <button class="secondary" id="reset">Reset lists</button>
</div>

<canvas id="export-canvas" style="display:none"></canvas>

<script>
const STORAGE_KEY = 'verse-f631-chore-rota';

let people = [];
let chores = [];

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      people = data.people || [];
      chores = data.chores || [];
      if (data.weeks) document.getElementById('weeks').value = data.weeks;
      if (data.offset != null) document.getElementById('offset').value = data.offset;
    }
  } catch (e) {}
  if (people.length === 0) people = ['Alex', 'Sam', 'Jordan'];
  if (chores.length === 0) chores = ['Dishes', 'Vacuum', 'Trash', 'Bathroom'];
  renderLists();
  renderRota();
}

function save() {
  const data = {
    people,
    chores,
    weeks: +document.getElementById('weeks').value,
    offset: +document.getElementById('offset').value
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function renderLists() {
  const pl = document.getElementById('people-list');
  pl.innerHTML = '';
  people.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `<input type="text" value="${escapeHtml(p)}" data-i="${i}" data-kind="person">
                     <button type="button" data-i="${i}" data-kind="person">×</button>`;
    pl.appendChild(div);
  });
  const cl = document.getElementById('chores-list');
  cl.innerHTML = '';
  chores.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `<input type="text" value="${escapeHtml(c)}" data-i="${i}" data-kind="chore">
                     <button type="button" data-i="${i}" data-kind="chore">×</button>`;
    cl.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
}

function renderRota() {
  const container = document.getElementById('rota-container');
  const weeks = Math.max(1, Math.min(12, +document.getElementById('weeks').value || 4));
  const offset = Math.max(0, +document.getElementById('offset').value || 0);
  if (people.length === 0 || chores.length === 0) {
    container.innerHTML = '<div class="empty">Add at least one person and one chore to see the rota.</div>';
    return;
  }
  const colors = ['#2d6a4f','#40916c','#52b788','#74c69d','#95d5b2','#b7e4c7','#1b4332','#081c15'];
  let html = '<table><thead><tr><th>Week</th>';
  chores.forEach(c => { html += `<th>${escapeHtml(c)}</th>`; });
  html += '</tr></thead><tbody>';
  for (let w = 0; w < weeks; w++) {
    html += `<tr><td><strong>Week ${w + 1}</strong></td>`;
    for (let c = 0; c < chores.length; c++) {
      const pi = (w + c + offset) % people.length;
      const person = people[pi];
      const col = colors[pi % colors.length];
      html += `<td class="person" style="border-left: 4px solid ${col}">${escapeHtml(person)}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

function bind() {
  document.getElementById('add-person').onclick = () => {
    people.push('Person ' + (people.length + 1));
    renderLists(); renderRota(); save();
  };
  document.getElementById('add-chore').onclick = () => {
    chores.push('Chore ' + (chores.length + 1));
    renderLists(); renderRota(); save();
  };
  document.body.addEventListener('input', e => {
    if (e.target.matches('.list-item input')) {
      const i = +e.target.dataset.i;
      const kind = e.target.dataset.kind;
      if (kind === 'person') people[i] = e.target.value;
      else chores[i] = e.target.value;
      renderRota(); save();
    }
  });
  document.body.addEventListener('click', e => {
    if (e.target.matches('.list-item button')) {
      const i = +e.target.dataset.i;
      const kind = e.target.dataset.kind;
      if (kind === 'person') people.splice(i, 1);
      else chores.splice(i, 1);
      renderLists(); renderRota(); save();
    }
  });
  document.getElementById('weeks').oninput = () => { renderRota(); save(); };
  document.getElementById('offset').oninput = () => { renderRota(); save(); };
  document.getElementById('reset').onclick = () => {
    if (confirm('Clear all people and chores?')) {
      people = []; chores = [];
      renderLists(); renderRota(); save();
    }
  };
  document.getElementById('print').onclick = () => window.print();
  document.getElementById('download').onclick = downloadPNG;
}

function downloadPNG() {
  const weeks = Math.max(1, Math.min(12, +document.getElementById('weeks').value || 4));
  const offset = Math.max(0, +document.getElementById('offset').value || 0);
  if (people.length === 0 || chores.length === 0) {
    alert('Add people and chores first.');
    return;
  }
  const canvas = document.getElementById('export-canvas');
  const ctx = canvas.getContext('2d');
  const cellW = 140, cellH = 36, pad = 24, titleH = 40;
  const cols = chores.length + 1;
  const rows = weeks + 1;
  canvas.width = pad * 2 + cols * cellW;
  canvas.height = pad * 2 + titleH + rows * cellH;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.fillText('Chore rota', pad, pad + 22);
  ctx.font = '14px system-ui, sans-serif';
  // header
  ctx.fillStyle = '#f0f0f0';
  ctx.fillRect(pad, pad + titleH, cols * cellW, cellH);
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillText('Week', pad + 8, pad + titleH + 24);
  chores.forEach((c, i) => {
    ctx.fillText(c.slice(0, 16), pad + (i + 1) * cellW + 8, pad + titleH + 24);
  });
  // rows
  ctx.font = '13px system-ui, sans-serif';
  for (let w = 0; w < weeks; w++) {
    const y = pad + titleH + (w + 1) * cellH;
    if (w % 2 === 0) { ctx.fillStyle = '#fafafa'; ctx.fillRect(pad, y, cols * cellW, cellH); }
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText('Week ' + (w + 1), pad + 8, y + 24);
    ctx.font = '13px system-ui, sans-serif';
    for (let c = 0; c < chores.length; c++) {
      const pi = (w + c + offset) % people.length;
      ctx.fillText(people[pi].slice(0, 16), pad + (c + 1) * cellW + 8, y + 24);
    }
  }
  // borders
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 1;
  for (let r = 0; r <= rows; r++) {
    ctx.beginPath(); ctx.moveTo(pad, pad + titleH + r * cellH); ctx.lineTo(pad + cols * cellW, pad + titleH + r * cellH); ctx.stroke();
  }
  for (let c = 0; c <= cols; c++) {
    ctx.beginPath(); ctx.moveTo(pad + c * cellW, pad + titleH); ctx.lineTo(pad + c * cellW, pad + titleH + rows * cellH); ctx.stroke();
  }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'chore-rota.png';
  a.click();
}

load();
bind();
</script>
</body>
</html>
