<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sound level meter</title>
<style>
  :root { --bg: #0f1419; --fg: #e6edf3; --accent: #58a6ff; --peak: #f85149; --card: #161b22; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
  h1 { font-size: 1.4rem; margin: 0.5rem 0; }
  .disclaimer { font-size: 0.8rem; opacity: 0.7; max-width: 36rem; text-align: center; margin: 0.5rem 0 1rem; }
  .meter { background: var(--card); border-radius: 12px; padding: 1.5rem; width: min(100%, 28rem); text-align: center; box-shadow: 0 4px 24px #0006; }
  .level { font-size: 4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; color: var(--accent); }
  .peak { font-size: 1.2rem; color: var(--peak); margin-top: 0.25rem; }
  .unit { font-size: 1rem; opacity: 0.8; }
  canvas { width: 100%; height: 120px; background: #0d1117; border-radius: 8px; margin: 1rem 0; display: block; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin: 1rem 0; }
  button { background: var(--accent); color: #0f1419; border: none; padding: 0.6rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #30363d; color: var(--fg); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { font-size: 0.85rem; opacity: 0.8; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Sound level meter</h1>
<p class="disclaimer">Relative level from this device’s microphone in dBFS. Phones and browsers are not calibrated sound-level meters; values are approximate and device-dependent. Nothing is sent anywhere.</p>

<div class="meter">
  <div class="level" id="level">—</div>
  <div class="unit">dBFS</div>
  <div class="peak" id="peak">Peak: —</div>
  <canvas id="graph" width="400" height="120"></canvas>
  <div id="status">Tap Start to allow the microphone.</div>
</div>

<div class="controls">
  <button id="start">Start listening</button>
  <button id="stop" class="secondary" disabled>Stop</button>
  <button id="copy" class="secondary" disabled>Copy reading</button>
  <button id="download" class="secondary" disabled>Download CSV</button>
  <button id="resetPeak" class="secondary">Reset peak</button>
</div>

<script>
const levelEl = document.getElementById('level');
const peakEl = document.getElementById('peak');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const copyBtn = document.getElementById('copy');
const downloadBtn = document.getElementById('download');
const resetPeakBtn = document.getElementById('resetPeak');

let audioCtx, analyser, source, stream;
let running = false;
let current = -Infinity;
let peak = -Infinity;
let history = []; // {t, db}
const MAX_HISTORY = 600; // ~60s at 10 Hz
const SAMPLE_INTERVAL = 100;

function loadState() {
  try {
    const raw = localStorage.getItem('verse-f709-sound');
    if (raw) {
      const data = JSON.parse(raw);
      if (typeof data.peak === 'number') peak = data.peak;
      if (Array.isArray(data.history)) history = data.history.slice(-MAX_HISTORY);
      updatePeakDisplay();
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem('verse-f709-sound', JSON.stringify({ peak, history: history.slice(-200) }));
  } catch (e) {}
}

function updatePeakDisplay() {
  peakEl.textContent = peak > -Infinity ? `Peak: ${peak.toFixed(1)} dBFS` : 'Peak: —';
}

function drawGraph() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (history.length < 2) return;
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const minDb = -60, maxDb = 0;
  history.forEach((p, i) => {
    const x = (i / (history.length - 1)) * w;
    const norm = (p.db - minDb) / (maxDb - minDb);
    const y = h - Math.max(0, Math.min(1, norm)) * h;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  if (peak > -Infinity) {
    const y = h - Math.max(0, Math.min(1, (peak - minDb) / (maxDb - minDb))) * h;
    ctx.strokeStyle = '#f85149';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function computeRms(data) {
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
  return Math.sqrt(sum / data.length);
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    running = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    copyBtn.disabled = false;
    downloadBtn.disabled = false;
    statusEl.textContent = 'Listening…';
    sampleLoop();
  } catch (err) {
    statusEl.textContent = 'Microphone access denied or unavailable.';
  }
}

function stop() {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  startBtn.disabled = false;
  stopBtn.disabled = true;
  statusEl.textContent = 'Stopped.';
  saveState();
}

const dataArray = new Float32Array(2048);
let lastSample = 0;

function sampleLoop() {
  if (!running) return;
  requestAnimationFrame(sampleLoop);
  const now = performance.now();
  if (now - lastSample < SAMPLE_INTERVAL) return;
  lastSample = now;
  analyser.getFloatTimeDomainData(dataArray);
  const rms = computeRms(dataArray);
  current = rms > 0 ? 20 * Math.log10(rms) : -100;
  if (current > peak) peak = current;
  levelEl.textContent = current.toFixed(1);
  updatePeakDisplay();
  history.push({ t: Date.now(), db: current });
  if (history.length > MAX_HISTORY) history.shift();
  drawGraph();
}

startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);
resetPeakBtn.addEventListener('click', () => { peak = -Infinity; updatePeakDisplay(); saveState(); });

copyBtn.addEventListener('click', async () => {
  const text = `Current: ${current.toFixed(1)} dBFS\nPeak: ${peak > -Infinity ? peak.toFixed(1) : '—'} dBFS\n(Relative, device microphone)`;
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = 'Copied to clipboard.';
  } catch {
    statusEl.textContent = 'Copy failed (permission).';
  }
});

downloadBtn.addEventListener('click', () => {
  const lines = ['timestamp_ms,dBFS'];
  history.forEach(p => lines.push(`${p.t},${p.db.toFixed(2)}`));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sound-level-${new Date().toISOString().slice(0,19).replace(/:/g,'')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  statusEl.textContent = 'CSV downloaded.';
});

window.addEventListener('beforeunload', saveState);
loadState();
drawGraph();
</script>
</body>
</html>
