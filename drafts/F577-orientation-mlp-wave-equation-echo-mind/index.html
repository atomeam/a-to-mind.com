<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F577 Orientation MLP Wave Equation Echo Mind</title>
<style>
body { margin:0; background:#0a0a12; color:#e0e0ff; font-family:system-ui,sans-serif; overflow:hidden; }
#canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
#ui { position:absolute; top:10px; left:10px; z-index:10; background:rgba(0,0,20,0.7); padding:10px; border-radius:8px; }
button { margin:4px; padding:6px 12px; background:#223; color:#fff; border:1px solid #55f; border-radius:4px; cursor:pointer; }
button:hover { background:#335; }
#status { font-size:12px; margin-top:6px; }
.echo {
  position:absolute; background:rgba(20,30,60,0.85); border:1px solid #88f; border-radius:6px;
  padding:8px; min-width:120px; font-size:11px; cursor:move; z-index:5; pointer-events:auto;
  transition:transform 0.1s;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <button id="seal">Seal MLP</button>
  <button id="reset">Reset</button>
  <button id="inject">Inject Source</button>
  <div id="status">Tilt device or move pointer. Waves driven by local MLP.</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
let W = 64, H = 48;
let height = new Float32Array(W * H);
let vel = new Float32Array(W * H);
let nextH = new Float32Array(W * H);
const c2 = 0.25; // wave speed squared
const damp = 0.98;
// Tiny MLP: 4 -> 8 -> 4
let w1 = new Float32Array(4 * 8);
let b1 = new Float32Array(8);
let w2 = new Float32Array(8 * 4);
let b2 = new Float32Array(4);
function randW(a) { for(let i=0;i<a.length;i++) a[i] = (Math.random()-0.5)*0.5; }
randW(w1); randW(b1); randW(w2); randW(b2);
let beta=0, gamma=0, dB=0, dG=0, lastB=0, lastG=0;
let echoes = [];
function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize(); addEventListener('resize', resize);
function mlp(input) {
  // forward
  let h = new Float32Array(8);
  for(let i=0;i<8;i++) {
    let s = b1[i];
    for(let j=0;j<4;j++) s += input[j] * w1[j*8 + i];
    h[i] = Math.tanh(s);
  }
  let o = new Float32Array(4);
  for(let i=0;i<4;i++) {
    let s = b2[i];
    for(let j=0;j<8;j++) s += h[j] * w2[j*4 + i];
    o[i] = Math.tanh(s);
  }
  return o;
}
function stepWave(srcX, srcY, amp) {
  const ix = Math.floor(srcX * W) % W;
  const iy = Math.floor(srcY * H) % H;
  const idx = iy * W + ix;
  height[idx] += amp * 0.5;
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++) {
    const i = y*W + x;
    const lap = height[i-1] + height[i+1] + height[i-W] + height[i+W] - 4*height[i];
    vel[i] = damp * (vel[i] + c2 * lap);
    nextH[i] = height[i] + vel[i];
  }
  [height, nextH] = [nextH, height];
}
function paint() {
  const cw = canvas.width, ch = canvas.height;
  const sx = cw / W, sy = ch / H;
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0,0,cw,ch);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) {
    const h = height[y*W + x];
    const v = Math.min(1, Math.max(0, (h+1)/2));
    ctx.fillStyle = `hsl(${200 + v*60}, 70%, ${20 + v*50}%)`;
    ctx.fillRect(x*sx, y*sy, sx+1, sy+1);
  }
}
function updateEchoes() {
  let peaks = [];
  for(let y=2;y<H-2;y+=2) for(let x=2;x<W-2;x+=2) {
    const h = Math.abs(height[y*W+x]);
    if(h > 0.4) peaks.push({x,y,h});
  }
  peaks.sort((a,b)=>b.h-a.h);
  peaks = peaks.slice(0,6);
  while(echoes.length < peaks.length) {
    const el = document.createElement('div');
    el.className = 'echo';
    el.textContent = 'echo';
    document.body.appendChild(el);
    echoes.push({el, tx:0, ty:0});
    makeDraggable(el);
  }
  peaks.forEach((p,i) => {
    if(i >= echoes.length) return;
    const e = echoes[i];
    e.tx = (p.x / W) * innerWidth;
    e.ty = (p.y / H) * innerHeight;
    e.el.style.left = e.tx + 'px';
    e.el.style.top = e.ty + 'px';
    e.el.textContent = `echo ${beta.toFixed(0)}°/${gamma.toFixed(0)}° E:${p.h.toFixed(2)}`;
  });
}
function makeDraggable(el) {
  let ox, oy;
  el.onpointerdown = e => {
    ox = e.clientX - parseFloat(el.style.left);
    oy = e.clientY - parseFloat(el.style.top);
    el.setPointerCapture(e.pointerId);
  };
  el.onpointermove = e => {
    if(el.hasPointerCapture(e.pointerId)) {
      el.style.left = (e.clientX - ox) + 'px';
      el.style.top = (e.clientY - oy) + 'px';
    }
  };
}
let orientOK = false;
function onOrient(e) {
  orientOK = true;
  beta = e.beta || 0;
  gamma = e.gamma || 0;
  dB = beta - lastB; lastB = beta;
  dG = gamma - lastG; lastG = gamma;
}
if(window.DeviceOrientationEvent) {
  if(typeof DeviceOrientationEvent.requestPermission === 'function') {
    document.body.addEventListener('click', () => {
      DeviceOrientationEvent.requestPermission().then(p => {
        if(p==='granted') addEventListener('deviceorientation', onOrient);
      }).catch(()=>{});
    }, {once:true});
  } else {
    addEventListener('deviceorientation', onOrient);
  }
}
let px=0.5, py=0.5;
canvas.onpointermove = e => {
  if(!orientOK) {
    px = e.clientX / innerWidth;
    py = e.clientY / innerHeight;
  }
};
canvas.onclick = e => {
  const x = e.clientX / innerWidth;
  const y = e.clientY / innerHeight;
  const ix = Math.floor(x * W), iy = Math.floor(y * H);
  height[iy*W + ix] += 1.5;
};
document.getElementById('inject').onclick = () => {
  height[Math.floor(H/2)*W + Math.floor(W/2)] += 2;
};
document.getElementById('reset').onclick = () => {
  height.fill(0); vel.fill(0);
  randW(w1); randW(b1); randW(w2); randW(b2);
  echoes.forEach(e => e.el.remove());
  echoes = [];
};
const DB_NAME = 'f577-wave-mlp-mind';
function seal() {
  const data = {
    w1: Array.from(w1), b1: Array.from(b1),
    w2: Array.from(w2), b2: Array.from(b2),
    height: Array.from(height)
  };
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore('seal');
  req.onsuccess = e => {
    const tx = e.target.result.transaction('seal', 'readwrite');
    tx.objectStore('seal').put(data, 'best');
    status.textContent = 'Sealed to IndexedDB';
  };
}
document.getElementById('seal').onclick = seal;
function load() {
  const req = indexedDB.open(DB_NAME, 1);
  req.onsuccess = e => {
    const tx = e.target.result.transaction('seal', 'readonly');
    const g = tx.objectStore('seal').get('best');
    g.onsuccess = () => {
      if(g.result) {
        w1.set(g.result.w1); b1.set(g.result.b1);
        w2.set(g.result.w2); b2.set(g.result.b2);
        height.set(g.result.height);
        status.textContent = 'Restored sealed MLP + field';
      }
    };
  };
}
load();
function loop() {
  const inp = orientOK ? [beta/90, gamma/90, dB/10, dG/10] : [px*2-1, py*2-1, 0, 0];
  const out = mlp(inp);
  const srcX = (out[0]+1)/2;
  const srcY = (out[1]+1)/2;
  const amp = (out[2]+1)*0.3;
  stepWave(srcX, srcY, amp);
  paint();
  updateEchoes();
  status.textContent = orientOK ? `Orient β:${beta.toFixed(1)} γ:${gamma.toFixed(1)}` : `Pointer proxy ${px.toFixed(2)},${py.toFixed(2)}`;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
