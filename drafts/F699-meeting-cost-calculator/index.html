<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting cost calculator</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --text: #e8eef4;
    --muted: #8b9bb4;
    --accent: #3d8bfd;
    --good: #2ecc71;
    --warn: #f39c12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1rem;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.6rem 0 0.25rem; }
  input[type="number"] {
    width: 100%;
    padding: 0.65rem;
    border: 1px solid #2c3a4f;
    border-radius: 8px;
    background: #121820;
    color: var(--text);
    font-size: 1.05rem;
  }
  .row { display: flex; gap: 0.75rem; }
  .row > div { flex: 1; }
  .cost-display {
    text-align: center;
    padding: 1.2rem 0;
  }
  .big {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--good);
  }
  .per { color: var(--muted); font-size: 0.95rem; margin-top: 0.3rem; }
  .people {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    justify-content: center;
    margin: 0.8rem 0;
    min-height: 48px;
  }
  .person {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.35;
    transition: opacity 0.2s, transform 0.2s;
  }
  .person.active { opacity: 1; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    margin: 0.25rem;
  }
  button.secondary { background: #2c3a4f; }
  button:disabled { opacity: 0.5; }
  .actions { text-align: center; margin-top: 0.5rem; }
  .note { font-size: 0.8rem; color: var(--muted); margin-top: 0.8rem; }
  .bar {
    height: 8px;
    background: #2c3a4f;
    border-radius: 4px;
    overflow: hidden;
    margin: 0.5rem 0;
  }
  .bar > div {
    height: 100%;
    background: var(--warn);
    width: 0%;
    transition: width 0.3s;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Meeting cost calculator</h1>
  <p class="sub">See what the meeting really costs. Everything stays on this device.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="attendees">People</label>
        <input type="number" id="attendees" min="1" max="50" value="6" step="1">
      </div>
      <div>
        <label for="rate">Avg hourly rate</label>
        <input type="number" id="rate" min="0" step="0.01" value="80">
      </div>
    </div>
    <label for="minutes">Planned length (minutes)</label>
    <input type="number" id="minutes" min="1" max="480" value="30" step="1">
  </div>

  <div class="card">
    <div class="cost-display">
      <div class="big" id="total">$0</div>
      <div class="per" id="per">$0 per minute</div>
    </div>
    <div class="people" id="people"></div>
    <div class="bar"><div id="progress"></div></div>
    <div style="text-align:center; font-size:0.85rem; color:var(--muted);" id="status">Ready</div>
    <div class="actions">
      <button id="start">Start timer</button>
      <button id="stop" class="secondary" disabled>Stop</button>
      <button id="reset" class="secondary">Reset</button>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <button id="copy">Copy summary</button>
      <button id="download" class="secondary">Download .txt</button>
    </div>
    <p class="note" id="note">Uses the rate you enter. No overhead, no taxes. Live cost uses real elapsed time.</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'verse-f699-meeting';

let startTime = null;
let elapsed = 0;
let timer = null;
let running = false;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      $('attendees').value = d.attendees || 6;
      $('rate').value = d.rate || 80;
      $('minutes').value = d.minutes || 30;
    }
  } catch (e) {}
  update();
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      attendees: +$('attendees').value,
      rate: +$('rate').value,
      minutes: +$('minutes').value
    }));
  } catch (e) {
    $('note').textContent = 'Saving may not persist in this browser mode.';
  }
}

function formatMoney(n) {
  return n.toLocaleString(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
}

function update() {
  const a = Math.max(1, Math.min(50, +$('attendees').value || 1));
  const r = Math.max(0, +$('rate').value || 0);
  const m = Math.max(1, +$('minutes').value || 1);
  const hours = m / 60;
  const total = a * r * hours;
  const per = total / m;

  $('total').textContent = formatMoney(total);
  $('per').textContent = formatMoney(per) + ' per minute';

  const people = $('people');
  people.innerHTML = '';
  for (let i = 0; i < a; i++) {
    const p = document.createElement('div');
    p.className = 'person';
    people.appendChild(p);
  }

  if (running) {
    const secs = elapsed;
    const runCost = a * r * (secs / 3600);
    $('total').textContent = formatMoney(runCost) + ' so far';
    const pct = Math.min(100, (secs / 60) / m * 100);
    $('progress').style.width = pct + '%';
    $('status').textContent = `Running · ${Math.floor(secs/60)}m ${Math.floor(secs%60)}s`;
  } else {
    $('progress').style.width = '0%';
    $('status').textContent = 'Ready';
  }
  save();
}

function tick() {
  if (!running || !startTime) return;
  elapsed = (Date.now() - startTime) / 1000;
  update();
}

$('attendees').oninput = update;
$('rate').oninput = update;
$('minutes').oninput = update;

$('start').onclick = () => {
  if (running) return;
  running = true;
  startTime = Date.now() - elapsed * 1000;
  $('start').disabled = true;
  $('stop').disabled = false;
  timer = setInterval(tick, 250);
  update();
};

$('stop').onclick = () => {
  running = false;
  clearInterval(timer);
  $('start').disabled = false;
  $('stop').disabled = true;
  update();
};

$('reset').onclick = () => {
  running = false;
  clearInterval(timer);
  elapsed = 0;
  startTime = null;
  $('start').disabled = false;
  $('stop').disabled = true;
  update();
};

function summary() {
  const a = +$('attendees').value;
  const r = +$('rate').value;
  const m = +$('minutes').value;
  const total = a * r * (m / 60);
  const per = total / m;
  let text = `Meeting cost calculator\n`;
  text += `${a} people × ${formatMoney(r)}/hr × ${m} min\n`;
  text += `Planned total: ${formatMoney(total)} (${formatMoney(per)} per minute)\n`;
  if (elapsed > 0) {
    const run = a * r * (elapsed / 3600);
    text += `Elapsed so far: ${Math.floor(elapsed/60)}m ${Math.floor(elapsed%60)}s → ${formatMoney(run)}\n`;
  }
  text += `\nGenerated on this device.`;
  return text;
}

$('copy').onclick = async () => {
  const t = summary();
  try {
    await navigator.clipboard.writeText(t);
    $('copy').textContent = 'Copied!';
    setTimeout(() => $('copy').textContent = 'Copy summary', 1500);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    $('copy').textContent = 'Copied!';
    setTimeout(() => $('copy').textContent = 'Copy summary', 1500);
  }
};

$('download').onclick = () => {
  const blob = new Blob([summary()], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'meeting-cost.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

load();
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
