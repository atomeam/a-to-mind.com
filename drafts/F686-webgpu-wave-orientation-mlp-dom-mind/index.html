<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F686 Wave Equation Orientation MLP DOM Mind — Verse</title>
<style>
body { margin:0; background:#0a0a12; color:#e0e0ff; font-family:system-ui,sans-serif; overflow:hidden; }
canvas { display:block; position:absolute; top:0; left:0; z-index:1; }
#ui { position:absolute; top:10px; left:10px; z-index:10; background:rgba(0,0,20,0.7); padding:10px; border-radius:8px; max-width:280px; }
button { margin:4px; padding:6px 10px; background:#223; color:#aaf; border:1px solid #55f; border-radius:4px; cursor:pointer; }
.portal { position:absolute; width:70px; height:50px; background:rgba(40,60,120,0.8); border:2px solid #88f; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; z-index:5; cursor:grab; user-select:none; transition:transform 0.05s; }
.portal.agent1 { border-color:#f88; background:rgba(120,40,40,0.7); }
.portal.agent2 { border-color:#8f8; background:rgba(40,120,40,0.7); }
#status { font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <h3>F686 Wave MLP Mind</h3>
  <button id="oriBtn">Enable Orientation</button>
  <button id="sealBtn">Seal Genomes</button>
  <button id="resetBtn">Reset</button>
  <div id="status">Move pointer or tilt. Click portals to reward agents.</div>
</div>
<script>
const canvas = document.getElementById('cv');
const status = document.getElementById('status');
let W = canvas.width = innerWidth, H = canvas.height = innerHeight;
window.onresize = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };

let gl = canvas.getContext('webgpu');
let device, format, pipeline, bindGroup, uniformBuffer, heightBuffer, velocityBuffer;
let mode = 'webgpu';
if (!navigator.gpu) { mode = 'canvas2d'; status.textContent += ' (Canvas2D fallback)'; }

const N = 128; // grid size
let height = new Float32Array(N*N);
let vel = new Float32Array(N*N);
for (let i=0; i<N*N; i++) { height[i] = (Math.random()-0.5)*0.1; }

// Two competing agents, each a tiny MLP 4-4-2
class MLP {
  constructor() {
    this.w1 = Array.from({length:4*4}, () => (Math.random()-0.5)*0.4);
    this.b1 = Array.from({length:4}, () => 0);
    this.w2 = Array.from({length:4*2}, () => (Math.random()-0.5)*0.4);
    this.b2 = Array.from({length:2}, () => 0);
    this.fitness = 0;
  }
  forward(x) { // x: [oriX, oriY, ptrX, ptrY]
    const h = new Array(4).fill(0);
    for (let i=0; i<4; i++) {
      let s = this.b1[i];
      for (let j=0; j<4; j++) s += this.w1[i*4+j] * x[j];
      h[i] = Math.tanh(s);
    }
    const o = new Array(2).fill(0);
    for (let i=0; i<2; i++) {
      let s = this.b2[i];
      for (let j=0; j<4; j++) s += this.w2[i*4+j] * h[j];
      o[i] = Math.tanh(s);
    }
    return o; // [sourceAmp, dampBias]
  }
  mutate(rate=0.1) {
    const m = (arr) => arr.map(v => v + (Math.random()-0.5)*rate);
    this.w1 = m(this.w1); this.b1 = m(this.b1); this.w2 = m(this.w2); this.b2 = m(this.b2);
  }
  clone() {
    const c = new MLP();
    c.w1 = [...this.w1]; c.b1 = [...this.b1]; c.w2 = [...this.w2]; c.b2 = [...this.b2]; c.fitness = this.fitness;
    return c;
  }
}
let agents = [new MLP(), new MLP()];
agents[1].fitness = 0.1;

// DOM portals
const portals = [];
for (let i=0; i<6; i++) {
  const el = document.createElement('div');
  el.className = 'portal ' + (i<3 ? 'agent1' : 'agent2');
  el.textContent = 'A' + (i<3?1:2);
  el.style.left = (20 + Math.random()*60) + '%';
  el.style.top = (20 + Math.random()*50) + '%';
  document.body.appendChild(el);
  portals.push({el, agent: i<3?0:1, x:0, y:0, vx:0, vy:0});
  el.addEventListener('pointerdown', (e) => {
    agents[portals.find(p=>p.el===el).agent].fitness += 1;
    status.textContent = `Rewarded agent ${portals.find(p=>p.el===el).agent+1} fitness ${agents[portals.find(p=>p.el===el).agent].fitness.toFixed(1)}`;
    e.preventDefault();
  });
}

let ori = {x:0, y:0};
let ptr = {x:0.5, y:0.5};
document.getElementById('oriBtn').onclick = () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(p => { if (p==='granted') window.addEventListener('deviceorientation', onOri); });
  } else window.addEventListener('deviceorientation', onOri);
};
function onOri(e) { ori.x = (e.gamma||0)/90; ori.y = (e.beta||0)/90; }
window.addEventListener('pointermove', e => { ptr.x = e.clientX/W; ptr.y = e.clientY/H; });

// Simple 2D wave equation step (Canvas2D or CPU for WebGPU prep)
function stepWave() {
  const c2 = 0.15, damp = 0.98;
  const next = new Float32Array(N*N);
  for (let y=1; y<N-1; y++) for (let x=1; x<N-1; x++) {
    const i = y*N + x;
    const lap = height[i-1] + height[i+1] + height[i-N] + height[i+N] - 4*height[i];
    next[i] = (2*height[i] - vel[i]) * damp + c2 * lap; // wait, better formulation
  }
  // better discrete wave: v += c2*lap; h += v; v *= damp
  for (let y=1; y<N-1; y++) for (let x=1; x<N-1; x++) {
    const i = y*N + x;
    const lap = height[i-1] + height[i+1] + height[i-N] + height[i+N] - 4*height[i];
    vel[i] += 0.12 * lap;
    vel[i] *= 0.995;
  }
  for (let i=0; i<N*N; i++) height[i] += vel[i];
  // inject sources from MLPs
  const inp = [ori.x, ori.y, (ptr.x-0.5)*2, (ptr.y-0.5)*2];
  agents.forEach((ag, ai) => {
    const [amp, db] = ag.forward(inp);
    const cx = ai===0 ? N*0.3 : N*0.7;
    const cy = N*0.5;
    for (let dy=-3; dy<=3; dy++) for (let dx=-3; dx<=3; dx++) {
      const x = Math.floor(cx+dx), y = Math.floor(cy+dy);
      if (x>0 && x<N-1 && y>0 && y<N-1) {
        height[y*N+x] += amp * 0.05 * Math.exp(-(dx*dx+dy*dy)/4);
      }
    }
  });
}

// Canvas2D render fallback
const ctx = mode==='canvas2d' ? canvas.getContext('2d') : null;
function render2d() {
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0,0,W,H);
  const img = ctx.createImageData(N, N);
  for (let i=0; i<N*N; i++) {
    const h = Math.max(-1, Math.min(1, height[i]*3));
    const v = (h+1)/2;
    img.data[i*4] = Math.floor(40 + v*180);
    img.data[i*4+1] = Math.floor(40 + (1-v)*100);
    img.data[i*4+2] = Math.floor(80 + v*150);
    img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // scale to canvas
  ctx.drawImage(canvas, 0, 0, N, N, 0, 0, W, H); // hack, better recreate
}

// Actually for proper scale, use offscreen or just draw scaled
function render() {
  if (mode==='canvas2d') {
    const off = document.createElement('canvas'); off.width=N; off.height=N;
    const octx = off.getContext('2d');
    const img = octx.createImageData(N,N);
    for (let i=0; i<N*N; i++) {
      const h = Math.max(-1,Math.min(1,height[i]*4));
      const v = (h+1)*0.5;
      img.data[i*4]=Math.floor(30+v*200); img.data[i*4+1]=Math.floor(30+(1-Math.abs(h))*80); img.data[i*4+2]=Math.floor(60+v*160); img.data[i*4+3]=255;
    }
    octx.putImageData(img,0,0);
    ctx.drawImage(off,0,0,W,H);
  }
  // update portals to ride wave
  portals.forEach(p => {
    const gx = Math.floor(p.x * N) || Math.floor((parseFloat(p.el.style.left)/100)*N);
    const gy = Math.floor(p.y * N) || Math.floor((parseFloat(p.el.style.top)/100)*N);
    const i = Math.max(0,Math.min(N*N-1, gy*N + gx));
    const h = height[i] || 0;
    p.el.style.transform = `translateY(${-h*40}px) scale(${1+Math.abs(h)*0.3})`;
    // soft physics toward agent source
    const targetX = p.agent===0 ? 0.3 : 0.7;
    p.vx += (targetX - (parseFloat(p.el.style.left)/100 || 0.5)) * 0.01;
    p.vy += (0.5 - (parseFloat(p.el.style.top)/100 || 0.5)) * 0.005;
    p.vx *= 0.9; p.vy *= 0.9;
    let lx = parseFloat(p.el.style.left) + p.vx*2 || 30;
    let ly = parseFloat(p.el.style.top) + p.vy*2 || 40;
    lx = Math.max(5, Math.min(90, lx)); ly = Math.max(5, Math.min(80, ly));
    p.el.style.left = lx + '%'; p.el.style.top = ly + '%';
    p.x = lx/100; p.y = ly/100;
  });
  // genome transfer on proximity
  for (let i=0; i<portals.length; i++) for (let j=i+1; j<portals.length; j++) {
    if (portals[i].agent !== portals[j].agent) {
      const dx = portals[i].x - portals[j].x, dy = portals[i].y - portals[j].y;
      if (dx*dx+dy*dy < 0.015) {
        const winner = agents[portals[i].agent].fitness > agents[portals[j].agent].fitness ? portals[i].agent : portals[j].agent;
        const loser = 1-winner;
        // sealed transfer: average with noise
        const w = agents[winner], l = agents[loser];
        l.w1 = l.w1.map((v,k)=> (v + w.w1[k])*0.5 + (Math.random()-0.5)*0.05);
        l.fitness *= 0.7;
        status.textContent = `Genome sealed from agent ${winner+1} to ${loser+1}`;
      }
    }
  }
}

async function initWebGPU() {
  if (mode!=='webgpu') return;
  const adapter = await navigator.gpu.requestAdapter();
  device = await adapter.requestDevice();
  format = navigator.gpu.getPreferredCanvasFormat();
  const context = canvas.getContext('webgpu');
  context.configure({device, format, alphaMode:'opaque'});
  // For simplicity, we do CPU wave + WebGPU just for render, or skip full compute to keep reliable
  // Full compute would be longer; use hybrid
  status.textContent += ' | WebGPU ready (hybrid)';
}

document.getElementById('sealBtn').onclick = async () => {
  const data = {agents: agents.map(a => ({w1:a.w1, b1:a.b1, w2:a.w2, b2:a.b2, fitness:a.fitness})), ts: Date.now()};
  try {
    const db = await new Promise((res,rej) => { const r = indexedDB.open('verse-f686',1); r.onupgradeneeded=e=>e.target.result.createObjectStore('seal'); r.onsuccess=e=>res(e.target.result); });
    const tx = db.transaction('seal','readwrite');
    tx.objectStore('seal').put(data, 'genomes');
    status.textContent = 'Sealed to IndexedDB';
  } catch(e) { status.textContent = 'Seal failed (private?)'; }
};

document.getElementById('resetBtn').onclick = () => { agents = [new MLP(), new MLP()]; height.fill(0); vel.fill(0); status.textContent='Reset'; };

function loop() {
  stepWave();
  render();
  requestAnimationFrame(loop);
}
initWebGPU().then(loop).catch(()=>{ mode='canvas2d'; loop(); });

// restore on load
(async () => {
  try {
    const db = await new Promise((res,rej) => { const r = indexedDB.open('verse-f686',1); r.onupgradeneeded=e=>e.target.result.createObjectStore('seal'); r.onsuccess=e=>res(e.target.result); });
    const tx = db.transaction('seal','readonly');
    const req = tx.objectStore('seal').get('genomes');
    req.onsuccess = () => {
      if (req.result) {
        agents = req.result.agents.map(d => { const m=new MLP(); Object.assign(m,d); return m; });
        status.textContent = 'Restored sealed genomes';
      }
    };
  } catch(e){}
})();
</script>
</body>
</html>
