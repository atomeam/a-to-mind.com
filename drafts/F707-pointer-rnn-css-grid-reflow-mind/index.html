<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F707 Pointer RNN CSS Grid Reflow Mind</title>
<style>
  :root {
    --hue: 200;
    --gap: 12px;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: hsl(var(--hue), 40%, 8%);
    color: #e0e0e0;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: var(--gap);
    height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    transition: grid-template-columns 0.15s ease, gap 0.15s ease;
  }
  .cell {
    background: hsl(var(--hue), 30%, 15%);
    border: 1px solid hsl(var(--hue), 40%, 30%);
    border-radius: 8px;
    padding: 12px;
    overflow: auto;
    min-height: 0;
    outline: none;
  }
  .cell:focus {
    border-color: hsl(var(--hue), 60%, 50%);
  }
  #hud {
    position: fixed;
    bottom: 12px;
    left: 12px;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    z-index: 10;
  }
  button {
    margin-right: 8px;
    background: hsl(var(--hue), 40%, 25%);
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.2); }
</style>
</head>
<body>
<div id="grid">
  <div class="cell" contenteditable="true">Pointer history drives the layout.</div>
  <div class="cell" contenteditable="true">Local recurrent net reflows the grid.</div>
  <div class="cell" contenteditable="true">Edit these notes; they bias the mind.</div>
  <div class="cell" contenteditable="true">No particles. No absolute agents.</div>
  <div class="cell" contenteditable="true">The CSS grid template is the embodiment.</div>
  <div class="cell" contenteditable="true">Seal the weights. Download the state.</div>
</div>
<div id="hud">
  <button id="seal">Seal Mind</button>
  <button id="reset">Reset Weights</button>
  <button id="download">Download</button>
  <span id="status">Move pointer to reflow</span>
</div>
<script>
const grid = document.getElementById('grid');
const status = document.getElementById('status');
const cells = Array.from(document.querySelectorAll('.cell'));

// Simple Elman RNN weights (random init)
let weights = null;
function randomWeights() {
  const rand = () => (Math.random() - 0.5) * 0.4;
  return {
    Wh: Array.from({length: 8*4}, rand), // hidden from input
    Uh: Array.from({length: 8*8}, rand), // recurrent
    bh: Array.from({length: 8}, rand),
    Wo: Array.from({length: 5*8}, rand), // output from hidden
    bo: Array.from({length: 5}, rand),
    h: Array(8).fill(0)
  };
}
function loadWeights() {
  try {
    const s = localStorage.getItem('verse-f707-rnn-weights');
    if (s) {
      weights = JSON.parse(s);
      status.textContent = 'Restored sealed mind';
      return;
    }
  } catch(e) {}
  weights = randomWeights();
}
loadWeights();

function tanh(x) { return Math.tanh(x); }
function stepRNN(input) {
  // input: [dx, dy, speed, bias]
  const hNew = new Array(8);
  for (let i = 0; i < 8; i++) {
    let sum = weights.bh[i];
    for (let j = 0; j < 4; j++) sum += weights.Wh[i*4 + j] * input[j];
    for (let j = 0; j < 8; j++) sum += weights.Uh[i*8 + j] * weights.h[j];
    hNew[i] = tanh(sum);
  }
  weights.h = hNew;
  const out = new Array(5);
  for (let i = 0; i < 5; i++) {
    let sum = weights.bo[i];
    for (let j = 0; j < 8; j++) sum += weights.Wo[i*8 + j] * weights.h[j];
    out[i] = tanh(sum);
  }
  return out;
}

let lastX = 0, lastY = 0;
let history = [];
document.addEventListener('pointermove', e => {
  const dx = (e.clientX - lastX) / window.innerWidth;
  const dy = (e.clientY - lastY) / window.innerHeight;
  lastX = e.clientX;
  lastY = e.clientY;
  const speed = Math.hypot(dx, dy);
  history.push([dx, dy, speed]);
  if (history.length > 8) history.shift();
});

function avgTextBias() {
  let total = 0;
  cells.forEach(c => total += c.textContent.length);
  return Math.min(1, total / 400) - 0.5;
}

function applyOutput(out) {
  // out: [c1, c2, c3, gap, hue] in [-1,1]
  const c1 = 0.6 + out[0] * 0.5;
  const c2 = 0.6 + out[1] * 0.5;
  const c3 = 0.6 + out[2] * 0.5;
  const sum = c1 + c2 + c3;
  grid.style.gridTemplateColumns = `${c1/sum*3}fr ${c2/sum*3}fr ${c3/sum*3}fr`;
  const gap = 8 + (out[3] + 1) * 12;
  document.documentElement.style.setProperty('--gap', gap + 'px');
  const hue = 180 + out[4] * 80;
  document.documentElement.style.setProperty('--hue', hue);
}

let running = true;
function loop() {
  if (!running) return;
  if (history.length) {
    const recent = history[history.length - 1];
    const bias = avgTextBias();
    const inp = [recent[0]*4, recent[1]*4, recent[2]*4, bias];
    const out = stepRNN(inp);
    applyOutput(out);
    status.textContent = `h-norm ${(weights.h.reduce((a,b)=>a+b*b,0)**0.5).toFixed(2)}`;
  }
  requestAnimationFrame(loop);
}
loop();

document.getElementById('seal').onclick = () => {
  try {
    localStorage.setItem('verse-f707-rnn-weights', JSON.stringify(weights));
    status.textContent = 'Sealed to localStorage';
  } catch(e) {
    status.textContent = 'Seal failed';
  }
};
document.getElementById('reset').onclick = () => {
  weights = randomWeights();
  status.textContent = 'Weights reset';
};
document.getElementById('download').onclick = () => {
  const data = {
    weights,
    cells: cells.map(c => c.textContent)
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'f707-mind-state.json';
  a.click();
};
</script>
</body>
</html>
