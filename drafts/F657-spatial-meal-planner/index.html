<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spatial Weekly Meal Planner — Verse</title>
<style>
:root { --bg: #0f1419; --card: #1a2332; --accent: #3d8bfd; --text: #e6edf3; --muted: #8b949e; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; }
h1 { font-size: 1.4rem; margin: 0 0 1rem; }
.controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
button, input, textarea { background: var(--card); color: var(--text); border: 1px solid #30363d; border-radius: 6px; padding: 0.5rem; font: inherit; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
.grid { display: grid; grid-template-columns: 280px 1fr; gap: 1rem; }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
.palette, .days { background: var(--card); border-radius: 8px; padding: 1rem; }
.meal-card { background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; cursor: grab; }
.meal-card:active { cursor: grabbing; }
.meal-card h3 { margin: 0 0 0.25rem; font-size: 1rem; }
.meal-card small { color: var(--muted); white-space: pre-wrap; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; min-height: 400px; }
@media (max-width: 1000px) { .days { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); } }
.day { background: #161b22; border: 2px dashed #30363d; border-radius: 6px; padding: 0.5rem; min-height: 180px; }
.day h4 { margin: 0 0 0.5rem; text-align: center; font-size: 0.9rem; color: var(--accent); }
.day.drag-over { border-color: var(--accent); background: #1c2128; }
.grocery { margin-top: 1rem; background: var(--card); border-radius: 8px; padding: 1rem; }
.grocery ul { columns: 2; margin: 0; padding-left: 1.2rem; }
.toast { position: fixed; bottom: 1rem; right: 1rem; background: #238636; color: white; padding: 0.5rem 1rem; border-radius: 6px; display: none; }
</style>
</head>
<body>
<h1>Spatial Weekly Meal Planner</h1>
<div class="controls">
  <button id="addMeal">Add meal</button>
  <button id="copyPlan">Copy plan + list</button>
  <button id="download">Download CSV</button>
  <button id="clear">Clear all</button>
</div>
<div class="grid">
  <div class="palette" id="palette">
    <h2>Meals</h2>
    <div id="meals"></div>
  </div>
  <div>
    <div class="days" id="days"></div>
    <div class="grocery">
      <h2>Grocery list</h2>
      <ul id="grocery"></ul>
    </div>
  </div>
</div>
<div class="toast" id="toast">Copied!</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let meals = [];
let assignments = {}; // day -> [mealId]
let nextId = 1;

function load() {
  const hash = location.hash.slice(1);
  if (hash) {
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(hash))));
      meals = data.meals || [];
      assignments = data.assignments || {};
      nextId = Math.max(0, ...meals.map(m => m.id)) + 1;
      return;
    } catch(e) {}
  }
  const saved = localStorage.getItem('verse-f657-meal');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      meals = data.meals || [];
      assignments = data.assignments || {};
      nextId = Math.max(0, ...meals.map(m => m.id)) + 1;
      return;
    } catch(e) {}
  }
  // samples
  meals = [
    {id: nextId++, name: 'Oatmeal', ingredients: 'oats 1 cup\nmilk 1 cup\nbanana 1'},
    {id: nextId++, name: 'Chicken salad', ingredients: 'chicken breast 200g\nlettuce 1 head\ntomato 2\nolive oil 2 tbsp'},
    {id: nextId++, name: 'Pasta', ingredients: 'pasta 200g\ntomato sauce 1 jar\nparmesan 50g'}
  ];
  assignments = { Mon: [1], Tue: [2] };
}

function save() {
  const data = { meals, assignments };
  localStorage.setItem('verse-f657-meal', JSON.stringify(data));
  const hash = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  history.replaceState(null, '', '#' + hash);
}

function render() {
  const mealsEl = document.getElementById('meals');
  mealsEl.innerHTML = '';
  meals.forEach(m => {
    const card = document.createElement('div');
    card.className = 'meal-card';
    card.draggable = true;
    card.dataset.id = m.id;
    card.innerHTML = `<h3>${m.name}</h3><small>${m.ingredients}</small>`;
    card.ondragstart = e => e.dataTransfer.setData('text/plain', m.id);
    card.onclick = () => editMeal(m);
    mealsEl.appendChild(card);
  });

  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';
  DAYS.forEach(day => {
    const col = document.createElement('div');
    col.className = 'day';
    col.dataset.day = day;
    col.innerHTML = `<h4>${day}</h4>`;
    (assignments[day] || []).forEach(id => {
      const m = meals.find(x => x.id === id);
      if (m) {
        const mini = document.createElement('div');
        mini.className = 'meal-card';
        mini.style.fontSize = '0.85rem';
        mini.textContent = m.name;
        mini.draggable = true;
        mini.ondragstart = e => e.dataTransfer.setData('text/plain', m.id);
        col.appendChild(mini);
      }
    });
    col.ondragover = e => { e.preventDefault(); col.classList.add('drag-over'); };
    col.ondragleave = () => col.classList.remove('drag-over');
    col.ondrop = e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = +e.dataTransfer.getData('text/plain');
      if (!assignments[day]) assignments[day] = [];
      if (!assignments[day].includes(id)) assignments[day].push(id);
      // remove from other days
      DAYS.forEach(d => {
        if (d !== day && assignments[d]) assignments[d] = assignments[d].filter(x => x !== id);
      });
      save();
      render();
    };
    daysEl.appendChild(col);
  });

  // grocery
  const items = new Set();
  DAYS.forEach(day => {
    (assignments[day] || []).forEach(id => {
      const m = meals.find(x => x.id === id);
      if (m) m.ingredients.split('\n').forEach(line => {
        const t = line.trim();
        if (t) items.add(t);
      });
    });
  });
  document.getElementById('grocery').innerHTML = [...items].sort().map(i => `<li>${i}</li>`).join('');
}

function editMeal(m) {
  const name = prompt('Meal name', m.name);
  if (name === null) return;
  const ings = prompt('Ingredients (one per line)', m.ingredients);
  if (ings === null) return;
  m.name = name;
  m.ingredients = ings;
  save();
  render();
}

document.getElementById('addMeal').onclick = () => {
  const name = prompt('Meal name');
  if (!name) return;
  const ings = prompt('Ingredients (one per line)') || '';
  meals.push({ id: nextId++, name, ingredients: ings });
  save();
  render();
};

document.getElementById('copyPlan').onclick = () => {
  let text = 'Weekly Meal Plan\n\n';
  DAYS.forEach(day => {
    const names = (assignments[day] || []).map(id => meals.find(m => m.id === id)?.name).filter(Boolean);
    text += `${day}: ${names.join(', ') || '—'}\n`;
  });
  text += '\nGrocery list:\n' + [...document.getElementById('grocery').querySelectorAll('li')].map(li => '- ' + li.textContent).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 1500);
  });
};

document.getElementById('download').onclick = () => {
  let csv = 'Day,Meals\n';
  DAYS.forEach(day => {
    const names = (assignments[day] || []).map(id => meals.find(m => m.id === id)?.name).filter(Boolean).join('; ');
    csv += `${day},"${names}"\n`;
  });
  csv += '\nGrocery\n';
  [...document.getElementById('grocery').querySelectorAll('li')].forEach(li => csv += `"${li.textContent}"\n`);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = 'meal-plan.csv';
  a.click();
};

document.getElementById('clear').onclick = () => {
  if (confirm('Clear all meals and assignments?')) {
    meals = [];
    assignments = {};
    nextId = 1;
    save();
    render();
  }
};

load();
render();
</script>
</body>
</html>
