<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<style>
:root { --bg:#0f1115; --fg:#e8e8e8; --card:#1a1d24; --accent:#4a9eff; --ok:#3dd68c; --muted:#888; }
@media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#111; --card:#fff; --accent:#0066cc; --ok:#0a7; --muted:#555; } }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); padding:1rem; line-height:1.4; }
h1 { font-size:1.6rem; margin:0 0 0.5rem; }
p.lead { color:var(--muted); margin:0 0 1rem; }
.row { display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; }
input[type=text] { flex:1; min-width:180px; padding:0.6rem; border:1px solid #333; border-radius:6px; background:var(--card); color:var(--fg); }
button { padding:0.6rem 1rem; border:none; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font-weight:600; }
button.secondary { background:#333; }
button.danger { background:#c33; }
.grid { display:grid; gap:0.4rem; overflow-x:auto; }
.header, .habit { display:grid; grid-template-columns: 2fr repeat(7, 1fr) 1fr; gap:0.4rem; align-items:center; min-width:600px; }
.header { font-weight:700; color:var(--muted); font-size:0.85rem; }
.habit { background:var(--card); padding:0.5rem; border-radius:8px; }
.name { font-weight:600; }
.check { width:1.4rem; height:1.4rem; cursor:pointer; accent-color:var(--ok); }
.streak { text-align:center; font-variant-numeric:tabular-nums; color:var(--ok); font-weight:700; }
.actions { margin-top:1rem; display:flex; gap:0.5rem; flex-wrap:wrap; }
.toast { position:fixed; bottom:1rem; right:1rem; background:var(--ok); color:#000; padding:0.6rem 1rem; border-radius:6px; opacity:0; transition:opacity 0.3s; }
.toast.show { opacity:1; }
@media print { body { background:#fff; color:#000; } button, .row, .actions { display:none; } .habit { break-inside:avoid; } }
</style>
</head>
<body>
<h1>Habit tracker</h1>
<p class="lead">Add habits, tick the days you did them this week, see your streaks. Everything stays on this device.</p>

<div class="row">
  <input type="text" id="habitInput" placeholder="Add a habit, e.g. Drink water" maxlength="60">
  <button id="addBtn">Add</button>
</div>

<div class="grid" id="grid">
  <div class="header">
    <div>Habit</div>
    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
    <div>Streak</div>
  </div>
  <div id="habits"></div>
</div>

<div class="actions">
  <button id="copyBtn">Copy summary</button>
  <button id="csvBtn" class="secondary">Download CSV</button>
  <button id="printBtn" class="secondary">Print</button>
  <button id="clearBtn" class="danger">Clear all</button>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const KEY = 'verse-habit-tracker-v1';
let habits = [];

function load() {
  try { habits = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { habits = []; }
  render();
}
function save() { localStorage.setItem(KEY, JSON.stringify(habits)); }

function streakOf(checks) {
  // consecutive from the most recent day backwards, wrapping the week once for simplicity
  let s = 0;
  const today = (new Date().getDay() + 6) % 7; // 0=Mon
  for (let i = 0; i < 7; i++) {
    const d = (today - i + 7) % 7;
    if (checks[d]) s++; else break;
  }
  return s;
}

function render() {
  const el = document.getElementById('habits');
  el.innerHTML = '';
  habits.forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'habit';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = h.name;
    row.appendChild(name);
    for (let d = 0; d < 7; d++) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'check';
      cb.checked = !!h.checks[d];
      cb.onchange = () => { h.checks[d] = cb.checked; save(); render(); };
      const cell = document.createElement('div');
      cell.style.textAlign = 'center';
      cell.appendChild(cb);
      row.appendChild(cell);
    }
    const st = document.createElement('div');
    st.className = 'streak';
    st.textContent = streakOf(h.checks);
    row.appendChild(st);
    el.appendChild(row);
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('addBtn').onclick = () => {
  const v = document.getElementById('habitInput').value.trim();
  if (!v) return;
  habits.push({ name: v, checks: Array(7).fill(false) });
  document.getElementById('habitInput').value = '';
  save(); render();
};
document.getElementById('habitInput').onkeydown = e => { if (e.key === 'Enter') document.getElementById('addBtn').click(); };

document.getElementById('copyBtn').onclick = () => {
  const lines = habits.map(h => `${h.name}: ${streakOf(h.checks)}-day streak (${h.checks.filter(Boolean).length}/7 this week)`);
  const text = lines.length ? lines.join('\n') : 'No habits yet.';
  navigator.clipboard.writeText(text).then(() => toast('Copied')).catch(() => toast('Copy failed'));
};

document.getElementById('csvBtn').onclick = () => {
  let csv = 'Habit,' + DAYS.join(',') + ',Streak\n';
  habits.forEach(h => {
    csv += `"${h.name.replace(/"/g,'""')}",` + h.checks.map(c => c ? 1 : 0).join(',') + ',' + streakOf(h.checks) + '\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'habits.csv';
  a.click();
  toast('CSV downloaded');
};

document.getElementById('printBtn').onclick = () => window.print();
document.getElementById('clearBtn').onclick = () => {
  if (confirm('Clear all habits?')) { habits = []; save(); render(); toast('Cleared'); }
};

load();
</script>
</body>
</html>
