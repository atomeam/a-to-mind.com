<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Card — Weekly Hours & Overtime</title>
<style>
  :root { --bg: #0f1419; --card: #1a2332; --text: #e6edf3; --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.4; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
  .sub { color: #8b949e; font-size: 0.9rem; margin-bottom: 1rem; }
  .controls { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
  label { display: block; font-size: 0.8rem; color: #8b949e; }
  input[type="number"], input[type="time"] { background: var(--card); border: 1px solid #30363d; color: var(--text); padding: 0.4rem; border-radius: 6px; width: 100%; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
  th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #30363d; }
  th { background: #161b22; font-weight: 600; }
  .day { font-weight: 500; }
  .totals { margin-top: 1rem; padding: 1rem; background: var(--card); border-radius: 8px; }
  .totals strong { color: var(--accent); }
  .ot { color: var(--warn); }
  button { background: var(--accent); color: #0d1117; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #30363d; color: var(--text); }
  button:hover { opacity: 0.9; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
  .note { font-size: 0.8rem; color: #8b949e; margin-top: 1rem; }
  .warn { color: var(--warn); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Time Card</h1>
  <p class="sub">Enter daily clock-in, clock-out and breaks. Get weekly total and overtime. Saved on this device. Download CSV or copy summary.</p>

  <div class="controls">
    <div>
      <label for="ot">Overtime after (hours/week)</label>
      <input type="number" id="ot" value="40" min="0" step="0.5" style="width: 120px;">
    </div>
    <button type="button" id="clear" class="secondary">Clear week</button>
  </div>

  <table id="grid">
    <thead>
      <tr><th>Day</th><th>In</th><th>Out</th><th>Break (min)</th><th>Hours</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="totals" id="totals">
    <div>Total hours: <strong id="total">0.00</strong></div>
    <div>Regular: <strong id="reg">0.00</strong> &nbsp; Overtime: <strong id="otout" class="ot">0.00</strong></div>
  </div>

  <div class="actions">
    <button type="button" id="download">Download CSV</button>
    <button type="button" id="copy" class="secondary">Copy summary</button>
  </div>
  <p class="note" id="status">Changes save automatically.</p>
</div>

<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const KEY = 'verse-f860-timecard';

const rowsEl = document.getElementById('rows');
const otInput = document.getElementById('ot');
const totalEl = document.getElementById('total');
const regEl = document.getElementById('reg');
const otoutEl = document.getElementById('otout');
const statusEl = document.getElementById('status');

function parseTime(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}

function minutesToHours(min) {
  return Math.round((min / 60) * 100) / 100;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { ot: 40, days: DAYS.map(() => ({ in: '', out: '', br: 0 })) };
}

function save(state) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    statusEl.textContent = 'Saved on this device.';
  } catch (e) {
    statusEl.textContent = 'Could not save (storage blocked). Session only.';
  }
}

function render() {
  const state = load();
  otInput.value = state.ot;
  rowsEl.innerHTML = '';
  state.days.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="day">${DAYS[i]}</td>
      <td><input type="time" data-i="${i}" data-f="in" value="${d.in}"></td>
      <td><input type="time" data-i="${i}" data-f="out" value="${d.out}"></td>
      <td><input type="number" data-i="${i}" data-f="br" value="${d.br}" min="0" step="5" style="width:80px"></td>
      <td class="hrs" data-i="${i}">0.00</td>
    `;
    rowsEl.appendChild(tr);
  });
  compute();
}

function compute() {
  const state = { ot: parseFloat(otInput.value) || 40, days: [] };
  let totalMin = 0;
  const warnings = [];
  document.querySelectorAll('#rows tr').forEach((tr, i) => {
    const inEl = tr.querySelector('[data-f="in"]');
    const outEl = tr.querySelector('[data-f="out"]');
    const brEl = tr.querySelector('[data-f="br"]');
    const hrsEl = tr.querySelector('.hrs');
    const inMin = parseTime(inEl.value);
    const outMin = parseTime(outEl.value);
    const br = parseFloat(brEl.value) || 0;
    let worked = 0;
    if (inMin != null && outMin != null) {
      let diff = outMin - inMin;
      if (diff < 0) { diff += 24*60; warnings.push(DAYS[i] + ' spans midnight'); }
      worked = Math.max(0, diff - br);
    }
    totalMin += worked;
    hrsEl.textContent = minutesToHours(worked).toFixed(2);
    state.days.push({ in: inEl.value, out: outEl.value, br });
  });
  const totalH = minutesToHours(totalMin);
  const otThresh = state.ot;
  const otH = Math.max(0, totalH - otThresh);
  const regH = totalH - otH;
  totalEl.textContent = totalH.toFixed(2);
  regEl.textContent = regH.toFixed(2);
  otoutEl.textContent = otH.toFixed(2);
  save(state);
  if (warnings.length) statusEl.innerHTML = '<span class="warn">' + warnings.join('; ') + '</span>';
}

function toCSV() {
  const state = load();
  let csv = 'Day,In,Out,BreakMin,Hours\n';
  let totalMin = 0;
  state.days.forEach((d, i) => {
    const inMin = parseTime(d.in);
    const outMin = parseTime(d.out);
    let worked = 0;
    if (inMin != null && outMin != null) {
      let diff = outMin - inMin;
      if (diff < 0) diff += 24*60;
      worked = Math.max(0, diff - (d.br||0));
    }
    totalMin += worked;
    csv += `${DAYS[i]},${d.in},${d.out},${d.br||0},${minutesToHours(worked).toFixed(2)}\n`;
  });
  const totalH = minutesToHours(totalMin);
  const otH = Math.max(0, totalH - (state.ot||40));
  csv += `\nTotalHours,${totalH.toFixed(2)}\nRegular,${(totalH-otH).toFixed(2)}\nOvertime,${otH.toFixed(2)}\nThreshold,${state.ot||40}\n`;
  return csv;
}

document.getElementById('rows').addEventListener('input', compute);
otInput.addEventListener('input', compute);

document.getElementById('download').addEventListener('click', () => {
  const csv = toCSV();
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'timecard-week.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('copy').addEventListener('click', async () => {
  const total = totalEl.textContent;
  const reg = regEl.textContent;
  const ot = otoutEl.textContent;
  const text = `Weekly time card\nTotal: ${total} h\nRegular: ${reg} h\nOvertime: ${ot} h\n(threshold ${otInput.value} h)`;
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = 'Summary copied.';
  } catch (e) {
    statusEl.textContent = 'Copy failed — use download instead.';
  }
});

document.getElementById('clear').addEventListener('click', () => {
  if (confirm('Clear this week?')) {
    localStorage.removeItem(KEY);
    render();
    statusEl.textContent = 'Cleared.';
  }
});

render();
</script>
</body>
</html>
