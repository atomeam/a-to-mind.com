<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label and Name Tag Sheet</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; background: #f8f9fa; color: #111; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin: 0.5rem 0 0.2rem; font-weight: 600; }
  textarea, select, input[type=number], input[type=color], button { font-size: 1rem; padding: 0.4rem; }
  textarea { width: 100%; max-width: 40rem; height: 10rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
  button { background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #0052a3; }
  #preview { border: 1px solid #ccc; margin-top: 1rem; background: white; max-width: 100%; }
  .note { font-size: 0.9rem; color: #555; margin-top: 0.5rem; }
  @media print { .controls { display: none; } }
</style>
</head>
<body>
<h1>Label and name tag sheet</h1>
<p>Paste names (one per line). Choose a size. Download a printable sheet as PNG, or print this page.</p>
<div class="controls">
  <label for="names">Names</label>
  <textarea id="names" placeholder="Alice&#10;Bob&#10;Carol&#10;..."></textarea>
  <div class="row">
    <div>
      <label for="size">Label size</label>
      <select id="size">
        <option value="2x1">2" × 1" (30 per letter page)</option>
        <option value="3.5x2">3.5" × 2" (name tags, 10 per page)</option>
        <option value="1x0.5">1" × 0.5" (80 per page)</option>
        <option value="4x2">4" × 2" (badges, 8 per page)</option>
      </select>
    </div>
    <div>
      <label for="fontSize">Font size (px)</label>
      <input type="number" id="fontSize" value="24" min="8" max="72">
    </div>
    <div>
      <label for="bg">Background</label>
      <input type="color" id="bg" value="#ffffff">
    </div>
    <div>
      <label for="fg">Text color</label>
      <input type="color" id="fg" value="#000000">
    </div>
  </div>
  <button id="gen" style="margin-top:1rem">Generate sheet</button>
  <button id="dl" disabled>Download PNG</button>
</div>
<canvas id="preview" width="816" height="1056"></canvas>
<p class="note">Sheet is sized for US Letter (8.5" × 11" at 96 dpi). Print at 100% scale. Works offline. Nothing is sent anywhere.</p>
<script>
const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');
const namesEl = document.getElementById('names');
const sizeEl = document.getElementById('size');
const fontSizeEl = document.getElementById('fontSize');
const bgEl = document.getElementById('bg');
const fgEl = document.getElementById('fg');
const genBtn = document.getElementById('gen');
const dlBtn = document.getElementById('dl');

const SIZES = {
  '2x1': { w: 2, h: 1, cols: 4, rows: 8, margin: 0.25 },
  '3.5x2': { w: 3.5, h: 2, cols: 2, rows: 5, margin: 0.25 },
  '1x0.5': { w: 1, h: 0.5, cols: 8, rows: 10, margin: 0.125 },
  '4x2': { w: 4, h: 2, cols: 2, rows: 4, margin: 0.25 }
};

function generate() {
  const names = namesEl.value.split(/\n/).map(s => s.trim()).filter(Boolean);
  if (!names.length) { alert('Add at least one name'); return; }
  const spec = SIZES[sizeEl.value];
  const dpi = 96;
  const pageW = 8.5 * dpi;
  const pageH = 11 * dpi;
  canvas.width = pageW;
  canvas.height = pageH;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, pageW, pageH);

  const lw = spec.w * dpi;
  const lh = spec.h * dpi;
  const m = spec.margin * dpi;
  const startX = (pageW - (spec.cols * lw + (spec.cols - 1) * m)) / 2;
  const startY = (pageH - (spec.rows * lh + (spec.rows - 1) * m)) / 2;

  const fs = parseInt(fontSizeEl.value, 10) || 24;
  const bg = bgEl.value;
  const fg = fgEl.value;

  let i = 0;
  for (let r = 0; r < spec.rows && i < names.length; r++) {
    for (let c = 0; c < spec.cols && i < names.length; c++) {
      const x = startX + c * (lw + m);
      const y = startY + r * (lh + m);
      ctx.fillStyle = bg;
      ctx.fillRect(x, y, lw, lh);
      ctx.strokeStyle = '#ccc';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, lw, lh);
      ctx.fillStyle = fg;
      ctx.font = `${fs}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const text = names[i];
      const maxW = lw - 8;
      let display = text;
      if (ctx.measureText(text).width > maxW) {
        while (ctx.measureText(display + '…').width > maxW && display.length > 1) display = display.slice(0, -1);
        display += '…';
      }
      ctx.fillText(display, x + lw / 2, y + lh / 2);
      i++;
    }
  }
  dlBtn.disabled = false;
}

genBtn.onclick = generate;
dlBtn.onclick = () => {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'labels.png';
  a.click();
};

namesEl.value = 'Alice Smith\nBob Jones\nCarol Lee\nDave Kim\nEve Patel';
generate();
</script>
</body>
</html>
