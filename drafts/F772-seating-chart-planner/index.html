<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating Chart</title>
<style>
:root { --bg:#0f1115; --card:#1a1d24; --accent:#4a9eff; --warn:#ff5a5a; --ok:#3dd68c; --text:#e8eaed; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); line-height:1.4; }
header { padding:1rem; text-align:center; border-bottom:1px solid #2a2e36; }
h1 { margin:0; font-size:1.4rem; }
.container { max-width:900px; margin:0 auto; padding:1rem; }
.panel { background:var(--card); border-radius:12px; padding:1rem; margin-bottom:1rem; }
label { display:block; margin:0.5rem 0 0.2rem; font-size:0.9rem; }
input, button, select { font-size:1rem; padding:0.5rem; border-radius:8px; border:1px solid #3a3f4a; background:#12141a; color:var(--text); }
button { background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:600; }
button:hover { filter:brightness(1.1); }
button.secondary { background:#3a3f4a; }
.row { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
.guest-pool, .tables { display:flex; flex-wrap:wrap; gap:0.5rem; min-height:60px; padding:0.5rem; background:#12141a; border-radius:8px; border:1px dashed #3a3f4a; }
.guest { background:#2a3140; padding:0.4rem 0.7rem; border-radius:20px; cursor:grab; user-select:none; touch-action:none; font-size:0.9rem; }
.guest.dragging { opacity:0.5; }
.table { background:#22262f; border:2px solid #3a3f4a; border-radius:12px; padding:0.6rem; min-width:140px; min-height:120px; }
.table.violation { border-color:var(--warn); }
.table h3 { margin:0 0 0.4rem; font-size:0.95rem; text-align:center; }
.seats { display:flex; flex-wrap:wrap; gap:0.3rem; min-height:40px; }
.constraint { font-size:0.85rem; padding:0.2rem 0.4rem; background:#2a2e36; border-radius:6px; margin:0.2rem; display:inline-block; }
.constraint.bad { background:var(--warn); color:#fff; }
.actions { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:1rem; }
#status { font-size:0.85rem; color:#8a9099; margin-top:0.5rem; }
canvas { display:none; }
</style>
</head>
<body>
<header>
  <h1>Seating Chart</h1>
  <p>Add guests, set tables, drag to arrange, download the chart.</p>
</header>
<div class="container">
  <div class="panel">
    <div class="row">
      <label>Tables <input type="number" id="numTables" value="2" min="1" max="20" style="width:60px"></label>
      <label>Seats each <input type="number" id="seatsEach" value="4" min="1" max="12" style="width:60px"></label>
      <button id="setupTables">Set tables</button>
    </div>
    <div class="row">
      <input type="text" id="guestName" placeholder="Guest name" style="flex:1">
      <button id="addGuest">Add guest</button>
    </div>
    <div id="guestPool" class="guest-pool"></div>
  </div>
  <div class="panel">
    <div class="row">
      <select id="cType"><option value="together">Keep together</option><option value="apart">Keep apart</option></select>
      <select id="cA"></select>
      <select id="cB"></select>
      <button id="addConstraint">Add constraint</button>
    </div>
    <div id="constraints"></div>
  </div>
  <div class="panel">
    <div id="tables" class="tables"></div>
  </div>
  <div class="actions">
    <button id="downloadPNG">Download PNG</button>
    <button id="downloadCSV" class="secondary">Download CSV</button>
    <button id="copySummary" class="secondary">Copy summary</button>
    <button id="clearAll" class="secondary">Clear</button>
  </div>
  <div id="status">Ready. Add guests and set tables.</div>
</div>
<canvas id="exportCanvas"></canvas>
<script>
const $ = id => document.getElementById(id);
let guests = []; // {id, name}
let tables = []; // {id, seats, occupants: [guestId]}
let constraints = []; // {type, a, b}
let nextId = 1;
let dragId = null;

function save() {
  const state = { guests, tables, constraints, nextId };
  try { localStorage.setItem('seating-chart', JSON.stringify(state)); } catch(e) {}
  updateShare();
}
function load() {
  try {
    const raw = localStorage.getItem('seating-chart');
    if (raw) {
      const s = JSON.parse(raw);
      guests = s.guests || [];
      tables = s.tables || [];
      constraints = s.constraints || [];
      nextId = s.nextId || 1;
    }
  } catch(e) {}
  if (location.hash.length > 1) {
    try {
      const decoded = JSON.parse(atob(location.hash.slice(1)));
      guests = decoded.guests || guests;
      tables = decoded.tables || tables;
      constraints = decoded.constraints || constraints;
      nextId = decoded.nextId || nextId;
    } catch(e) {}
  }
  render();
}
function updateShare() {
  const state = { guests, tables, constraints, nextId };
  try { history.replaceState(null, '', '#' + btoa(JSON.stringify(state))); } catch(e) {}
}

function setupTables() {
  const n = Math.max(1, parseInt($('numTables').value) || 2);
  const s = Math.max(1, parseInt($('seatsEach').value) || 4);
  tables = [];
  for (let i = 0; i < n; i++) {
    tables.push({ id: i+1, seats: s, occupants: [] });
  }
  // move all guests back to pool
  tables.forEach(t => t.occupants = []);
  save(); render();
}

function addGuest() {
  const name = $('guestName').value.trim();
  if (!name) return;
  guests.push({ id: nextId++, name });
  $('guestName').value = '';
  save(); render();
}

function addConstraint() {
  const a = parseInt($('cA').value);
  const b = parseInt($('cB').value);
  const type = $('cType').value;
  if (!a || !b || a === b) return;
  constraints.push({ type, a, b });
  save(); render();
}

function guestById(id) { return guests.find(g => g.id === id); }

function render() {
  // guest pool
  const pool = $('guestPool');
  pool.innerHTML = '';
  const placed = new Set(tables.flatMap(t => t.occupants));
  guests.filter(g => !placed.has(g.id)).forEach(g => {
    const el = document.createElement('div');
    el.className = 'guest';
    el.textContent = g.name;
    el.dataset.id = g.id;
    el.draggable = true;
    el.addEventListener('pointerdown', startDrag);
    pool.appendChild(el);
  });

  // tables
  const tDiv = $('tables');
  tDiv.innerHTML = '';
  tables.forEach(t => {
    const box = document.createElement('div');
    box.className = 'table';
    box.dataset.table = t.id;
    box.innerHTML = `<h3>Table ${t.id}</h3><div class="seats"></div>`;
    const seats = box.querySelector('.seats');
    t.occupants.forEach(gid => {
      const g = guestById(gid);
      if (!g) return;
      const el = document.createElement('div');
      el.className = 'guest';
      el.textContent = g.name;
      el.dataset.id = g.id;
      el.addEventListener('pointerdown', startDrag);
      seats.appendChild(el);
    });
    box.addEventListener('pointerup', dropOnTable);
    tDiv.appendChild(box);
  });

  // constraint selects
  const opts = guests.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
  $('cA').innerHTML = '<option value="">Guest A</option>' + opts;
  $('cB').innerHTML = '<option value="">Guest B</option>' + opts;

  // constraints list + violations
  const cDiv = $('constraints');
  cDiv.innerHTML = '';
  let violations = 0;
  constraints.forEach((c, i) => {
    const ga = guestById(c.a), gb = guestById(c.b);
    if (!ga || !gb) return;
    const el = document.createElement('span');
    el.className = 'constraint';
    el.textContent = `${ga.name} ${c.type === 'together' ? 'together with' : 'apart from'} ${gb.name}`;
    // check
    const ta = tables.find(t => t.occupants.includes(c.a));
    const tb = tables.find(t => t.occupants.includes(c.b));
    let bad = false;
    if (c.type === 'together') {
      if (!ta || !tb || ta.id !== tb.id) bad = true;
    } else {
      if (ta && tb && ta.id === tb.id) bad = true;
    }
    if (bad) { el.classList.add('bad'); violations++; }
    el.onclick = () => { constraints.splice(i,1); save(); render(); };
    cDiv.appendChild(el);
  });

  // highlight tables with violations
  document.querySelectorAll('.table').forEach(el => {
    const tid = parseInt(el.dataset.table);
    const hasBad = constraints.some(c => {
      const ta = tables.find(t => t.occupants.includes(c.a));
      const tb = tables.find(t => t.occupants.includes(c.b));
      if (!ta || !tb) return false;
      if (c.type === 'together' && ta.id !== tb.id && (ta.id === tid || tb.id === tid)) return true;
      if (c.type === 'apart' && ta.id === tb.id && ta.id === tid) return true;
      return false;
    });
    el.classList.toggle('violation', hasBad);
  });

  $('status').textContent = violations ? `${violations} constraint issue(s)` : 'All constraints satisfied';
}

function startDrag(e) {
  e.preventDefault();
  dragId = parseInt(e.currentTarget.dataset.id);
  e.currentTarget.classList.add('dragging');
  document.addEventListener('pointerup', endDrag);
}
function endDrag(e) {
  document.removeEventListener('pointerup', endDrag);
  document.querySelectorAll('.guest.dragging').forEach(el => el.classList.remove('dragging'));
  if (dragId == null) return;
  // find drop target
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tableEl = el && el.closest('.table');
  const poolEl = el && el.closest('.guest-pool');
  if (tableEl) {
    const tid = parseInt(tableEl.dataset.table);
    moveGuest(dragId, tid);
  } else if (poolEl) {
    moveGuest(dragId, null);
  }
  dragId = null;
}
function dropOnTable(e) { /* handled in endDrag */ }
function moveGuest(gid, toTableId) {
  // remove from current
  tables.forEach(t => {
    t.occupants = t.occupants.filter(id => id !== gid);
  });
  if (toTableId != null) {
    const t = tables.find(x => x.id === toTableId);
    if (t && t.occupants.length < t.seats) {
      t.occupants.push(gid);
    }
  }
  save(); render();
}

function downloadPNG() {
  const canvas = $('exportCanvas');
  const ctx = canvas.getContext('2d');
  const w = 800, h = 600;
  canvas.width = w; canvas.height = h;
  ctx.fillStyle = '#0f1115';
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#e8eaed';
  ctx.font = '24px system-ui';
  ctx.fillText('Seating Chart', 20, 40);
  let y = 80;
  tables.forEach(t => {
    ctx.fillStyle = '#1a1d24';
    ctx.fillRect(20, y, 760, 80);
    ctx.strokeStyle = '#3a3f4a';
    ctx.strokeRect(20, y, 760, 80);
    ctx.fillStyle = '#4a9eff';
    ctx.font = '18px system-ui';
    ctx.fillText(`Table ${t.id}`, 30, y+25);
    ctx.fillStyle = '#e8eaed';
    ctx.font = '16px system-ui';
    const names = t.occupants.map(id => guestById(id)?.name || '').join(', ');
    ctx.fillText(names || '(empty)', 30, y+50);
    y += 90;
  });
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'seating-chart.png';
  a.click();
}

function downloadCSV() {
  let csv = 'Table,Guest\n';
  tables.forEach(t => {
    t.occupants.forEach(id => {
      const g = guestById(id);
      if (g) csv += `${t.id},"${g.name.replace(/"/g,'""')}"\n`;
    });
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'seating-chart.csv';
  a.click();
}

function copySummary() {
  let text = 'Seating Chart\n\n';
  tables.forEach(t => {
    text += `Table ${t.id}: ${t.occupants.map(id => guestById(id)?.name).join(', ') || '(empty)'}\n`;
  });
  navigator.clipboard.writeText(text).then(() => {
    $('status').textContent = 'Summary copied';
  }).catch(() => {
    $('status').textContent = 'Copy failed';
  });
}

$('setupTables').onclick = setupTables;
$('addGuest').onclick = addGuest;
$('guestName').onkeydown = e => { if (e.key === 'Enter') addGuest(); };
$('addConstraint').onclick = addConstraint;
$('downloadPNG').onclick = downloadPNG;
$('downloadCSV').onclick = downloadCSV;
$('copySummary').onclick = copySummary;
$('clearAll').onclick = () => {
  if (confirm('Clear everything?')) {
    guests = []; tables = []; constraints = []; nextId = 1;
    localStorage.removeItem('seating-chart');
    render();
  }
};

// init
setupTables();
load();
</script>
</body>
</html>
