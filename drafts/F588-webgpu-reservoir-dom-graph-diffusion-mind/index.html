<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F588 WebGPU Reservoir DOM Graph Diffusion Mind — Verse</title>
<style>
body { margin:0; background:#0a0a12; color:#e0e0f0; font-family:system-ui; overflow:hidden; }
#ui { position:fixed; top:10px; left:10px; z-index:10; background:rgba(0,0,0,.7); padding:8px; border-radius:8px; font-size:13px; }
#canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
.node { position:absolute; width:60px; height:60px; border-radius:12px; border:2px solid #6ee7b7; background:rgba(20,30,40,.8); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; cursor:grab; user-select:none; transition:transform .05s; }
.node.high { border-color:#f59e0b; box-shadow:0 0 12px #f59e0b; }
</style>
</head>
<body>
<div id="ui">
  <div><strong>F588 Reservoir Graph Diffusion</strong></div>
  <button id="seal">Seal Genome</button>
  <button id="restore">Restore</button>
  <div id="status">init</div>
</div>
<canvas id="canvas"></canvas>
<div id="nodes"></div>
<script>
const N = 8;
const RES = 32; // reservoir size
let nodes = [];
let reservoir = Array(RES).fill(0);
let W_in = Array.from({length:RES}, () => Array(3).fill(0).map(() => (Math.random()-0.5)*0.5));
let W_res = Array.from({length:RES}, () => Array(RES).fill(0).map(() => (Math.random()-0.5)*0.1));
let W_out = Array.from({length:N}, () => Array(RES).fill(0).map(() => (Math.random()-0.5)*0.2));
let values = Array(N).fill(0.5);
let positions = Array.from({length:N}, () => [Math.random()*window.innerWidth, Math.random()*window.innerHeight]);
let orientation = {x:0, y:0};
let pointer = {x: window.innerWidth/2, y: window.innerHeight/2};
let dragging = -1;
let fitness = 0;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const nodesDiv = document.getElementById('nodes');
const status = document.getElementById('status');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Create DOM nodes
for (let i = 0; i < N; i++) {
  const el = document.createElement('div');
  el.className = 'node';
  el.textContent = 'N' + i;
  el.style.left = positions[i][0] + 'px';
  el.style.top = positions[i][1] + 'px';
  el.dataset.i = i;
  el.addEventListener('pointerdown', e => { dragging = i; e.target.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (dragging === i) {
      positions[i] = [e.clientX - 30, e.clientY - 30];
      el.style.left = positions[i][0] + 'px';
      el.style.top = positions[i][1] + 'px';
    }
  });
  el.addEventListener('pointerup', () => { dragging = -1; });
  nodesDiv.appendChild(el);
  nodes.push(el);
}

window.addEventListener('deviceorientation', e => {
  orientation.x = (e.gamma || 0) / 90;
  orientation.y = (e.beta || 0) / 90;
});
window.addEventListener('pointermove', e => {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  if (!window.DeviceOrientationEvent) {
    orientation.x = (e.clientX / window.innerWidth - 0.5) * 2;
    orientation.y = (e.clientY / window.innerHeight - 0.5) * 2;
  }
});

// Reservoir step
function stepReservoir(input) {
  const newRes = Array(RES).fill(0);
  for (let i = 0; i < RES; i++) {
    let s = 0;
    for (let j = 0; j < 3; j++) s += W_in[i][j] * input[j];
    for (let j = 0; j < RES; j++) s += W_res[i][j] * reservoir[j];
    newRes[i] = Math.tanh(s);
  }
  reservoir = newRes;
}

// Simple graph diffusion (CPU for reliability; WebGPU path sketched)
function diffuse() {
  const newVals = values.slice();
  for (let i = 0; i < N; i++) {
    let sum = 0, count = 0;
    for (let j = 0; j < N; j++) if (i !== j) {
      const dx = positions[i][0] - positions[j][0];
      const dy = positions[i][1] - positions[j][1];
      const d = Math.hypot(dx, dy);
      if (d < 180) {
        sum += values[j];
        count++;
      }
    }
    if (count) newVals[i] = values[i] * 0.7 + (sum / count) * 0.3;
  }
  values = newVals;
}

// Output from reservoir to node targets
function applyOutput() {
  const input = [orientation.x, orientation.y, (pointer.x / window.innerWidth - 0.5) * 2];
  stepReservoir(input);
  for (let i = 0; i < N; i++) {
    let o = 0;
    for (let j = 0; j < RES; j++) o += W_out[i][j] * reservoir[j];
    const target = Math.tanh(o);
    // Attract positions toward target offset based on value
    const attractX = window.innerWidth * (0.5 + target * 0.3);
    const attractY = window.innerHeight * (0.5 + Math.sin(i + fitness) * 0.2);
    positions[i][0] += (attractX - positions[i][0]) * 0.02;
    positions[i][1] += (attractY - positions[i][1]) * 0.02;
    // Soft bounds
    positions[i][0] = Math.max(20, Math.min(window.innerWidth - 80, positions[i][0]));
    positions[i][1] = Math.max(20, Math.min(window.innerHeight - 80, positions[i][1]));
    nodes[i].style.left = positions[i][0] + 'px';
    nodes[i].style.top = positions[i][1] + 'px';
    const v = values[i];
    nodes[i].style.background = `hsla(${v * 360}, 70%, 30%, 0.85)`;
    nodes[i].classList.toggle('high', v > 0.6);
    nodes[i].textContent = 'N' + i + ' ' + v.toFixed(2);
  }
}

function computeFitness() {
  // Coherence: low variance of values + clustering
  const mean = values.reduce((a,b)=>a+b,0)/N;
  const var_ = values.reduce((a,b)=>a+(b-mean)**2,0)/N;
  fitness = 1 / (1 + var_ * 10);
  status.textContent = `fit ${fitness.toFixed(3)} | ori ${orientation.x.toFixed(2)},${orientation.y.toFixed(2)}`;
}

function mutateGenome() {
  for (let i = 0; i < RES; i++) {
    for (let j = 0; j < RES; j++) if (Math.random() < 0.05) W_res[i][j] += (Math.random()-0.5)*0.05;
    for (let j = 0; j < 3; j++) if (Math.random() < 0.05) W_in[i][j] += (Math.random()-0.5)*0.05;
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < RES; j++) if (Math.random() < 0.05) W_out[i][j] += (Math.random()-0.5)*0.05;
}

async function seal() {
  const data = { W_in, W_res, W_out, positions, values, fitness };
  const db = await idbOpen();
  const tx = db.transaction('genomes', 'readwrite');
  tx.objectStore('genomes').put(data, 'best');
  await tx.complete;
  status.textContent = 'Sealed to IndexedDB';
}

async function restore() {
  const db = await idbOpen();
  const tx = db.transaction('genomes', 'readonly');
  const data = await tx.objectStore('genomes').get('best');
  if (data) {
    W_in = data.W_in; W_res = data.W_res; W_out = data.W_out;
    positions = data.positions; values = data.values; fitness = data.fitness || 0;
    status.textContent = 'Restored sealed genome';
  }
}

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('verse-f588', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('genomes');
    r.onsuccess = () => res(r.result);
    r.onerror = rej;
  });
}

document.getElementById('seal').onclick = seal;
document.getElementById('restore').onclick = restore;

// BroadcastChannel for multi-tab genome transfer
const bc = new BroadcastChannel('f588-genome');
bc.onmessage = e => {
  if (e.data.fitness > fitness) {
    W_in = e.data.W_in; W_res = e.data.W_res; W_out = e.data.W_out;
    mutateGenome();
    status.textContent = 'Adopted higher genome from peer';
  }
};

function loop() {
  diffuse();
  applyOutput();
  computeFitness();
  // Draw edges
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = 'rgba(110,231,183,0.3)';
  for (let i = 0; i < N; i++) for (let j = i+1; j < N; j++) {
    const d = Math.hypot(positions[i][0]-positions[j][0], positions[i][1]-positions[j][1]);
    if (d < 180) {
      ctx.beginPath();
      ctx.moveTo(positions[i][0]+30, positions[i][1]+30);
      ctx.lineTo(positions[j][0]+30, positions[j][1]+30);
      ctx.stroke();
    }
  }
  // Periodic seal offer
  if (Math.random() < 0.01) bc.postMessage({ W_in, W_res, W_out, fitness });
  if (Math.random() < 0.02) mutateGenome();
  requestAnimationFrame(loop);
}
restore().then(loop).catch(loop);

// WebGPU sketch (optional enhancement, falls back gracefully)
if (navigator.gpu) {
  status.textContent += ' | WebGPU available (CPU diffusion active)';
}
</script>
</body>
</html>
