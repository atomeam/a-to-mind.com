<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label and Name Tag Sheet — Verse</title>
<style>
  :root { --bg:#0f1115; --fg:#e8e8e8; --acc:#4da3ff; --card:#1a1d24; --border:#2a2e38; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); line-height:1.4; }
  header { padding:1rem 1.2rem; border-bottom:1px solid var(--border); }
  h1 { margin:0; font-size:1.4rem; }
  .sub { opacity:.7; font-size:.9rem; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:1rem; padding:1rem; max-width:1400px; margin:0 auto; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  section { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; }
  label { display:block; margin:.6rem 0 .2rem; font-size:.85rem; opacity:.9; }
  textarea, select, input[type=number] { width:100%; background:#12141a; color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:.4rem .5rem; font:inherit; }
  textarea { min-height:160px; resize:vertical; }
  .row { display:flex; gap:.5rem; }
  .row > * { flex:1; }
  button { background:var(--acc); color:#000; border:0; border-radius:4px; padding:.55rem 1rem; font-weight:600; cursor:pointer; margin-top:.8rem; }
  button.secondary { background:#333; color:var(--fg); }
  #preview-wrap { overflow:auto; background:#111; border-radius:6px; min-height:480px; position:relative; }
  #sheet { position:relative; background:#fff; color:#111; margin:1rem auto; box-shadow:0 4px 24px #0008; }
  .label-card { position:absolute; border:1px dashed #ccc; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; cursor:grab; user-select:none; background:#fafafa; overflow:hidden; word-break:break-word; padding:2px; }
  .label-card.dragging { opacity:.6; z-index:10; cursor:grabbing; }
  .stats { font-size:.85rem; opacity:.8; margin-top:.5rem; }
  footer { text-align:center; padding:1rem; opacity:.5; font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>Label and name tag sheet</h1>
  <div class="sub">Paste names · set paper &amp; label size · drag to reorder · download printable PNG</div>
</header>
<main>
  <section>
    <label>Names (one per line)</label>
    <textarea id="names" placeholder="Alice Chen&#10;Bob Rivera&#10;Carol Kim&#10;..."></textarea>
    <div class="row">
      <div>
        <label>Paper</label>
        <select id="paper">
          <option value="letter">Letter (8.5×11 in)</option>
          <option value="a4">A4 (210×297 mm)</option>
        </select>
      </div>
      <div>
        <label>Unit</label>
        <select id="unit">
          <option value="in">inches</option>
          <option value="mm">millimetres</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Label width</label>
        <input type="number" id="lw" value="2.625" step="0.125" min="0.5">
      </div>
      <div>
        <label>Label height</label>
        <input type="number" id="lh" value="1" step="0.125" min="0.5">
      </div>
    </div>
    <label>Font size (pt)</label>
    <input type="number" id="fs" value="14" min="8" max="36">
    <button id="apply">Update sheet</button>
    <button id="download" class="secondary">Download PNG</button>
    <button id="copy" class="secondary">Copy names</button>
    <div class="stats" id="stats"></div>
  </section>
  <section>
    <div id="preview-wrap"><div id="sheet"></div></div>
  </section>
</main>
<footer>Verse · offline after load · nothing leaves your device</footer>

<script>
const $ = id => document.getElementById(id);
const DPI = 96; // CSS px per inch for preview
const PRINT_DPI = 150;

const paperSizes = {
  letter: { w: 8.5, h: 11 },
  a4: { w: 210/25.4, h: 297/25.4 } // inches
};

let names = [];
let order = [];
let dragIdx = null;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('verse-f661') || '{}');
    if (s.names) $('names').value = s.names;
    if (s.paper) $('paper').value = s.paper;
    if (s.unit) $('unit').value = s.unit;
    if (s.lw) $('lw').value = s.lw;
    if (s.lh) $('lh').value = s.lh;
    if (s.fs) $('fs').value = s.fs;
  } catch {}
  apply();
}
function save() {
  localStorage.setItem('verse-f661', JSON.stringify({
    names: $('names').value,
    paper: $('paper').value,
    unit: $('unit').value,
    lw: +$('lw').value,
    lh: +$('lh').value,
    fs: +$('fs').value
  }));
}

function getDims() {
  const unit = $('unit').value;
  let lw = +$('lw').value, lh = +$('lh').value;
  if (unit === 'mm') { lw /= 25.4; lh /= 25.4; }
  const p = paperSizes[$('paper').value];
  return { lw, lh, pw: p.w, ph: p.h };
}

function apply() {
  names = $('names').value.split('\n').map(s => s.trim()).filter(Boolean);
  order = names.map((_,i) => i);
  render();
  save();
}

function render() {
  const { lw, lh, pw, ph } = getDims();
  const margin = 0.25; // inches
  const usableW = pw - 2*margin;
  const usableH = ph - 2*margin;
  const cols = Math.max(1, Math.floor(usableW / lw));
  const rows = Math.max(1, Math.floor(usableH / lh));
  const capacity = cols * rows;
  const scale = Math.min(700 / (pw * DPI), 900 / (ph * DPI));
  const sheet = $('sheet');
  sheet.style.width = (pw * DPI * scale) + 'px';
  sheet.style.height = (ph * DPI * scale) + 'px';
  sheet.innerHTML = '';
  const placed = Math.min(names.length, capacity);
  for (let i = 0; i < placed; i++) {
    const idx = order[i];
    const r = Math.floor(i / cols);
    const c = i % cols;
    const card = document.createElement('div');
    card.className = 'label-card';
    card.textContent = names[idx];
    card.style.left = ((margin + c * lw) * DPI * scale) + 'px';
    card.style.top = ((margin + r * lh) * DPI * scale) + 'px';
    card.style.width = (lw * DPI * scale - 2) + 'px';
    card.style.height = (lh * DPI * scale - 2) + 'px';
    card.style.fontSize = (+$('fs').value * scale * 0.7) + 'px';
    card.dataset.pos = i;
    card.addEventListener('pointerdown', onDown);
    sheet.appendChild(card);
  }
  const overflow = Math.max(0, names.length - capacity);
  $('stats').textContent = `${placed} of ${names.length} names · ${cols}×${rows} grid · ${overflow} overflow · paper ${pw.toFixed(1)}×${ph.toFixed(1)} in`;
}

function onDown(e) {
  dragIdx = +e.currentTarget.dataset.pos;
  e.currentTarget.classList.add('dragging');
  e.currentTarget.setPointerCapture(e.pointerId);
  const move = ev => {
    const cards = [...document.querySelectorAll('.label-card')];
    cards.forEach(c => c.style.outline = '');
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    if (el && el.classList.contains('label-card') && el !== e.currentTarget) {
      el.style.outline = '2px solid #4da3ff';
    }
  };
  const up = ev => {
    e.currentTarget.classList.remove('dragging');
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    if (el && el.classList.contains('label-card')) {
      const target = +el.dataset.pos;
      if (target !== dragIdx) {
        const tmp = order[dragIdx];
        order[dragIdx] = order[target];
        order[target] = tmp;
        render();
      }
    }
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

async function downloadPNG() {
  const { lw, lh, pw, ph } = getDims();
  const margin = 0.25;
  const usableW = pw - 2*margin;
  const usableH = ph - 2*margin;
  const cols = Math.max(1, Math.floor(usableW / lw));
  const rows = Math.max(1, Math.floor(usableH / lh));
  const canvas = document.createElement('canvas');
  canvas.width = pw * PRINT_DPI;
  canvas.height = ph * PRINT_DPI;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#111';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fontPx = +$('fs').value * PRINT_DPI / 72;
  ctx.font = `600 ${fontPx}px system-ui, sans-serif`;
  const placed = Math.min(names.length, cols*rows);
  for (let i = 0; i < placed; i++) {
    const idx = order[i];
    const r = Math.floor(i / cols);
    const c = i % cols;
    const x = (margin + c * lw + lw/2) * PRINT_DPI;
    const y = (margin + r * lh + lh/2) * PRINT_DPI;
    // light border
    ctx.strokeStyle = '#ddd';
    ctx.strokeRect((margin + c*lw)*PRINT_DPI, (margin + r*lh)*PRINT_DPI, lw*PRINT_DPI, lh*PRINT_DPI);
    ctx.fillText(names[idx], x, y);
  }
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'name-tags.png';
    a.click();
  }, 'image/png');
}

$('apply').onclick = apply;
$('download').onclick = downloadPNG;
$('copy').onclick = () => navigator.clipboard.writeText(names.join('\n'));
['names','paper','unit','lw','lh','fs'].forEach(id => $(id).addEventListener('change', apply));
$('names').addEventListener('input', () => setTimeout(apply, 300));

load();
</script>
</body>
</html>
