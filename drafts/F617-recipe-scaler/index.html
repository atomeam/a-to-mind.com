<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Scaler — Verse</title>
<style>
  :root { --bg: #0f1419; --fg: #e6edf3; --accent: #58a6ff; --card: #161b22; --border: #30363d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.5; padding: 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  p.note { color: #8b949e; font-size: 0.9rem; margin: 0 0 1rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 0.25rem; }
  input[type="number"], textarea { width: 100%; background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; font: inherit; }
  textarea { min-height: 180px; resize: vertical; }
  #output { min-height: 180px; white-space: pre-wrap; }
  button { background: var(--accent); color: #0d1117; border: none; border-radius: 6px; padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  @media (max-width: 600px) { .row { flex-direction: column; } }
</style>
</head>
<body>
<h1>Recipe scaler</h1>
<p class="note">Paste a recipe, one ingredient per line. Set servings and every quantity scales. Copy or download the result. Works offline; nothing leaves this device.</p>

<div class="row">
  <div style="flex:1; min-width:140px">
    <label for="orig">Original servings</label>
    <input type="number" id="orig" min="0.5" step="0.5" value="4">
  </div>
  <div style="flex:1; min-width:140px">
    <label for="news">New servings</label>
    <input type="number" id="news" min="0.5" step="0.5" value="6">
  </div>
</div>

<div class="card">
  <label for="input">Recipe (ingredients)</label>
  <textarea id="input" placeholder="2 cups all-purpose flour&#10;1/2 tsp salt&#10;1 1/2 cups milk&#10;Instructions: mix well"></textarea>
</div>

<div class="card">
  <label for="output">Scaled recipe</label>
  <textarea id="output" readonly></textarea>
  <div class="actions">
    <button id="copy">Copy</button>
    <button id="download" class="secondary">Download .txt</button>
    <button id="clear" class="secondary">Clear</button>
  </div>
</div>

<script>
const KEY = 'verse-f617-recipe';
const inputEl = document.getElementById('input');
const origEl = document.getElementById('orig');
const newsEl = document.getElementById('news');
const outputEl = document.getElementById('output');

function load() {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const data = JSON.parse(saved);
      inputEl.value = data.recipe || '';
      origEl.value = data.orig || 4;
      newsEl.value = data.news || 6;
    }
  } catch (e) {}
  scale();
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      recipe: inputEl.value,
      orig: origEl.value,
      news: newsEl.value
    }));
  } catch (e) {}
}

// Parse leading quantity: 2, 2.5, 1/2, 1 1/2, 1½ etc.
function parseQty(line) {
  const m = line.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+\.?\d*|\d*\.?\d+)\s*(.*)$/);
  if (!m) return null;
  let numStr = m[1].trim();
  let rest = m[2] || '';
  let value = 0;
  if (numStr.includes('/')) {
    if (numStr.includes(' ')) {
      const [whole, frac] = numStr.split(/\s+/);
      const [n, d] = frac.split('/').map(Number);
      value = Number(whole) + n / d;
    } else {
      const [n, d] = numStr.split('/').map(Number);
      value = n / d;
    }
  } else {
    value = parseFloat(numStr);
  }
  if (isNaN(value)) return null;
  return { value, rest: rest.trim(), original: line };
}

function toFraction(n) {
  if (n <= 0) return '0';
  const frac = Math.round(n * 48) / 48; // practical
  const whole = Math.floor(frac);
  const rem = frac - whole;
  const fracs = [
    [0, ''],
    [1/4, '¼'],
    [1/3, '⅓'],
    [1/2, '½'],
    [2/3, '⅔'],
    [3/4, '¾'],
    [1, '']
  ];
  let closest = fracs.reduce((a, b) => Math.abs(b[0] - rem) < Math.abs(a[0] - rem) ? b : a);
  if (Math.abs(closest[0] - rem) > 0.05) {
    return n.toFixed(n < 10 ? 2 : 1).replace(/\.?0+$/, '');
  }
  if (whole === 0) return closest[1] || n.toFixed(2);
  if (closest[1] === '') return String(whole);
  return whole + ' ' + closest[1];
}

function scale() {
  const orig = parseFloat(origEl.value) || 1;
  const news = parseFloat(newsEl.value) || 1;
  const factor = orig > 0 ? news / orig : 1;
  const lines = inputEl.value.split('\n');
  const out = lines.map(line => {
    const p = parseQty(line);
    if (!p || p.value === 0) return line;
    const scaled = p.value * factor;
    const pretty = toFraction(scaled);
    // Try to keep unit if present
    const unitMatch = p.rest.match(/^([a-zA-Zµ°]+(?:s)?)\b(.*)$/);
    let unit = '', rest = p.rest;
    if (unitMatch) {
      unit = unitMatch[1] + ' ';
      rest = unitMatch[2].trim();
    }
    return (pretty + ' ' + unit + rest).trim();
  }).join('\n');
  outputEl.value = out;
  save();
}

inputEl.addEventListener('input', scale);
origEl.addEventListener('input', scale);
newsEl.addEventListener('input', scale);

document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(outputEl.value);
    const btn = document.getElementById('copy');
    const old = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = old, 1500);
  } catch (e) {
    outputEl.select();
    document.execCommand('copy');
  }
});

document.getElementById('download').addEventListener('click', () => {
  const blob = new Blob([outputEl.value], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scaled-recipe.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('clear').addEventListener('click', () => {
  inputEl.value = '';
  scale();
});

load();
</script>
</body>
</html>
