<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loan and mortgage payment · Verse</title>
<style>
:root { --bg:#0f1419; --fg:#e7ecf1; --muted:#8b98a5; --accent:#1d9bf0; --card:#1a2332; --border:#2f3b4a; --good:#00ba7c; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; padding:1rem; }
h1 { font-size:1.4rem; margin:0 0 0.5rem; }
p.lead { color:var(--muted); margin:0 0 1.2rem; font-size:0.95rem; }
form, .results, .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-bottom:1rem; }
label { display:block; margin:0.6rem 0 0.2rem; font-size:0.85rem; color:var(--muted); }
input, select { width:100%; padding:0.6rem; border-radius:8px; border:1px solid var(--border); background:#0f1419; color:var(--fg); font-size:1rem; }
button { background:var(--accent); color:#fff; border:none; padding:0.7rem 1rem; border-radius:8px; font-size:1rem; cursor:pointer; margin:0.4rem 0.4rem 0.4rem 0; }
button.secondary { background:#2f3b4a; }
.row { display:flex; gap:0.5rem; flex-wrap:wrap; }
.row > * { flex:1; min-width:140px; }
.summary { font-size:1.1rem; margin:0.5rem 0; }
.summary strong { color:var(--good); }
table { width:100%; border-collapse:collapse; font-size:0.85rem; }
th, td { padding:0.4rem 0.5rem; text-align:right; border-bottom:1px solid var(--border); }
th { text-align:right; color:var(--muted); font-weight:500; }
td:first-child, th:first-child { text-align:left; }
.note { font-size:0.8rem; color:var(--muted); margin-top:0.5rem; }
.error { color:#f4212e; font-size:0.9rem; }
@media (max-width:600px) { body { padding:0.6rem; } }
</style>
</head>
<body>
<h1>Loan and mortgage payment</h1>
<p class="lead">Amount, rate and years in. Regular payment and a year-by-year table out. Download the schedule as CSV. Nothing leaves this device.</p>

<form id="f">
  <div class="row">
    <div>
      <label for="amount">Loan amount</label>
      <input id="amount" type="number" min="1" step="100" value="250000" required>
    </div>
    <div>
      <label for="rate">Annual interest rate (%)</label>
      <input id="rate" type="number" min="0" step="0.01" value="6.5" required>
    </div>
  </div>
  <div class="row">
    <div>
      <label for="years">Term (years)</label>
      <input id="years" type="number" min="1" max="50" step="1" value="30" required>
    </div>
    <div>
      <label for="extra">Extra payment per month (optional)</label>
      <input id="extra" type="number" min="0" step="10" value="0">
    </div>
  </div>
  <button type="submit">Calculate</button>
  <button type="button" class="secondary" id="reset">Reset</button>
</form>

<div class="results" id="results" hidden>
  <div class="summary" id="summary"></div>
  <button id="copy">Copy summary</button>
  <button id="csv" class="secondary">Download CSV</button>
  <p class="note" id="note"></p>
</div>

<div class="table-wrap" id="tableWrap" hidden>
  <h2 style="font-size:1rem;margin:0 0 0.5rem;">Year-by-year</h2>
  <table id="table">
    <thead><tr><th>Year</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'verse-loan-calc-v1';

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const d = JSON.parse(s);
      if (d.amount) $('amount').value = d.amount;
      if (d.rate) $('rate').value = d.rate;
      if (d.years) $('years').value = d.years;
      if (d.extra != null) $('extra').value = d.extra;
    }
  } catch (e) {}
}

function save(d) {
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
}

function calc() {
  const P = parseFloat($('amount').value) || 0;
  const annual = parseFloat($('rate').value) || 0;
  const years = parseInt($('years').value) || 0;
  const extra = parseFloat($('extra').value) || 0;

  if (P <= 0 || years <= 0 || annual < 0) {
    return { error: 'Enter a positive amount, non-negative rate, and positive term.' };
  }
  if (years > 50) {
    return { error: 'Term limited to 50 years for this table.' };
  }

  const r = annual / 100 / 12;
  const n = years * 12;
  let monthly;
  if (r === 0) {
    monthly = P / n;
  } else {
    monthly = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
  }
  const payment = monthly + extra;

  let balance = P;
  const schedule = [];
  let totalInterest = 0;
  let yearPrincipal = 0, yearInterest = 0, yearPayment = 0;
  let month = 0;
  const maxMonths = n + 600; // safety

  while (balance > 0.01 && month < maxMonths) {
    month++;
    const interest = balance * r;
    let principal = payment - interest;
    if (principal > balance) principal = balance;
    const actualPayment = principal + interest;
    balance -= principal;
    if (balance < 0) balance = 0;

    totalInterest += interest;
    yearPrincipal += principal;
    yearInterest += interest;
    yearPayment += actualPayment;

    if (month % 12 === 0 || balance <= 0.01) {
      const yr = Math.ceil(month / 12);
      schedule.push({
        year: yr,
        payment: yearPayment,
        principal: yearPrincipal,
        interest: yearInterest,
        balance: balance
      });
      yearPrincipal = yearInterest = yearPayment = 0;
    }
  }

  const actualMonths = month;
  const actualYears = (actualMonths / 12).toFixed(1);

  return {
    monthly: monthly,
    payment: payment,
    totalInterest: totalInterest,
    totalPaid: P + totalInterest,
    schedule: schedule,
    actualMonths: actualMonths,
    actualYears: actualYears,
    originalMonths: n
  };
}

function fmt(n) {
  return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function render(res) {
  if (res.error) {
    $('results').hidden = false;
    $('summary').innerHTML = '<span class="error">' + res.error + '</span>';
    $('tableWrap').hidden = true;
    return;
  }

  const early = res.actualMonths < res.originalMonths;
  let html = `Monthly payment (incl. extra): <strong>$${fmt(res.payment)}</strong><br>`;
  html += `Base payment: $${fmt(res.monthly)} · Total interest: $${fmt(res.totalInterest)} · Total paid: $${fmt(res.totalPaid)}`;
  if (early) html += `<br>Paid off in ${res.actualYears} years (early by extra payments).`;
  $('summary').innerHTML = html;
  $('results').hidden = false;
  $('note').textContent = 'Standard amortization. Extra payments applied to principal. Not financial advice. Numbers are exact to the cent under the formula used.';

  const tbody = $('table').querySelector('tbody');
  tbody.innerHTML = '';
  res.schedule.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${row.year}</td><td>${fmt(row.payment)}</td><td>${fmt(row.principal)}</td><td>${fmt(row.interest)}</td><td>${fmt(row.balance)}</td>`;
    tbody.appendChild(tr);
  });
  $('tableWrap').hidden = false;

  window._lastRes = res;
  window._lastInputs = {
    amount: $('amount').value,
    rate: $('rate').value,
    years: $('years').value,
    extra: $('extra').value
  };
  save(window._lastInputs);
}

$('f').addEventListener('submit', e => {
  e.preventDefault();
  render(calc());
});

$('reset').addEventListener('click', () => {
  $('amount').value = 250000;
  $('rate').value = 6.5;
  $('years').value = 30;
  $('extra').value = 0;
  $('results').hidden = true;
  $('tableWrap').hidden = true;
  try { localStorage.removeItem(KEY); } catch (e) {}
});

$('copy').addEventListener('click', () => {
  if (!window._lastRes || window._lastRes.error) return;
  const r = window._lastRes;
  const text = `Loan $${fmt(parseFloat($('amount').value))} at ${$('rate').value}% for ${$('years').value} years` +
    (parseFloat($('extra').value) > 0 ? ` (+$${fmt(parseFloat($('extra').value))} extra/mo)` : '') +
    `: $${fmt(r.payment)}/mo, total interest $${fmt(r.totalInterest)}, total paid $${fmt(r.totalPaid)}` +
    (r.actualMonths < r.originalMonths ? ` (paid off in ${r.actualYears} yrs)` : '');
  navigator.clipboard.writeText(text).then(() => {
    const b = $('copy');
    const o = b.textContent;
    b.textContent = 'Copied';
    setTimeout(() => b.textContent = o, 1500);
  }).catch(() => alert('Copy failed'));
});

$('csv').addEventListener('click', () => {
  if (!window._lastRes || window._lastRes.error) return;
  let csv = 'Year,Payment,Principal,Interest,Balance\n';
  window._lastRes.schedule.forEach(row => {
    csv += `${row.year},${row.payment.toFixed(2)},${row.principal.toFixed(2)},${row.interest.toFixed(2)},${row.balance.toFixed(2)}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'amortization.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

load();
// auto-calc on load if saved
if ($('amount').value) render(calc());
</script>
</body>
</html>
